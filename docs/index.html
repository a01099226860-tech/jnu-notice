<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JNU 공지 한눈에</title>
  <meta name="description" content="제주대학교 공지사항을 탭별로 모아 마감일·등록금 일정·혜택 뉴스·제주 날씨와 함께 보여주는 학생용 비공식 서비스">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232449A3'/%3E%3Cpath d='M9 25c-2-6 1-12 4-17' stroke='%231CB1EC' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M13 25c-2-7 2-13 5-19' stroke='%235DBE35' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M23 10v10a5 5 0 0 1-9 3' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="hero">
    <svg class="hero-waves" viewBox="0 0 400 300" aria-hidden="true" preserveAspectRatio="xMaxYMid slice">
      <path d="M210 300 C 150 220, 170 120, 250 20" stroke="var(--sky)" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="M260 300 C 200 210, 230 110, 320 0" stroke="var(--green)" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M320 300 C 260 200, 300 100, 400 20" stroke="var(--gray)" stroke-width="34" fill="none" stroke-linecap="round" opacity=".55"/>
    </svg>
    <div class="wrap hero-inner">
      <div class="hero-text">
        <p class="eyebrow">제주대학교 학생을 위한 공지 모아보기</p>
        <h1>JNU 공지 <span>한눈에</span></h1>
        <p class="sub">봉사·수업·일반·장학·등록·행사 공지를 탭별로 정리하고 마감일을 뽑아드려요.</p>
        <p class="updated" id="updated">불러오는 중…</p>
      </div>
      <aside class="weather" id="weather" aria-label="제주 날씨 알리미">
        <div class="weather-loading">날씨 불러오는 중…</div>
      </aside>
    </div>
  </header>

  <nav class="tabs-bar" aria-label="카테고리">
    <div class="wrap">
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </nav>

  <main class="wrap">
    <section class="toolbar" id="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="제목, 부서, 기관 검색" autocomplete="off">
      </label>
      <div class="toolbar-right" id="noticeOptions">
        <label class="toggle"><input type="checkbox" id="hideClosed" checked> 마감 지난 글 숨기기</label>
        <select id="sort" aria-label="정렬">
          <option value="recent">최신순</option>
          <option value="deadline">마감 임박순</option>
          <option value="views">조회수순</option>
        </select>
      </div>
    </section>

    <!-- 공지 목록 (전체·봉사·수업·일반·장학·행사) -->
    <div id="noticeView">
      <section id="urgent" class="urgent" hidden>
        <h2>⏰ 이번 주 마감</h2>
        <div class="urgent-list" id="urgentList"></div>
      </section>
      <p class="result-info" id="resultInfo"></p>
      <section id="list" class="list" aria-live="polite"></section>
    </div>

    <!-- 등록: 등록금 캘린더 -->
    <div id="calendarView" hidden>
      <section class="alerts" id="tuitionAlerts" aria-live="polite"></section>
      <section class="calendar">
        <div class="cal-head">
          <button class="icon-btn" id="calPrev" aria-label="이전 달">‹</button>
          <h2 id="calTitle"></h2>
          <button class="icon-btn" id="calNext" aria-label="다음 달">›</button>
          <button class="today-btn" id="calToday">오늘</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
      <h3 class="sec-title">이 달의 등록 일정</h3>
      <section class="list" id="calList"></section>
      <h3 class="sec-title">등록 공지 전체</h3>
      <section class="list" id="tuitionList"></section>
    </div>

    <!-- 혜택 뉴스 -->
    <div id="newsView" hidden>
      <div class="filter-chips" id="newsTags"></div>
      <p class="result-info" id="newsInfo"></p>
      <section class="news-list" id="newsList"></section>
    </div>
  </main>

  <footer class="wrap footer">
    <p>이 사이트는 학생이 만든 <strong>비공식</strong> 서비스이며 제주대학교와 무관합니다. 마감일·납부기간은 본문에서 자동 추출한 <em>추정치</em>이니 반드시 원문을 확인하세요.</p>
    <p>원문: <a href="https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm" target="_blank" rel="noopener">제주대학교 공지사항</a> · 뉴스: Google 뉴스 · 날씨: <a href="https://api.met.no/" target="_blank" rel="noopener">MET Norway</a> (CC BY 4.0)</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
