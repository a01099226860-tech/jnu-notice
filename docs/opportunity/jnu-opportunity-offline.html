: "「고등교육법」 제59조의10 및 같은 법 시행령 제71조의11제1항제2호에 따라, 고등교육 규제특례 신청 전 의견 수렴을 실시하오니,\n의견이 있는 경우 2026. 10. 6.(화)까지 검토의견서를 제출하여 주시기 바랍니다.\n가. 주요내용\n규제특례명\n특례 요청 규제\n및 근거 법령\n적용 대상\n적용기간\n비고\n정부ㆍ지자체 지정ㆍ관리 산업체 및 공공기관ㆍ출연연 대상 표준 현장실습 실습지원비 지원 비율 확대\n「대학생 현장실습학기제 운영규정」(교육부 고시) 제30조제5항제3호 ― 국고 및 지방비 지급 수준\n(최저임금액의 100분의 25) 상향(100분의 50)\n제주대학교\n표준 현장실습학기제 운영 전 학과(부)\n2027. 1. 1. ~ 2030. 12. 31.\n(4년)\n나. 의견수렴 기간: 2026. 9. 30.(수) ~ 2026. 10. 6.(화)\n다. 의견 제출방법: 검토의견서 작성 후 담당자 전자우편 제출(c2660@jejunu.ac.kr)", "attachments": [{"name": "고등교육 규제특례 신청서.hwpx (89 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281554&no=1"}, {"name": "(고등교육 규제특례) 검토의견서 양식.hwpx (21 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281554&no=2"}], "deadline": "2026-10-06", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281554"}, {"seq": 281530, "cat": "general", "title": "(글로컬)2026학년도 글로벌 RC 튜터링 활동 모집 안내", "author": "글로벌자율전공", "date": "2026-09-30", "views": 5329, "pinned": false, "posted": "2026-09-30 11:26", "excerpt": "(글로컬)2026학년도 글로벌 RC 튜터링 활동 모집 안내\n문의: 글로벌자율전공사무실 064-754-4640", "attachments": [{"name": "글로벌 RC 튜터링_홍보 포스터(down).jpg (206 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281530&no=1"}, {"name": "(융합)전공 RC 튜터링_모집공고.pdf (122 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281530&no=2"}], "deadline": null, "org": "글로컬", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "글로벌자율전공사무실 064-754-4640", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281530"}, {"seq": 281522, "cat": "general", "title": "[육성] '독일영화와 인문학의 만남' 프로그램 안내", "author": "독일학과", "date": "2026-09-30", "views": 5774, "pinned": false, "posted": "2026-09-30 10:09", "excerpt": "<2026 독일영화와 인문학의 만남> 프로그램을 아래와 같이 안내하오니 우리학교 재학생들의 많은 관심과 참여 바랍니다.\n1. 운영기간\n1회) 2026. 9. 30.(수) 17:00~\n2회) 2026. 10. 28.(수) 17:00~\n3회) 2026. 11. 25.(수) 17:00~\n2. 장소: 인문대학 2호관 1층 현석재\n3. 시상: 우수 비평문(또는 감상문)에 대해 시상 및 상금 지급 예정", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": "우수 비평문(또는 감상문)에 대해 시상 및 상금 지급 예정", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281522"}, {"seq": 281506, "cat": "general", "title": "2026-2학기 학생생활관 입주학생(전체) 수시 모집 안내", "author": "학생생활관", "date": "2026-09-29", "views": 5020, "pinned": false, "posted": "2026-09-29 16:27", "excerpt": "1. 학생생활관 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭 확인해 주세요.\n또한, 입주기간 변경이 어려우니 신청 시 입주기간을 신중히 결정하시어 신청하시기 바랍니다.\n※ 2026-1학기에 입주했던 학생은 폐결핵 검사 결과서 제출 생략\n2. 모집일정 및 신청방법\n가. 모집일정\n구분\n일정\n비고\n입주 신청 기간\n2026. 9. 3.(목) 09:00 ~ 종료 안내 시까지\n- 신청 선착순에 따라 담당자가 전화나 문자로 안내합니다.\n생활관비 수납\n- 합격처리 후 별도 안내\n- 합격처리일 당일 생활관비 납부 필수\n※ 모집일정은 사정에 따라 변경될 수 있으며 변경 시 홈페이지 공지 예정\n나. 신청방법: [붙임 1] 참조\n1) 포털시스템 → 교내활동 → 학생생활관(아라) → [입주신청] 접속 → 신청건물, 사용기간, 거리구분, 관리비 분납 유무 등 입력\n→ 제출서류 파일 업로드 → 화면 하단 [입주신청] 클릭 → 개인정보 등 동의\n2) 생활관비(관리비) 분할납부는 없음\n※ 기 합격자가 수시 …", "attachments": [{"name": "2026-2학기 학생생활관 입주학생(전체) 수시 모집 안내(문).pdf (343 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281506&no=1"}, {"name": "[별표 1] 2026학년도 2학기 입주퇴사금액.pdf (469 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281506&no=2"}], "deadline": "2026-09-29", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "[붙임 1] 참조", "contact":  "date": "2026-09-29", "views": 4902, "pinned": false, "posted": "2026-09-29 10:04", "excerpt": "제주대학교 기초과학연구소에서는 「2026 JEJU CIS 시민과학 앱 고도화 공모전」 참가팀을 추가 모집합니다.\n\"JEJU CIS 시민과학대학 앱\"은 시민과학대학 참여자와 도민이 야외조사·모니터링 현장에서 관찰한 생물 정보를 기록·관리하는 앱입니다. 이번 공모전은 앱의 기능과 사용 편의를 개선하고 새로운 기능을 개발하기 위해 마련되었습니다.\n관심 있는 제주대학교 대학(원)생의 많은 참여 바랍니다.\n1.참가 대상\n*제주대학교 대학(원) 재학생\n*개인 또는 팀(2~3인), 전공 제한 없음\n2.접수 기간\n*2026. 9. 16.(수)~10. 05.(월)\n3.앱 개발 필수 요소\n※ 아래 세 가지 요소를 모두 수행하여 하나의 결과물로 제출\n1)기능 고도화: 기존 기능 개선 또는 새로운 기능 구현\n2)사용자 활성화: 포인트·배지·미션 등 지속적인 사용을 유도하는 기능 구현\n3)신규 기능개발: 데이터 활용·연구 연계·교육·홍보 등 추가 아이디어 구현\n4.접수 방법\n*참가신청서 및 개발계획서 이메…", "attachments": [{"name": "2026 JEJU CIS 앱 고도화 공모전 개최 계획(안)_공지.docx (31 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281484&no=1"}, {"name": "2026 JEJU CIS 앱 고도화 공모전 참가신청서 및 개발계획서.docx (29 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281484&no=2"}, {"name": "JEJU CIS 앱 고도화 공모전 포스터.jpg (166 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281484&no=3"}], "deadline": "2026-10-05", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-8308", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281484"}, {"seq": 281478, "cat": "event", "title": "애월도서관 「2026 애월 북 페스티벌」 행사 개최 안내", "author": "학생복지과(학생)", "date": "2026-09-29", "views": 4942, "pinned": false, "posted": "2026-09-29 09:24", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281478"}, {"seq": 281468, "cat": "event", "title": "2026년 IPCC AR6 보고서의 이해와 확산을 위한 간담회 개최 안내", "author": "에너지기술공유대학 사업단", "date": "2026-09-28", "views": 4192, "pinned": false, "posted": "2026-09-28 17:16", "excerpt": "IPCC 기관의 주요활동과 AR6 보고서를 소개하고, 탄소중립에 대한 이해를 높이고자\n아래와 같이 전문가 간담회를 개최하오니 관심 있는 학생들의 많은 참여 바랍니다.\n* 일시 : 2026. 10. 1(목) 15:00 ~ 16:30\n* 장소 : 제주대학교 공과대학 1호관 강당\n* 초청 전문가 : 이회성 IPCC AR6 의장\n* 주요내용: IPCC AR6 보고서 주요 내용, IPCC 등 국제기구의 역할 및 관련 분야 참여 방법, 질의응답 및 의견 교류 등\n* 대상 : IPCC AR6에 관심있는 제주대학교 학생 등", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "IPCC AR6에 관심있는 제주대학교 학생 등", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281468"}, {"seq": 281464, "cat": "general", "title": "[SWEAT OUT] 2026 SWEAT OUT FESTIVAL 학생 부스 비대면 아이디어톤 참가자 모집", "author": "글로컬대학사업단", "date": "2026-09-28", "views": 5164, "pinned": false, "posted": "2026-09-28 15:46", "excerpt": "제주대학교 학생 주도 정신건강 프로젝트 SWEAT OUT(스웻아웃)에서\n오는 2026년 10월 8일(목) 개최되는 「2026 SWEAT OUT FESTIVAL」에서 실제 운영할 학생 기획 정신건강 체험부스 아이디어를 모집합니다.\n이번 아이디어톤은 별도의 대면 행사 없이 비대면 아이디어 공모 방식으로 진행됩니다.\n정해진 기획서 양식이나 전공 제한은 없습니다.\n“대학생들이 부담 없이 참여하면서 자신의 마음을 한 번 돌아볼 수 있는 부스를 만든다면 어떤 모습일까?”를 자유롭게 상상해 제안해 주세요.\n간호학, 심리학 등 관련 전공자가 아니어도 누구나 참여할 수 있습니다.\n■ 비대면 아이디어톤이란?\n이번 아이디어톤은 정신건강에 관한 내용을 단순히 설명하거나 전달하는 것을 넘어, 학생들이 직접 참여하고 경험할 수 있는 체험형 부스를 기획하는 프로그램입니다.\n여기서 말하는 ‘정신건강 부스’는 상담이나 정신질환에 대한 전문적인 설명을 제공하는 부스만을 의미하지 않습니다.\n대학생이라면 누구나 경험할…", "attachments": [{"name": "[SWEAT OUT] 비대면 아이디어톤 운영 계획안.docx (43 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281464&no=1"}, {"name": "[SWEAT OUT] 비대면 아이디어톤 FAQ.docx (29 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281464&no=2"}], "deadline": "2026-10-02", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281464"}, {"seq": 281463, "cat": "general", "title": "[육성] 「2026 글로벌 정치 역량 강화 프로그램 모의 유엔 회의」 대표단 모집", "author": "모의유엔회의 사무국", "date": "2026-09-28", "views": 5091, "pinned": false, "posted": "2026-09-28 15:11", "excerpt": "「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 대표단 모집\n안녕하십니까,\n「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 사무국입니다.\n국제정치와 국제기구에 관심 있는 학생이라면 주목해주세요!\n오는 11월 19일(목) ~ 20일(금) 이틀간 「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」를 개최합니다.\n🎁 참가 혜택\n① 비교과 마일리지 5,000점 지급\n→ 대학 기준 충족 시 최대 150만 원 상당 장학금으로 전환·지급\n② 공결 가능\n→ 11월 19일(목) ~ 20일(금) 프로그램 참여 시 공결 가능\n③ 숙박 및 식사 제공\n→ 이틀간 프로그램 참여에 필요한 숙박 및 식사 제공\n④ 총 상금 110만 원 규모 시상\n🏆 대상: 제주대학교 총장상 + 50만 원\n🥇 최우수상: 사회과학대학 학장상 + 30만 원\n🥈 우수상: 정치외교학과 학과장상 + 20만 원\n🏅 장려상: 10만 원\n🌏 어떤 프로그램인가요?\n이번 모의유엔회의는\n‘핵무기 확산 방지와 평화적 …", "attachments": [{"name": "포스터.jpg (5 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281463&no=1"}], "deadline": "2026-10-30", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "제주대학교 총장상 + 50만 원", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281463"}, {"seq": 281462, "cat": "general", "title": "[육성] 「2026 글로벌 정치 역량 강화 프로그램 모의 유엔 회의」 대표단 모집", "author": "모의유엔회의 사무국", "date": "2026-09-28", "views": 4833, "pinned": false, "posted": "2026-09-28 15:11", "excerpt": "「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 대표단 모집\n안녕하십니까,\n「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 사무국입니다.\n국제정치와 국제기구에 관심 있는 학생이라면 주목해주세요!\n오는 11월 19일(목) ~ 20일(금) 이틀간 「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」를 개최합니다.\n🎁 참가 혜택\n① 비교과 마일리지 5,000점 지급\n→ 대학 기준 충족 시 최대 150만 원 상당 장학금으로 전환·지급\n② 공결 가능\n→ 11월 19일(목) ~ 20일(금) 프로그램 참여 시 공결 가능\n③ 숙박 및 식사 제공\n→ 이틀간 프로그램 참여에 필요한 숙박 및 식사 제공\n④ 총 상금 110만 원 규모 시상\n🏆 대상: 제주대학교 총장상 + 50만 원\n🥇 최우수상: 사회과학대학 학장상 + 30만 원\ s)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281457&no=1"}], "deadline": "2026-11-30", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재직 교원 및 재학 중인 대학(원)생 예비창업자(수료연구생 포함)", "benefit": "발명상담·컨설팅 각 건당 30만 원, 선행특허조사 건당 50만 원, 시제품 제작 건당 100만 원 한도", "how": "첨부된 공고문의 해당 프로그램 신청서와 제출서류를 작성하여 구글폼으로 제출", "contact": "제주대학교 RISE사업단 창업지원팀 ☎ 064-754-4571", "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281457"}, {"seq": 281446, "cat": "general", "title": "찾아가는 해외파견 교류수학 프로그램 설명회(1차) 개최 안내", "author": "국제교류처", "date": "2026-09-28", "views": 5022, "pinned": false, "posted": "2026-09-28 10:26", "excerpt": "찾아가는 해외파견 교류수학 프로그램 설명회 (1차) 를 개최함에 따라, 아래와 같이 안내드리오니\n관심있는 재학생들은 설명회에 많은 참여바랍니다.\n가. 운영일정\n단과대학\n날짜 및 시간\n장소\n인문대학\n2026. 9. 29.(화) 16:00~\n인문대학 2호관 현석재\n경상대학\n2026. 9. 30.(수) 16:00~\n경상대학 2호관 강당(0155호)\n사회과학대학\n2026. 10. 8.(목) 16:00~\n사회과학대학 행정대학원 세미나실\n자연과학대학\n2026. 10. 14.(수) 16:00~\n자연과학대학 1호관 대강당(9140호)\n공과대학\n2026. 10. 15.(목) 16:00~\n공과대학 1호관 7136호\n※ 기타 단과대학은 2차 설명회 개최 시 진행 예정\n나. 내용 : 해외파견 교류수학 프로그램 설명 및 SAF 방문학생 프로그램 소개\n다. 참석대상 : 해외파견 교류수학에 관심 있는 재학생\n(문의: 064-754-2198)", "attachments": [{"name": "찾아가는 해외파견 교류수학 프로그램 설명회.jpg (451 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281446&no=1"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281446"}, {"seq": 281444, "cat": "scholarship", "title": "2026년도 하반기 재단법인 논산시장학회 장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-09-28", "views": 4395, "pinned": false, "posted": "2026-09-28 10:18", "excerpt": "재단법인 논산시장학회 공고 제2026-02호\n2026년도 하반기 재단법인 논산시장학회 장학생 선발 공고\n우리 고장에 대한 애향심 및 자 o=1"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "①제주대학교 포털-교내활동-언어교육원-수강신청/강좌조회에서 신청 (링크:수강신청/강좌조회 - 제주대학교 포털 )", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281396"}, {"seq": 281392, "cat": "general", "title": "[SWEAT OUT] 2026 SWEAT OUT FESTIVAL 참가자 모집", "author": "글로컬대학사업단", "date": "2026-09-23", "views": 5245, "pinned": false, "posted": "2026-09-23 16:09", "excerpt": "제주대학교 학생 주도 정신건강 프로젝트 SWEAT OUT(스웻아웃)에서 「2026 SWEAT OUT FESTIVAL」을 개최합니다.\n이번 페스티벌은 “나를 움직이는 모든 것이 마음을 움직인다”를 주제로, 러닝·요가·컬러테라피·명상·학생 기획 체험부스 등 다양한 활동을 통해 자신의 몸과 마음을 돌아보고\n일상 속 자기돌봄 방법을 직접 경험할 수 있도록 마련한 참여형 정신건강 페스티벌입니다.\n정신건강을 상담이나 치료가 필요한 순간에만 생각하기보다, 걷고 달리고, 호흡하고, 잠시 쉬고, 감정을 표현하는 일상의 작은 행동에서부터 자신의 마음을 살펴보는 경험을 제안하고자 합니다.\n제주대학교 구성원 여러분의 많은 관심과 참여 바랍니다.\n■ 행사 개요\n* 행사명: 2026 SWEAT OUT FESTIVAL\n* 주제: 나를 움직이는 모든 것이 마음을 움직인다\n* 일시: 2026. 10. 8.(목) 07:00~19:00\n* 장소: 제주대학교 캠퍼스\n* 학생회관 1층 공용공간 등 최종 장소 추후 공지 …", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 및 교직원", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281392"}, {"seq": 281390, "cat": "event", "title": "2026년 제7회 찾아가는 청년주거 상담소 안내", "author": "학생복지과(학생)", "date": "2026-09-23", "views": 4449, "pinned": false, "posted": "2026-09-23 16:07", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281390"}, {"seq": 281381, "cat": "event", "title": "JNU Co-PBL [아이디어를 웹으로: 바이브코딩 워크숍]", "author": "교수학습지원센터", "date": "2026-09-23", "views": 5723, "pinned": false, "posted": "2026-09-23 11:25", "excerpt": "JNU Co-PBL 「아이디어를 웹으로: 바이브코딩 워크숍」 참가자 모집\n교수학습지원센터에서는 겨울방학을 맞아 AI와 협업하여 아이디어를 웹서비스로 구현하는\nJNU Co-PBL 「아이디어를 웹으로: 바이브코딩 워크숍」 참가자를 모집합니다.\n이번 워크숍에서는 대학생활이나 지역사회에서 발견한 문제를 팀원들과 함께 구체화하고,\nAI를 활용해 해결 아이디어를 웹서비스로 만들어 봅니다. 팀별 피드백과 개선 과정을 거쳐 결과물을 완성할 예정입니다.\n친구들과 3인 1팀으로 신청할 수 있으며, 팀 구성이 어려운 학생은 개별 신청도 가능합니다.\n개별 신청자는 사전교육 과정에서 팀을 구성할 예정이니 관심 있는 학생들의 많은 참여 바랍니다.\n모집 대상: 제주대학교 학부 재학생\n모집 인원: 24명(3인 1팀, 총 8팀)\n신청 기간: 2026. 9. 23. ~ 10. 9.\n신청 방법: 포털 → 경력관리 → 비교과 → 바이브코딩 워크숍\n사전교육: 2026. 11. 27.(금) 16:00~18:00 / 온라인…", "attachments": [{"name": "홍보포스터.png (2 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281381&no=1"}, {"name": "바이브코딩_신청서.hwp (71 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281381&no=2"}], "deadline": "2026-11-27", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생", "benefit": null, "how": "포털 → 경력관리 → 비교과 → 바이브코딩 워크숍", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281381"}, {"seq": 281380, "cat": "event", "title": "[숭실대학교] 제2회 전국대학생 AI시스템트레이딩 경진대회 참가 안내", "author": "학생복지과(학생)", "date": "2026-09-23", "views": 5466, "pinned": false, "posted": "2026-09-23 10:45", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281380"}, {"seq": 281379, "cat": "event", "title": "2026년도 학생 대상 안전한 개인정보보호 사례 공모전 안내", "author": "학생복지과(학생)", "date": "2026-09-23", "views": 5233, "pinned": false, "posted": "2026-09-23 10:43", "excerpt": "", "attachments": [{"name": "(붙임1) 2026년도 학생 대상 「안전한 개인정보보호 u.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281174&no=1"}, {"name": "2026 JEJU CIS 앱 고도화 공모전 참가신청서 및 개발계획서.docx (24 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281174&no=2"}, {"name": "JEJU CIS 앱 고도화 공모전 포스터.jpg (165 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281174&no=3"}], "deadline": "2026-09-28", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-8308", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281174"}, {"seq": 281172, "cat": "general", "title": "해외파견 교류수학 프로그램 설명회 개최 안내", "author": "국제교류과", "date": "2026-09-17", "views": 5986, "pinned": false, "posted": "2026-09-17 09:46", "excerpt": "해외파견 교류수학 프로그램 설명회를 개최함에 따라, 아래와 같이 안내드리오니\n관심있는 재학생들은 설명회에 많은 참여바랍니다.\n가. 일시 : 2026. 9. 18.(금) 16:00~18:00\n나. 장소 : 언어교육원 101호\n다. 내용 : 해외파견 교류수학 프로그램 설명 및 SAF 방문학생 프로그램 소개\n라. 참석대상 : 해외파견 교류수학에 관심 있는 재학생\n(문의: 064-754-2198)", "attachments": [{"name": "해외파견 교류수학 프로그램 설명회.jpg (412 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281172&no=1"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281172"}, {"seq": 281169, "cat": "general", "title": "2026 지구청년 역량강화 사업 참여자 모집", "author": "대학일자리플러스센터", "date": "2026-09-17", "views": 5560, "pinned": false, "posted": "2026-09-17 09:20", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281169"}, {"seq": 281168, "cat": "volunteer", "title": "(제주시자원봉사센터) '자원봉사자의 삶을 기록하다' 인터뷰어 모집 안내", "author": "학생복지과(학생)", "date": "2026-09-17", "views": 4481, "pinned": false, "posted": "2026-09-17 09:17", "excerpt": "< 2026년 제주시 자원봉사 명예의 전당“반짝 반짝 작은 손”연계 활동-'자원봉사자의 삶을 기록하다' 인터뷰어 모집>\n제주시 자원봉사 명예의 전당 “반짝 반짝 작은 손”은 오래 전부터 지역 곳곳에서 묵묵히 활동해 온 자원봉사자의 이야기를 발견하고 기록하는 과정입니다.\n좋은 질문을 통해 자원봉사자의 경험과 생각을 자연스럽게 이끌어내고, 한 사람의 작은 실천이 어떤 마음에서 시작되었는지를 함께 들으며, 자원봉사의 의미와 가치를 찾는 인터뷰어 활동에 많은 관심과 참여 부탁드립니다.\n또한 자원봉사자의 활동 내용뿐만 아니라 그들이 어떤 문제와 씨름했는지, 무엇을 고민하며 행동하게 되었는지, 아직 해결하지 못한 문제는 무엇인지 그 마음을 들여다보는 인터뷰 진행자의 기술을 배워봅니다.\n■활동개요\n〇주요활동: 2026 제주시 자원봉사 명예의 전당 후보 자원봉사자 인터뷰 진행 및 인터뷰어 교육 참여\n〇활동기간: 10월 첫째 주부터 둘째 주까지 1~2회\n〇참여대상: 자원봉사자의 삶과 이야기를 발견하…", "attachments": [{"name": "인터뷰어 모집-최종포스터.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281168&no=1"}], "deadline": null, "org": "제주시자원봉사센터", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=281168"}, {"seq": 281167, "cat": "volunteer", "title": "(제주대학교병원 정신건강의학과) 자원봉사자 모집 안내", "author": "학생복지과(학생)", "date": "2026-09-17", "views": 4623, "pinned": false, "posted": "2026-09-17 09:13", "excerpt": "제주대학교병원 정신건강의학과 자원봉사자 모집 안내\n저희 제주대학교병원 정신건강의학과에서는 자원봉사자를 모집하고 있습니다.\n정신적인 어려움을 경험하고 계신 분들의 치료 및 사회 적응을 돕기 위한 활동에 도움을 주실 분들을 찾고 있으니 여러분들의 많은 관심과 참여 부탁드립니다.\n구분\n모집 대상\n활동 내용\n시간\n인원\n비고\n전문\n자원봉사자\n관련 자격 소지자\n대학원 재학 및 졸업\n예술치료, 운동, 요리 등\n매주 주1회\n00명\n3개월 이상 봉사활동 유지 가능자\n서식(신청서) 다운로드, 작성 후 신청 부탁드립니다.\n이메일(tmanne@naver.com)\n문의처 064-717-1857\n보조\n자원봉사자\n사회복지 전공자\n언어재활사 전공자\n아동학 전공자\n간호학 전공자\n프로그램 보조\n(성인 낮병원)\n성인 낮병원\n월, 화, 목, 금\n09:30~15:30\n00명\n* 혜택\n1) 본원에서 실시하는 정신건강사회복지사 수련과정 선발 우대\n2) 사회복지 전공자 정신건강실무 슈퍼비젼 및 자원봉사자 교육(정신건강관련) …", "attachments": [{"name": "26년도 제주대학교병원 정신건강의학과 자원봉사자 모집 안내(제주대학교).hwp (85 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281167&no=1"}, {"name": "정신건강의학과_자원봉사_신청서_및_동의서_2026.docx (19 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281167&no=2"}], "deadline": null, "org": "제주대학교병원 정신건강의학과", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=281167"}, {"seq": 281149, "cat": "event", "title": "안양시 여성친화도시 영상공모전 안내", "author": "학생복지과(학생)", "date": "2026-09-16", "views": 4906, "pinned": false, "posted": "2026-09-16 16:13", "excerpt": "", "attachments": [{"name": "2026년 여성친화 영상공모전 3차 재공고문.hwpx (68 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=281149&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281149"}, {"seq": 281136, "cat": "general", "title": "[SWEAT OUT] 9월 슬로우러닝 프로그램 참가자 모집", "author": "글로컬대학사업단", "date": "2026-09-16", "views": 6165, "pinned": false, "posted": "2026-09-16 14:16", "excerpt": "기분이 나아지길 기다리기보다, 작은 움직임을 먼저 시작해보는 시간!\n제주대학교 학생 주도 정신건강 프로젝트 SWEAT OUT(스웻아웃)에서 9월 슬로우러닝 프로그램 참가자를 모집합니다.\nSWEAT OUT 슬로우러닝은 행동활성화 원리를 바탕으로, 기록이나 속도를 겨루기보다 걷기와 가벼운 달리기를 통해 일상 속에서 작은 움직임을 직접 시작해보는 프로그램입니다.\n달리기를 잘하지 않아도 괜찮습니다.\n제주대학교 캠퍼스와 권제오름을 함께 천천히 달리며 몸과 마음을 가볍게 움직여보세요!\n✔️�� 1차 슬로우러닝\n일시: 2026. 9. 19.(토) 08:00~09:30\n✔ 2차 슬로우러닝\n일시: 2026. 9. 30.(수) 18:30~20:00\n✔ 장소\n제주대학교 내 집결 후 이동\n세부 집결 장소는 추후 참가자에게 공지 예정\n✔ 진행 내용\n오리엔테이션 및 워밍업 스트레칭\n권제오름 및 제주대학교 슬로우러닝\n쿨다운 스트레칭\n✔ 참가 혜택\n참가자 전원  null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281034"}, {"seq": 281031, "cat": "general", "title": "2026년 언어교육원 9월 정기토익 대비 무료 특강", "author": "국제교류과", "date": "2026-09-14", "views": 6057, "pinned": false, "posted": "2026-09-14 11:16", "excerpt": "2026년 언어교육원 9월 정기토익 대비 무료 특강\n언어교육원 토익특별반에서는 9월에 시행되는 공인 어학성적의 고득점 달성을 목표로 학습하는 학생들을 위하여 9월 정기 토익 대비 특강을 진행합니다. 재학생이라면, 누구나 무료로 수강 가능한 특강이오니 정기 토익 시험을 준비하고 있는 재학생 여러분들의 많은 참여 바랍니다.\n■ 프로그램 세부사항\n1. 진행 프로그램 : 9월 정기토익 시험 대비 특강\n2. 특강 진행방식 : 줌 프로그램 활용 비대면 실시간 라이브\n3. 신청 기간 : 2026. 9. 14.(월) ~ 2026. 9. 17.(목) 17시 마감\n4. 특강 일정 : 2026. 9. 18.(금) 13시 시작 / 2시간 진행 예정\n5. 프로그램 수강방법\n1) 구글폼 https://forms.gle/6i9r6sFRgFUDrS9q8 접속하여 신청\n혹은 홍보물 QR코드 스캔 후, 구글폼 접속 또는 하단 [신청 바로 가기] 클릭 후 신청\n2) 2026. 9. 18.(금) 10시 문자로 개별 발…", "attachments": [], "deadline": "2026-09-18", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "언어교육원 (064-754-2347)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281031"}, {"seq": 281019, "cat": "volunteer", "title": "(중랑문화재단) 2026 중랑용마폭포축제 자원봉사자 '용마별' 모집 안내", "author": "학생복지과(학생)", "date": "2026-09-14", "views": 4789, "pinned": false, "posted": "2026-09-14 09:02", "excerpt": "2026 중랑용마폭포축제 자원봉사자 '용마별' 모집 안내\n2026 중랑용마폭포축제의 친절하고 안전한 운영을 위해 축제 자원봉사자 '용마별'을 모집합니다.\n1. 건 명: 2026 중랑용마폭포축제 자원봉사자 ‘용마별’ 모집\n2. 활동일시: 2026. 10. 10.(토) 10:30~16:30 / 16:00~22:00 (2교대)\n3. 활동장소: 용마폭포공원(서울시 중랑구 용마산로 250-12)\n4. 모집대상: 축제에 관심 있는 자원봉사자\n5. 모집기간: 2026. 9. 7.(월) ~ 10. 5.(월)\n6. 접 수: 1365자원봉사 포털사이트를 통한 개별 신청\n가. 개인: 1365자원봉사 포털사이트를 통한 개별 신청\n나. 단체: 붙임의 접수 양식 작성 후 10. 5.(월)까지 메일 제출(jdj@jnfac.or.kr)\n7. 문 의: 중랑문화재단 축제공연팀(02-3407-6537)\n8. 협조사항: 축제 자원봉사 모집 안내 및 홍보 협조\n붙임 1. 2026 중랑 용마폭포축제 및 자원봉사 모집 개요…", "attachments": [{"name": "본문.pdf (102 KBytes)", "url": "https://www.jejunu.ac.kr/a s": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281016"}, {"seq": 281011, "cat": "general", "title": "(글로컬대학사업단) '에듀리프레시 센터 연계 비교과 프로그램' 개발 공모 안내", "author": "글로컬대학사업단", "date": "2026-09-13", "views": 6110, "pinned": false, "posted": "2026-09-13 16:16", "excerpt": "글로컬대학사업단에서는 제주 전역의 현장 중심 교육 거점화를 위한 에듀리프레시 센터 연계 4대 특화 영역(Global·Ocean·Net-Zero·Heritage) 비교과 개발을 위해\n「에듀리프레시 센터 연계 비교과 프로그램 개발 공모」를 추진하고자 하오니, 관심있는 학과의 적극적인 참여바랍니다.\n가. 공모명: 에듀리프레시 센터 연계 비교과 프로그램 개발 공모\n나. 공모 기간: 2026. 9. 14.(월)~2026. 9. 23.(수) 18:00 마감\n다. 공모 대상: 제주대학교 전 학과 ※ 학과 대학·대학원 포함이며, 본부 및 부속시설 제외\n라. 모집 방법: 신청서 및 계획서 작성 후 글로컬대학사업단 공문 제출\n마. 지원 내용: 프로그램 당 운영비 500만원 이내\n※ 1개 프로그램 기준이며, 참여자 수 및 성과산출내역을 고려하여 조정될 수 있음\n바. 유의사항: 필수 자격 요건을 확인하시어 공모 신청 시 내용을 포함하여 작성\n사. 참고링크 : 글로컬대학사업단 홈페이지 링크(https://…", "attachments": [{"name": "[GL1-04] 에듀리프레쉬 센터 연계 비교과 프로그램 공모(공고문).hwp (215 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281011&no=1"}], "deadline": "2026-09-23", "org": "글로컬대학사업단", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": "프로그램 당 운영비 500만원 이내", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281011"}, {"seq": 280994, "cat": "volunteer", "title": "(2026.9.15.)인권문화제 장애학생지원센터 부스 행사 참여 안내(장애인식개선교육 수료 캡쳐 인증 시 맥세이프 보조배터리 증정)", "author": "학생복지과(학생)", "date": "2026-09-11", "views": 5493, "pinned": false, "posted": "2026-09-11 17:44", "excerpt": "(2026.9.15.)인권문화제 장애학생지원센터 부스 행사 참여 안내\nJNUCLASS 장애인식개선교육 온라인 교육 이수 시\n맥세이프 보조배터리를 증정합니다.\n선착순 150명입니다.\n■ 수령방법\n- 2026. 9. 15. 10시 이후, 야외음악당 풀밭에서 진행하는 인권문화제_ 장애학생지원센터 부스에 참여한다\n- 장애학생지원센터에서 준비한 설문조사를 완료한다.\n- JNU클래스 장애인식개선교육 청취 내역을 증빙한다.(핸드폰으로 살짝 보여주기)\n- 기념품(보조배터리)을 받는다.", "attachments": [{"name": "인증방법. 용: 도외 진로, 채용 관련 박람회 참여시 여비지원\n(식비,일비 제외/ 공무원 여비 기준 숙박 및 항공권 지원(이코노미 항공권 1인 25만이내 실비 지원)\n- 참여 방법: 1. 붙임1 파일 서식 작성 후 제출\n2. 활동 후 붙임2 파일 작성 및 증빙 제출\n- 제출 및 문의: 제주대학교 진로취업과 대학일자리 플러스센터 c6743@jejunu.ac.kr / 064-754-4452", "attachments": [{"name": "붙임1_신청서 서식.hwpx (52 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280882&no=1"}, {"name": "붙임2. 활동 후 제출서류.hwp (33 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280882&no=2"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "만34세이하 미취업 졸업생 및 지역 청년", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280882"}, {"seq": 280867, "cat": "scholarship", "title": "[대전청년내일재단] 2026년 하반기 인재육성(성취) 장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-09-09", "views": 5206, "pinned": false, "posted": "2026-09-09 09:35", "excerpt": "", "attachments": [{"name": "2026년 성취(대) 장학생 선발계획 공고.hwpx (94 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280867&no=1"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280867"}, {"seq": 280864, "cat": "general", "title": "「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 대표단 모집", "author": "모의유엔회의 사무국", "date": "2026-09-09", "views": 6844, "pinned": false, "posted": "2026-09-09 09:25", "excerpt": "「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 대표단 모집\n안녕하십니까,\n「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」 사무국입니다.\n국제정치와 국제기구에 관심 있는 학생이라면 주목해주세요!\n오는 11월 19일(목) ~ 20일(금) 이틀간 「2026 글로벌 정치 역량 강화 프로그램 ‘모의유엔회의’」를 개최합니다.\n🎁 참가 혜택\n① 비교과 마일리지 5,000점 지급\n→ 대학 기준 충족 시 최대 150만 원 상당 장학금으로 전환·지급\n② 공결 가능\n→ 11월 19일(목) ~ 20일(금) 프로그램 참여 시 공결 가능\n③ 숙박 및 식사 제공\n→ 이틀간 프로그램 참여에 필요한 숙박 및 식사 제공\n④ 총 상금 110만 원 규모 시상\n🏆 대상: 제주대학교 총장상 + 50만 원\n🥇 최우수상: 사회과학대학 학장상 + 30만 원\n🥈 우수상: 정치외교학과 학과장상 + 20만 원\n🏅 장려상: 10만 원\n🌏 어떤 프로그램인가요?\n이번 모의유엔회의는\n‘핵무기 확산 방지와 평화적 …", "attachments": [{"name": "KakaoTalk_20260827_092842851.jpg (5 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280864&no=1"}], "deadline": "2026-10-30", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "제주대학교 총장상 + 50만 원", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280864"}, {"seq": 280862, "cat": "scholarship", "title": "[김해시미래인재장학재단] 2026년 하반기 '김해시의사회 지정 기탁 장학생' 모집 안내", "author": "학생복지과(장학)", "date": "2026-09-09", "views": 5278, "pinned": false, "posted": "2026-09-09 09:21", "excerpt": "1. 선발인원 : 10명\n2. 거주지 요건 : 공고일 현재, 본인 또는 보호자가 김해시에 주민등록을 두고 1년 이상 계속 거주 중인 자로, 장학생 선정 후 장학금 수령 시까지 김해시에 계속 거주해야 함\n3. 신청자격 : 김해소재 고등학교를 졸업하고 전국 의과대학에 재학중이며 직전 2개학기 학업성적 평균이 각각 4.3만점에 3.0 이상인 자\n※ 한국장학재단 소득분위 8구간 이하\n4.. 지원금액 : 1인당 2,000,000원(생활비성)\n5. 문의처 : (재)김해시미래인재장학재단 (055-333-3474)\n※ 세부내용 붙임 참고", "attachments": [{"name": "공고문(재단법인김해시미래인재장학재단 2026 하반기 장학생 모집).pdf (609 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280862&no=1"}, {"name": "선발요강.pdf (549 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280862&no=2"}, {"name": "신청서식.hwpx (59 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280862&no=3"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": ["의과대학"], "who": "김해소재 고등학교를 졸업하고 전국 의과대학에 재학중이며 직전 2개학기 학업성적 평균이 각각 4.3만점에 3.0 이상인 자", "benefit": null, "how": null, "contact": "(재)김해시미래인재장학재단 (055-333-3474)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280862"}, {"seq": 280860, "cat": "general", "title": "2026-2학기 학생생활관 입주학생(전체) 수시 모집 안내", "author": "학생생활관", "date": "2026-09-09", "views": 6451, "pinned": false, "posted": "2026-09-09 08:56", "excerpt": "1. 학생생활관 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭 확인해 주세요.\n또한, 입주기간 변경이 어려우니 신청 시 입주기간을 신중히 결정하시어 신청하시기 바랍니다.\n※ 2026-1학기에 입주했던 학생은 폐결핵 검사 결과서 제출 생략\n2. 모집일정 및 신청방법\n가. 모집일정\n구분\n일정\n비고\n입주 신청 기간\n2026. 9. 3.(목) 09:00 ~ 종료 안내 시까지\n- 신청 선착순에 따라 담당자가 전화나 문자로 안내합니다.\n생활관비 수납\n- 합격처리 후 별도 안내\n- 합격처리일 당일 생활관비 납부 필수\n※ 모집일정은 사정에 따라 변경될 수 있으며 변경 시 홈페이지 공지 예정\n나. 신청방법: [붙임 1] 참조\n1) 포털시스템 → 교내활동 → 학생생활관(아라) → [입주신청] 접속 → 신청건물, 사용기간, 거리구분, 관리비 분납 유무 등 입력\n→ 제출서류 파일 업로드 → 화면 하단 [입주신청] 클릭 → 개인정보 등 동의\n2) 생활관비(관리비) 분할납부는 없음\n※ 기 합격자가 수시 …", "attachments": [{"name": "2026-2학기 학생생활관 입주학생(전체) 수시 모집 안내(문).pdf (343 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280860&no=1"}, {"name": "[별표 1] 2026학년도 2학기 입주퇴사금액.pdf (469 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280860&no=2"}], "deadline": "2026-09-09", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "[붙임 1] 참조", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280860"}, {"seq": 280858, "cat": "event", "title": "「2026 서울컵」 대학생 부문 e스포츠 대회 개최 안내", "author": "학생복지과(학생)", "date": "2026-09-09", "views": 6070, "pinned": false, "posted": "2026-09-09 08:46", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=280858"}, {"seq": 28079 ents": [{"name": "(공고문) 「글로벌 시장 도약 프로그램(베트남)」 참여기업 모집.hwp (68 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280778&no=1"}], "deadline": "2026-09-18", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "제주대학교 소속 대학(원)생 및 교원 창업기업 2개사", "benefit": null, "how": "신청서 작성 후, 이메일 제출(syoh@jejunu.ac.kr)", "contact": "제주대학교 RISE사업단 창업지원팀(064-754-4555)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280778"}, {"seq": 280769, "cat": "scholarship", "title": "2026학년도 제12회 고추월 장학생 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-09-07", "views": 6852, "pinned": false, "posted": "2026-09-07 13:11", "excerpt": "발전기금 고추월 장학생 선발계획을 붙임과 같이 안내하오니, 해당 학생들은 기한 내 신청하시기 바랍니다.\n1. 선발인원: 제주여고출신 가계곤란자 3명, 저소득 성적우수 5명\n2. 선발기준 및 제출서류: 붙임1 선발계획 참고\n3. 장학금액: 1인 200만원 ※학습보조비 장학금, 타 장학금과 중복수혜 가능\n4. 학과 추천기한: 2026. 9. 15.(화)\n→해당기한은 각 학과(전공)에서 학생복지과로 공문이 도착하는 기한을 말하며, 학과별로 장학생 신청서류 접수기간이 상이할 수 있으니 제출기한은 반드시 각 학과로 문의바람", "attachments": [{"name": "2026학년도 제12회 고추월 장학생 선발계획(안).hwp (92 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280769&no=1"}, {"name": "2026학년도 발전기금 고추월 장학생 신청서(서식).hwp (70 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280769&no=2"}], "deadline": "2026-09-15", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": "1인 200만원 ※학습보조비 장학금, 타 장학금과 중복수혜 가능", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280769"}, {"seq": 280739, "cat": "general", "title": "2026학년도 2학기 심폐소생술교육 참여자 모집 안내", "author": "건강증진센터", "date": "2026-09-07", "views": 6594, "pinned": false, "posted": "2026-09-07 09:30", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280739"}, {"seq": 280703, "cat": "general", "title": "2026학년도 2학기 지꺼진 반란 프로그램 참여자 모집", "author": "교수학습지원센터", "date": "2026-09-04", "views": 7378, "pinned": false, "posted": "2026-09-04 15:55", "excerpt": "📢성적경고자 지원 프로그램 안내\n혹시 이번 학기 성적 때문에 고민 중인가요?😥\n여러분의 학습역량을 쑥쑥 키워줄🌟“지꺼진 반란” 프로그램이 여러분을 기다립니다! 🌟\n📚 공부 방법이 막막했던 학생 📚 성적을 올리고 싶은 학생 👉지금이 바로 기회입니다!\n💡체계적인 학습 지원 💡맞춤형 프로그램 제공\n성적경고를 받은 학생 중 학습역량 강화를 희망하는 학생이라면 👉 신청 절차에 따라 꼭 신청해주세요!\n🌱 지금의 어려움은 더 큰 성장의 시작입니다. 교수학습지원센터는 여러분의 “반란”을 응원합니다!🌱\n🌟복학생 중 직전학기 성적경고를 받은 학생 및 유급자는 포털시스템으로 신청 바랍니다.\n이외의 성적경고대상자는 JNUclass 등록이 완료되었으니 신청방법에 따라 진행해 주시면 됩니다.🌟", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280703"}, {"seq": 280702, "cat": "general", "title": "(글로컬대학사업단) 2026학년도 2학기 교과 연계 런케이션 프로그램 공모 안내", "author": "대학본부", "date": "2026-09-04", "views": 7994, "pinned": false, "posted": "2026-09-04 15:24", "excerpt": "2026학년도 글로컬대학사업의 일환으로 교과목과 연계한 현장학습·실습·프로젝트 등 현장 중심의 교육활동을 지원하고, 학생들의 자기주도적 학습과 지역·산업 연계 교육을 활성화하기 위해 「2026학년도 2학기 교과 연계 런케이션 프로그램」을 공모하오니, 관심 있는 학과(부서)에서는 많은 신청 바랍니다.\n1. 공모기간: ~ 2026. 9. 10.(목) 18:00\n2. 신청대상: 런케이션 프로그램 운영을 희망하는 학과(부서)\n3. 운영방식\n- 2026학년도 2학기 교과목과 연계하여 운영\n- 학생은 해당 교과목 이수를 통해 학점을 취득하며, 런케이션 프로그램은 교과목의 현장학습·실습·프로젝트 등으로 운영\n- 교과목 운영계획에 따라 일부 차시 또는 일부 시간(예: 2~4시간) 운영 가능\n4. 지원내용: 교과목과 연계한 현장학습·실습·프로젝트 등 런케이션 프로그램 운영 지원\n5. 신청방법: 운영계획서 작성 후 사업단으로 공문 제출\n6. 제출서류: 교과 연계 런케이션 프로그램 운영 계획(안)\n7.…", "attachments": [{"name": "붙임1. (글로컬) 2026학년도 2학기 교과 연계 런케이션 프로그램 공모 및 운영 계획(안).pdf (276 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280702&no=1"}, {"name": "붙임2. 교과 연계 런케이션 프로그램 운영 계획(안).hwpx (46 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280702&no=2"}], "deadline": "2026-09-10", "org": "글로컬대학사업단", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "런케이션 프로그램 운영을 희망하는 학과(부서)", "benefit": "교과목과 연계한 현장학습·실습·프로젝트 등 런케이션 프로그램 운영 지원", "how": "운영계획서 작성 후 사업단으로 공문 제출", "contact": "글로컬대학사업단 글로벌교육혁신팀(내선 4958)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280702"}, {"seq": 280694, "cat": "general", "title": "[Mini Job Fair] 한 차로 가_제주맥주 참여자 모집", "author": "대학일자리플러스센터", "date": "2026-09-04", "views": 7874, "pinned": false, "posted": "2026-09-04 14:40", "excerpt": "★참여신청 바로가기: https://docs.google.com/forms/d/1R4MClynC0V1KA0lB_ZY96kC3pTzDQ0ZiLfGT-E_Ti6g/viewform?edit_requested=true", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280694"}, {"seq": 280690, "cat": "general", "title": "[중앙도서관] JNU독서주간: 럭키세븐챌린지, 북로그 프로그램 안내(9.7.(월)~10.16.(금))", "author": "중앙도서관", "date": "2026-09-04", "views": 7891, "pinned": false, "posted": "2026-09-04 14:24", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280690"}, {"seq": 280672, "cat": "scholarship", "title": "[인천인재평생교육진흥원] 2026년도 하반기 장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-09-04", "views": 6366, "pinned": false, "posted": "2026-09-04 10:34", "excerpt": "가. 선발대상: 대학생(정규학기 재학생) icesurvey/outEvent.htm?category=200&act=view&seq=280647"}, {"seq": 280646, "cat": "event", "title": "제29회 2026 국립창원대학교 전국대학생 자율로봇 경진대회 개최 및 모집안내", "author": "학생복지과(학생)", "date": "2026-09-03", "views": 6700, "pinned": false, "posted": "2026-09-03 17:26", "excerpt": "국립창원대학교 앵커사업단에서 전국 대학생을 대상으로 로봇·ai 분야 실무역량을 강화하고, 지역산업의 수요와 연계한 미래산업 분야 실무형 인재 양성 및 지역혁신 생태계 참여 활성화를 위해 다음과 같이「제29회 2026 국립창원대학교 전국 대학생 자율로봇 경진대회」를 개최하오니 관심있는 학생들의 많은 참여 바랍니다.\n1) 대 회 명: 제29회 2026 국립창원대학교 전국 대학생 자율로봇 경진대회\n2) 참가대상: 전국 대학에 재학중인 대학생\n3) 진행일시: 2026. 11. 4.(수) 09:00~18:00\n※ 2026 경남 글로벌 혁신페스타(g-nex) 연계 운영\n4) 진행장소: 창원컨벤션센터(ceco)\n5) 주최/주관: 국립창원대학교 앵커사업단\n6) 대회내용: 자율주행 및 탐색이 가능한 로봇을 활용하여 임무(자율탐색 및 요구조자 구출, 배틀럼블)를 수행하고 정량적인 지표를 비교\n※ 모든 임무의 결과는 규정에 근거하여 순위 측정\n※ 경남도지사상, 국립창원대학교총장상 등 순위에 따른 상장 …", "attachments": [{"name": "제29회 2026 국립창원대학교 전국 대학생 자율로봇 경진대회 개최 및 모집 공고.hwp (134 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=280646&no=1"}, {"name": "제29회 2026 국립창원대학교 전국 대학생 자율로봇 경진대회 규정(안).hwp (246 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=280646&no=2"}, {"name": "제29회 2026 국립창원대학교 전국 대학생 자율로봇 경진대회 신청서.hwp (89 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=280646&no=3"}], "deadline": "2026-09-11", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "전국 대학에 재학중인 대학생", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=280646"}, {"seq": 280644, "cat": "scholarship", "title": "2026학년도 2학기 의과대학 국가근로 장학생 모집 재공고", "author": "의과대학 행정실", "date": "2026-09-03", "views": 6394, "pinned": false, "posted": "2026-09-03 17:07", "excerpt": "2026학년도 2학기 의과대학 국가근로장학생을 아래와 같이 모집합니다. 많은 지원 바랍니다.\n1. 모집기간: 2026. 9. 3.(목) ~ 2026. 9. 9.(수) 18:00\n2. 근로기간(예정): 최종 선발일로부터 ~ 2027. 2. 19.(금)\n3. 선발인원: 1명\n4. 근무 l": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280621"}, {"seq": 280619, "cat": "general", "title": "글로벌 청년 공공외교 숏폼 공모전(8.31-10.20)", "author": "공공외교 역량강화대학 지원사업단", "date": "2026-09-03", "views": 8033, "pinned": false, "posted": "2026-09-03 14:23", "excerpt": "제주대학교 공공외교 역량강화대학 지원사업(한국국제교류재단)의 일환으로\n\"글로벌 청년 공공외교 숏폼 공모전\"을 개최하오니\n많은 참여 부탁드립니다.", "attachments": [], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280619"}, {"seq": 280605, "cat": "general", "title": "[모집] 대학창업 홍보 전시관 「오픈비즈샵」 제품 전시 참여기업 모집", "author": "제주대학교 RISE사업단", "date": "2026-09-03", "views": 8103, "pinned": false, "posted": "2026-09-03 13:10", "excerpt": "제품은 전시하고, 기업은 알리고!\n온·오프라인 홍보부터 시장 반응 확인, 판매·판로 연계까지!\n우리 기업과 제품을 더 많은 사람에게 선보이고 싶은 (예비)창업기업이라면,\n지금 '오픈비즈샵' 전시에 참여해보세요!\n[모집 안내]\n▶모집대상: (시)제품 전시가 가능한 기업\n- 제주대학교 대학(원)생 및 교원 (예비)창업기업\n- 제주대학교 가족회사\n- 제주대학교 창업보육센터 입주기업\n- 제주대학교 초기창업패키지 지원사업 참여이력이 있는 창업기업\n▶모집기간: 상시 모집\n▶선정안내: 신청내용 검토 후, 개별 안내\n[전시 안내]\n▶기간: 2026. 9. ~ 2027. 1. 29.(금)\n▶장소: 제주대학교 산학협력관 1층 정보검색실&교류관\n▶전시혜택\n- 온·오프라인 기업·제품 홍보\n- 관람객 피드백을 통한 제품 시장 반응 확인\n- 온라인 구매처 연계를 통한 제품 판매·판로 확대 지원\n[신청 방법]\n▶신청서 작성 후, 이메일 제출(✉️syoh@jejunu.ac.kr)\n문의: 제주대학교 RISE사업단…", "attachments": [{"name": "(공고문) 대학창업 홍보 전시관 오픈비즈샵 전시 기업 모집.hwp (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280605&no=1"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "(시)제품 전시가 가능한 기업", "benefit": null, "how": null, "contact": "제주대학교 RISE사업단 창업지원팀 064-754-4555", "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280605"}, {"seq": 280592, "cat": "volunteer", "title": "(제주종합사회복지관) 자원 정\n○ 모집인원 : 1명(방학 중 주당 최대 40시간)\n○ 근로기간 : 2026. 9. 7. ~ 2027. 2. 19. (2026학년도 2학기)\n○ 근로장소 : 제주대학교 교육대학 부설초등학교(사라캠퍼스, 부설초등학교 행정실, 교무실)\n○ 근무내용 : 제주대학교 부설초등학교 행정 및 교무 업무보조, 우편물 수발 등\n○ 자격요건 : 본교 재학생으로 한국장학재단 국가근로장학금 신청완료자\n*학자금지원구간 9구간 이하 및 직전학기 성적 1.4/4.3(70점) 이상\n○ 선발기준 : 자격요건에 맞는 학생을 자체 선발기준에 의해 지표별 총계 고득점자 선발\n○ 모집방법 : 메일접수(kmj1756@jejunu.ac.kr)\n○ 제출서류: 첨부…", "attachments": [], "deadline": "2026-09-04", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-800-7004(부설초등학교 행정실)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280553"}, {"seq": 280531, "cat": "general", "title": "[모집] 제주국제개발협력센터 '개발협력 초급전문가 양성과정 온라인교육' 참가자 모집(~9/20까지)", "author": "제주국제개발협력센터", "date": "2026-09-02", "views": 8351, "pinned": false, "posted": "2026-09-02 11:23", "excerpt": "💡 개발협력 초급전문가 양성과정이란?\n대학생과 지역 주민들의 개발협력 이해도를 높이고 ODA(공적개발원조) 실무 역량을 키우기 위해 마련된 특별 교육 프로그램입니다 !\n실제 개발협력 현장에서 활동하는 실무자분들을 강사로 초청하여 ODA의 기본 개념부터 프로젝트 기획·관리, 국제개발협력 분야 진출 및 참여 방법 등 이론뿐만 아니라 실무 교육까지 들을 수 있는 기회 !\n📌 개요\nㅇ 일시 : 2026년 10월 1일(목)~10월 2일(금)\nㅇ 방식 : 온라인(ZOOM) , zoom링크는 추후에 참여대상자 한해 송부 예정\nㅇ 대상 : ODA 사업 참여 희망 기관, 개발협력 분야 진출희망자 및 관심자 누구나 !\nㅇ 모집인원 : 00명 *선착순으로 조기마감 될 수 있습니다.\nㅇ 신청기간 : 2026. 9. 1.(화) ~ 9. 20.(일)\nㅇ 신청방법 : 구글폼 신청서 링크를 통해 접수 https://forms.gle/V4bSEeqYaaynPn87A\nㅇ 문의 : 제주국제개발협력센터 064-754-…", "attachments": [{"name": "개발협력 초급전문가 양성과정 온라인교육_타임테이블.zip (282 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280531&no=1"}], "deadline": "2026-09-23", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280531"}, {"seq": 280530, "cat": "general", "title": "2026학년도 2학기(2차) 취업연계 국가근로장학사업 참여기업 모집 안내", "author": "현장실습지원센터", "date": "2026-09-02", "views": 7938, "pinned": false, "posted": "2026-09-02 11:18", "excerpt": "1. 기업신청기간 : ~ 9. 10. 16:00까지\n2. 기업 선발 결과 공지 : 2026. 9. 11. 18:00까지 / 신청서에 기재된 담당자 이메일로 결과 안내 메일 발송 예정\n** 학생 신청 : 2026. 9. 14. ~ 9. 21. ☞ 근로 시작 : 2026. 10. 6.~\n3. 제출 서류 : 담당자 이메일 제출(munhee1014@jejunu.ac.kr)\n① 참여신청서(직인 날인 필수)\n② 국세 완납증명서(신청일 기준)\n③ 지방세 완납증명서(신청일 기준)\n④ 4대보험 완납증명서(신청일 기준)\n⑤ 사업자등록증 사본\n** 제출 서류 미비 시 자동 취소 처리 됩니다.(별도 연락 하지 않음)\n4. 행정사항\n① 신청 시 기재하는 ‘모집인원’은 수요조사를 위해 받는 것이며, 참여기업 수요에 따라 인원이 조정될 수 있습니다. 최종 선발 가능인원은 기업 선발 완료 후 확정됩니다.\n* 기업 선발은 신규 참여 여부, 채용 연계 가능성, 현장점검 시 지적 사항 발생 여부 등을 포함해 제주대학…", "attachments": [{"name": "(기업용)2026.사업 공고문 및 지원신청서류(2학기)_2차.hwp (85 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280530&no=1"}], "deadline": "2026-10-06", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280530"}, {"seq": 280519, "cat": "scholarship", "title": "[두을장학재단] 제29기 장학생 모집 안내", "author": "학생복지과(장학)", "date": "2026-09-02", "views": 6704, "pinned": false, "posted": "2026-09-02 09:41", "excerpt": "[두을장학재단] 제29기 장학생 선발 안내\n1. 선발인원: 30명\n2. 지원자격(모두 충족)\n- 두을장학재단의 인재상에 공감하며, 차세대 여성 지도자가 되기를 희망하는 학생\n- 26년 2학기 기준 1학년 2학기 재학 중인 여자 대학생\n- 26년 1학기 총 15학점 이상을 이수하고, 성적 3.5/4.5만점 이상 취득한 학생\n- 대한민국 국적을 가진 학생\n※ 생활환경이 어렵거나 이공계 학생은 우대함\n3. 장학금: 학기당 등록금 전액 + 자기계발비(금900,000원)\n※ 타 장학금 중복수혜 불가\n※ 2학년~수업연한까지 지급(단, 학점 및 활동평가 후 계속지급 평가)\n4. 선발절차: 학생 본인이 직접 재단 홈페이지 신청 → 서류심사 → 면접심사 → 합격자 발표\n5. 접수기간: 2026. 9. 1.(화) ~ 9. 30.(수) 18시까지\n※ 세부내용 붙임 참조", "attachments": [{"name": "제29기 두을장학생 선발요강.pdf (62 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280519&no=1"}, {"name": "2-1. 제29기 두을장학생 모집 포스터(인쇄용).pdf (756 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280519&no=2"}], "deadline": "2026-09-30", "org": null, "opp": {"category": "장학", "grades": [1, 2], "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280519"}, {"seq": 280515, "cat": "scholarship", "title": "[파안장학문화재단법인] 2026-2(후기) 석.박사 장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-09-02", "views": 5633, "pinned": false, "posted": "2026-09-02 09:31", "excerpt": "2026학년도 후기(2학기) 파안장학문화재단 장학생 선발계획을 안내하오니 신청을 희망하는 학생들은 신청기한 내 신청하시기 바랍니다.\n1. 추천 인원(제주대→재단) : 2명(학과(전공)별 1명 이내 추천)\n※ 대학 추천인원 중 재단에서 최종 심사하여 선발\n2. 장학금액 : 금2,000,000원(생활비성)\n※ 단, 심사결과에 따라 개인별 장학금 지급액이 다를 수 있음\n※ 학사, 석사, 박사 기간 중 '파안장학문화재단법인' 및 '재단법인 대하장학회' 장학금 포함 총 2회 이내 지급을 원칙으로 함\n3. 지원자격(재단기준)\n- 2026학년도 2학기 대학원 재학생 중 KCI 등재 학회가 발행하는 학술지에 2027년 상반기 내 논문게재가 가능한 자(2인 이하 연구, 파안장학문화재단법인 지원 사사명기)\n- 또는 당해 학기 내 각종 경진대회, 공모전 등에서 수상 실적(상장 및 발표작품), 봉사실적(교내외 봉사), 기타 활동실적(교내외 활동)을 증명할 수 있는 자료 제출이 가능한 자\n※ 게재논문 등 …", "attachments": [{"name": "2026-2(후기) 파안장학문화재단법인 석박사 장학생 추천 요청(공고문).pdf (326 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280515&no=1"}, {"name": "2026-2 파안 장학생신청서.hwp (55 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280515&no=2"}, {"name": "2026-2 파안 장학생신청 개인정보 수집 및 이용 동의서.hwp (108 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280515&no=3"}, {"name": "2026-2 장학생 총장추천서.hwp (24 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=280515&no=4"}], "deadline": "2026-09-11", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": "금2,000,000원(생활비성)", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=280515"}, {"seq": 280513, "cat": "general", "title": "[학생상담센터] 9월 심리검사 프로그램 참가신청 안내", "author": "학생상담센터", "date": "2026-09-02", "views": 8218, "pinned": false, "posted": "2026-09-02 08:55", "excerpt": "9월 심리검사 프로그램 참가신청 안내\n9월 심리검사 및 해석상담 프로그램 참가신청 안내드립니다.\n참가 대상 : 제주대학교 재학생 (학부생, 대학원생) 및 교직원\n신청 기간 : 2026. 9. 01. (화) ~ 2026. 9. 7. (월)\n검사 코드 발송 : 2026. 9. 9. (수) 13:00 - 14:00\n온라인 검사 결과 확인 또는 1:1 개인 해석상담 : 2026. 9. 9. (수) ~ 2026. 9. 30. (수)\n수검 방법: 심리검사 온라인 코드 수령 후 심리검사 실시(온라인)\n문의 번호: 064-754-4476\n신청 링크 : https://buly.kr/6MuIAxp\n많은 참여 부탁드립니다.", "attachments": [{"name": "2026년 9월 심리검사 .jpg (2 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280513&no=1"}], "deadline": "2026-09-07", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 (학부생, 대학원생) 및 교직원", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280513"}, {"seq": 280512, "cat": "event", "title": "(서일대학교) AI 써먹는 인디게임 챌린지 2026 해커톤 개최 안내", "author": "학생복지과(학생)", "date": "2026-09-02", "views": 6372, "pinned": false, "posted": "2026-09-02 08:39", "excerpt": "", "attachments": [], "deadline": null, "org": "서일대학교", "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=280512"}, {"seq": 280511, "cat": "event", "title": "국립중앙과학관 별의별 과학특강(9월) 안내", "author": "학생복지과(학생)", "date": "2026-09-02", "views": 7189, "pinned": false, "posted": "2026-09-02 08:37", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=280511"}, {"seq": 280510, "cat": "event", "title": "「제15기 화학물질 불법유통 온라인 감시단 공개 모집」 안내", "author": "학생복지과(학생)", "date": "2026-09-02", "views": 6741, "pinned": false, "posted": "2026-09-02 08:37", "excerpt": "", "attachments": [{"name": "참가신청서 및 개인정보 동의서_15기_vf.hwpx (49 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=280510&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=280510"}, {"seq": 280502, "cat": "general", "title": "[자율운영중점연구소] 2026년도 기초과학 연구지원(SUPPORT)사업 신규과제 공모", "author": "기초과학연구소", "date": "2026-09-01", "views": 8205, "pinned": false, "posted": "2026-09-01 17:54", "excerpt": "제주대학교 기초과학연구소 자율운영중점연구지원사업단에서는 제주지역 기초과학 연구 활성화를 위한 「2026년도 기초과학 연구지원(SUPPORT) 사업」 세부과제를 다음과 같이 공모하오니, 관심 있는 연구자분들의 많은 참여를 바랍니다.\n가. 공모기간: 2026. 9. 1. ~ 9. 13.\n나. 지원대상: 기초과학을 연구하는 제주대학교 전임 및 박사연구원 (신진교수 우대)\n다. 지원분야: 생물기초연구, 바이오융합연구, 기후변화모니터링연구, 기초보호연구 등\n※ 지원규모, 연구기간, 신청방법, 제출서류, 의무사항 등 세부내용은 붙임 공모문을 반드시 확인하여 주시기 바랍니다.\n문의: 제주대학교 기초과학연구소 064-754-8310, hmnote@jejunu.ac.kr", "attachments": [{"name": "2026 SUPPORT사업 공모문(260901).hwp (286 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=280502&no=1"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "기초과학을 연구하는 제주대학교 전임 및 박사연구원 (신진교수 우대)", "benefit": null, "how": null, "contact": "제주대학교 기초과학연구소 064-754-8310, hmnote@jejunu.ac.kr", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=280502"}, {"seq": 280494, "cat": "scholarship", "title": "[국가유산진흥원] 2026년도 전통 기·예능분야 및 매장유산 관련 분야 우 l, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279885"}, {"seq": 279881, "cat": "general", "title": "(육성)2026학년도 2학기 국제교류처 글로벌 서포터즈 모집 안내", "author": "국제교류과", "date": "2026-08-20", "views": 9473, "pinned": false, "posted": "2026-08-20 16:05", "excerpt": "(육성)2026학년도 2학기 국제교류처 글로벌 서프터즈 모집 안내\n제주대학교 국제교류처에서 2026학년도 2학기 글로벌 서포터즈를 모집하오니, 관심있는 학생들의 많은 지원 바랍니다.\n■ 모집대상\n-학부 및 대학원 내·외국인 재학생\n※휴학생은 모집대상 제외\n- 국제교류에 관심 있고, 팀활동 가능하며 정기적으로 한달에 2번 이상 행사 참여 가능한 자(주말제외)\n- 동영상 편집 또는 카드뉴스 제작 가능한자\n- 외국어 가능자(영어, 일본어, 중국어 등)\n■ 모집인원\n- 12명 내외\n■ 모집일정\n- 서류제출: 2026. 8. 21.(금) ~ 8. 28.(금) 14:00까지\n- 서류결과발표: 2026. 9. 1.(화) (예정)\n- 면접: 2026. 9. 4.(금) (예정)\n- 최종발표: 2026. 9. 7.(월) (예정)\n- 발대식 및 OT: 2026. 9. 11.(금) ※필수 참석 (예정)\n■ 활동기간\n- 2026. 9. ~ 2027. 1.(5개월)\n■ 활동내용\n- 외국인 유학생의 한국 생활…", "attachments": [{"name": "글로벌 서포터즈 신청서 서식.hwp (131 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279881&no=1"}], "deadline": "2026-08-28", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279881"}, {"seq": 279869, "cat": "scholarship", "title": "[국제교류처] 2026학년도 2학기 국가근로장학생(일반교내) 모집 안내", "author": "국제교류처", "date": "2026-08-20", "views": 7988, "pinned": false, "posted": "2026-08-20 14:23", "excerpt": "* 한국장학재단 희망근로지 신청대상자에 한하여 서류 및 면접 안내 개별 연락 예정\n(선발 제외자는 연락이 없을 수 있음)\n1. 선발인원: 5명(1인당 근로시간 540시간 가능)\n2. 선발대상: 아래의 요건을 모두 충족하는 학부 재학생\n◦ 한국장학재단 국가근로장학금 신청완료자\n◦ 학자금 지원구간 9구간 이하 및 직전학기 성적 1.4/4.3(70점) 이상인 재학생\n◦ 휴학, 졸업, 수료, 자퇴, 제적, 초과학기생, 조기취업자, 시간제등록생, 산업체위탁생, 평생교육원 등록생 등 제외\n3. 근로기간: 2026. 9. 1.(화) ~ 2027. 2. 19.(금) ※ 선발일정에 따라 근로기간 변동 가능\n4. 근로내용\n- 국제교류과 행정실 민원방문 외국인 유학생 및 재학생 안내, 한국어과정 업무 보조 및 행사 지원\n- 언어교육원 행정실 및 글로벌 라운지 상주하여 학생 상담 및 관리, 언어교육원 업무  "posted": "2026-08-18 15:55", "excerpt": "모집인원: 12명 내외(소셜/영상 분야별 선발)\n접수기간: 2026. 8. 18.(화) ~ 2025. 9. 11.(금) 18:00\n지원방법: 첨부파일 지원서 참고\n활동기간: 2026. 10. 1. ~ 2027. 9. 30(1년)\n접수처: 제주대학교 대외홍보팀 또는 kkhui1775@jejunu.ac.kr\n문의처: 제주대학교 대외홍보팀 ☎064-754-2047\n자세한 내용은 '[붙임]제주대학교 24기 학생홍보대사 선발 모집 안내 및 지원서'를 참고해 주세요.", "attachments": [{"name": "제주대학교 제24기 학생 홍보대사 선발 모집 안내 및 지원서.hwp (71 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279788&no=1"}], "deadline": "2026-08-18", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "첨부파일 지원서 참고", "contact": "제주대학교 대외홍보팀 ☎064-754-2047", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279788"}, {"seq": 279787, "cat": "general", "title": "2026-2학기 학생생활관 입주학생(남학생) 수시 모집 안내", "author": "학생생활관", "date": "2026-08-18", "views": 8394, "pinned": false, "posted": "2026-08-18 15:49", "excerpt": "1. 학생생활관 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭 확인해 주세요.\n또한, 입주기간 변경이 어려우니 신청 시 입주기간을 신중히 결정하시어 신청하시기 바랍니다.\n2. 모집일정 및 신청방법\n가. 모집일정\n구분\n일정\n비고\n입주 신청 기간\n2026. 8. 20.(목) 09:00 ~ 종료 안내 시까지\n- 신청 선착순에 따라 담당자가 전화나 문자로 안내합니다.\n생활관비 수납\n- 합격처리 후 별도 안내\n- 합격처리일 당일 생활관비 납부 필수\n※ 모집일정은 사정에 따라 변경될 수 있으며 변경 시 홈페이지 공지 예정\n나. 신청방법: [붙임 1] 참조\n1) 포털시스템 → 교내활동 → 학생생활관(아라) → [입주신청] 접속 → 신청건물, 사용기간, 거리구분, 관리비 분납 유무 등 입력\n→ 제출서류 파일 업로드 → 화면 하단 [입주신청] 클릭 → 개인정보 등 동의\n2) 생활관비(관리비) 분할납부는 8월 31일 18:00 신청자까지만 2회 분할 가능, 2차분은 9월 16일 예정\n※ 기 합격자…", "attachments": [{"name": "2026-2학기 학생생활관 입주학생(남학생) 수시 모집 안내(문).pdf (352 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279787&no=1"}], "deadline": "2026-09-16", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "[붙임 1] 참조", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?categ 6\n붙임 2026년 장학생 선발 공고 및 서식 각 1부. 끝.", "attachments": [{"name": "2026년 손태희장학재단 4기 장학생 선발 공고문.pdf (247 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279681&no=1"}, {"name": "2026년 손태희장학재단 4기 장학생 서식.hwpx (51 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279681&no=2"}], "deadline": "2026-09-08", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "붙임 공고문 참조", "benefit": null, "how": "손태희장학재단으로 학생이 직접 온라인 신청 및 등기우편 제출", "contact": "063-859-9196", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=279681"}, {"seq": 279679, "cat": "scholarship", "title": "2026학년도 이니스프리 모음재단 감귤장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-08-14", "views": 7968, "pinned": false, "posted": "2026-08-14 10:25", "excerpt": "2026학년도 이니스프리 모음재단 감귤장학생 선발계획을 다음과 같이 안내하오니, 신청을 희망하는 학생은 신청기한 내 신청하시기 바랍니다.\n1. 추천대상 : 농업 또는 농산업 관련 프로젝트*에 참여한 3,4학년 대학생 및 대학원생\n* 농업기술, 품종연구, 농산물 가공 등 농업 및 관련 산업분야 발전에 기여 가능한 프로젝트\n2. 선발인원 : 00명\n3. 장학금액 : 1인당 금2,000,000원(생활비, 타 장학금과 중복수혜 가능)\n4. 제출서류 : 지원서, 지도교수 추천서, 자기소개서, 개인정보수집이용동의서, 농산업 관련 프로젝트 진행 증빙서류, 성적증명서, 재학증명서, 가족관계증명서,\n가족관계증명서에 기재된 보호자의 건강보험납부확인서(학부생은 소득분위표)\n5. 접수방법 : 학생이 직접 재단 이메일로 신청(imoeum@innisfree.com)\n6. 접수기한 : 2026. 9. 4.(금)까지\n7. 문의사항 : 이니스프리 모음재단(064-749-9917)\n붙임 지원서 등 서식 각 1부. …", "attachments": [{"name": "[붙임1~5]2026 감귤장학생 지원서_대학(성함기재)_PW064.docx (37 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279679&no=1"}], "deadline": "2026-09-04", "org": null, "opp": {"category": "장학", "grades": [3, 4], "colleges": "전체", "who": null, "benefit": "1인당 금2,000,000원(생활비, 타 장학금과 중복수혜 가능)", "how": "학생이 직접 재단 이메일로 신청(imoeum@innisfree.com)", "contact": "이니스프리 모음재단(064-749-9917)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view y/outEvent.htm?category=203&act=view&seq=279640"}, {"seq": 279635, "cat": "event", "title": "JEJU CIS 시민과학대학 7기 공통교육(습지생태학)안내(26.8.21.금 17시 ~ 20시)", "author": "제주대학교 기초과학연구", "date": "2026-08-13", "views": 7634, "pinned": false, "posted": "2026-08-13 11:30", "excerpt": "안녕하세요. 제주대학교 기초과학연구소 입니다.\nJeju CIS 시민과학대학 7기 공통교육(습지생태학) 이론교육을 아래와 같이 진행합니다.\n*일시: 2026.08.21(금) 17:00~20:00\n*장소: 산학협력관 1층 대강당\n*대상: JEJU CIS 활동가 및 습지생태학에 관심있는 제주도민\n*문의: 제주대학교 기초과학연구소\n이번 공통교육은 활동가 뿐만 아니라 도민들도 참여 가능하니 많은 참여 바랍니다.\n교육 신청은 첨부된 포스터의 QR코드 또는 아래 신청 링크를 통해 가능합니다.\n*신청링크: https://naver.me/FtoL25UF", "attachments": [{"name": "20260821습지생태학 공통교육 포스터.pdf (2 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279635&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "JEJU CIS 활동가 및 습지생태학에 관심있는 제주도민", "benefit": null, "how": null, "contact": "제주대학교 기초과학연구소", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279635"}, {"seq": 279561, "cat": "event", "title": "2026 기후산업국제박람회(WCE) 개최 안내", "author": "학생복지과(학생)", "date": "2026-08-12", "views": 7358, "pinned": false, "posted": "2026-08-12 17:22", "excerpt": "", "attachments": [{"name": "[붙임1] 2026 기후산업국제박람회(WCE) 포스터.pdf (817 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279561&no=1"}, {"name": "[붙임2] 2026 기후산업국제박람회(WCE) 브로셔.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279561&no=2"}, {"name": "[붙임3] 2026 기후 퀴즈쇼 포스터.PNG (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279561&no=3"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279561"}, {"seq": 279550, "cat": "event", "title": "[ 행사 ] JNU Co-PBL [알기쉬운 바이오소재 전공] 참가자 모집", "author": "교수학습지원센터", "date": "2026-08-12", "views": 7444, "pinned": false, "posted": "2026-08-12 13:29", "excerpt": "바이오소재전공이 궁금하지만 어떤 내용을 배우는지 잘 모르겠다면, 직접 경험해보세요!\n제주대학교 교수학습지원센터에서는 학생들의 전공 탐색을 지원하기 위해 「알기 쉬운 바이오소재전공」 프로그램을 운영합니다.\n이번 프로그램은 바이오소재전공에 대한 간단한 소개와 함께 현미경 관찰, DPPH 실험, LB배지 제작 및 미생물 관찰 등 전공과 연계된 실험·체험 활동으로 구성되어 있습니다.\n특히 바이오소재전공 신입생뿐만 아니라 바이오·생명과학 분야 및 관련 전공에 관심 있는 학생, 전공 선택을 고민하고 있는 재학생이라면 학과와 관계없이 참여할 수 있습니다.\n2학기 시작과 함께 하루 동안 전공을 미리 경험하며, 나에게 맞는 전공과 관심 분야를 탐색해보시기 바랍니다.\n○ 프로그램명: 알기 쉬운 바이오소재전공\n○ 참여대상: 제주대학교 재학생\n바이오소재전공 신입생\n바이오·생명과학 분야 및 관련 전공에 관심 있는 학생\n학과 및 전공 선택을 고민하고 있는 학생\n○ 운영일: 2026. 9. 12.(토) / 9…", "attachments": [{"name": "다이다이_알기쉬운 바이오소재전공 비교과프로그램 홍보포스터.jpg (306 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279550&no=1"}], "deadline": "2026-08-31", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생", "benefit": null, "how": "홍보포스터 내 QR코드 또는 신청 링크를 통한 신청", "contact": "JNU 다이다이 운영팀", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279550"}, {"seq": 279536, "cat": "general", "title": "[국립국제교육원] 2026년 하반기 특수외국어 배워보기 프로그램 안내", "author": "국제교류과", "date": "2026-08-12", "views": 9639, "pinned": false, "posted": "2026-08-12 09:21", "excerpt": "[국립국제교육원] 2026년 하반기 특수외국어 배워보기 프로그램 안내\n국립국제교육원에서는 특수외국어에 대한 대국민 교육기회 확대를 위해 2020년부터 전문교육기관과 함께 다양한 특수외국어 교육 프로그램을 운영하고 있습니다.\n이에 '2026년 하반기 특수외국어 배워보기' 프로그램을 안내드리니, 특수외국어에 관심있는 분들의 많은 지원바랍니다.", "attachments": [{"name": "(게시용)2026년 하반기 특수외국어 배워보기 프로그램 강좌 목록.xlsx (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279536&no=1"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "b 026-08-11", "views": 6507, "pinned": false, "posted": "2026-08-11 15:45", "excerpt": "", "attachments": [{"name": "2026 장학생 선발 공고문.zip (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279504&no=1"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=279504"}, {"seq": 279490, "cat": "volunteer", "title": "(세종학당재단)2026 세종학당 우수학습자 초청연수 이끄미(자원봉사자) 모집 홍보", "author": "학생복지과(학생)", "date": "2026-08-11", "views": 6087, "pinned": false, "posted": "2026-08-11 14:10", "excerpt": "2026 세종학당 우수학습자 초청 연수 이끄미(자원봉사자) 모집\n1. 선발 개요\n가. 활동 기간: (1차) 2026.9.16.(월)~10.11.(일) / (2차) 2026.10.12.(월)~11.1.(일)\n나. 활동 내용: 외국인 참가자 인솔, 연수 프로그램 운영 지원 등\n다. 지원 자격: 국내 대학(원)생, 초청 연수 전 일정 참여 가능자\n라. 선발 인원: 회차별 20명 내외\n마. 우대 사항: 1·2차 연수 모두 참여 가능자\n2. 지원 내용 ※ 상세 내용 ‘붙임1’ 안내문 참고\n가. 접수 기간: 2026.8.6.(목)~8.23.(일) 23:59까지\n나. 제출 서류: 지원신청서 1부, 재학(휴학)증명서 1부\n다. 지원 방법: 전자우편(volunteer@ksi2026.com) 접수\n라. 문의: 02-3276-0761", "attachments": [{"name": "2026 세종학당 우수학습자 초청 연수 자원봉사자(이끄미) 모집 안내.pdf (62 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=279490&no=1"}, {"name": "(붙임2) 이끄미 모집 홍보물.jpg (5 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=279490&no=2"}], "deadline": "2026-08-23", "org": "세종학당재단", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "국내 대학(원)생, 초청 연수 전 일정 참여 가능자", "benefit": null, "how": "전자우편(volunteer@ksi2026.com) 접수", "contact": "02-3276-0761", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=279490"}, {"seq": 279479, "cat": "general", "title": "(홍보)2026년 세계자살유족의 날 기념 따뜻한 작별 그리고 기억 공모전 홍보", "author": "학생상담센터", "date": "2026-08-11", "views": 8651, "pinned": false, "posted": "2026-08-11 10:05", "excerpt": "제주특별자치도자살예방센터에서는 세계자살유족의 날을 기념하여 자살유족의 애도 경험과 회복 과정을 다양한 형태로 표현‧공유함으로써 사회적 공감대를 형성하고,\n자살유족지원에 대한 인식을 제고하며, 나아가 지역사회 내 생명존중 문화 확산과 지지적 환경조성에 기여하고자 '따뜻한 작별 그리고 기억' 공모전을 개최합니다.\n많은 참여바랍니다.\n1. 행 사 명 : 2026년 세계자살유족의 날 기념 '따뜻한 작별 그리고 기억' 공모전\n2. 대 상 : 제주도민 누구나\n3. 공모기간 : 2026. 08. 03.(월) ~ 2026. 10. 02.(금)\n4. 참여안내 : 붙임 1. 참조\n5. 공모방법 : 이메일(jejumind@hanmail.net) 또는 방문 접수\n6. 문 의 : 자살예방팀 한선화(064-717-3037)", "attachments": [{"name": "2026년 공모전 홍보 포스터.png (272 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279479&no=1"}, {"name": "붙임1. 2026년 세계자살유족의날 기념 『따뜻한 작별 그리고 기억』 공모전 안내문.hwp (57 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279479&no=2"}, {"name": "붙임2. 2026 세계자살유족의날 기념 『따뜻한 작별 그리고 기억』 공모전 참가신청서.hwp (43 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279479&no=3"}], "deadline": null, "org": "홍보", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279479"}, {"seq": 279473, "cat": "scholarship", "title": "[정산장학재단] 2026학년도 2학기 정산장학재단 신규장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-08-11", "views": 7268, "pinned": false, "posted": "2026-08-11 08:51", "excerpt": "재단법인 정산장학재단 에서 2026학년도 2학기 장학생을 아래와 같이 선발하오니, 신청을 희망하는 학생은 기한내에 신청 바랍니다.\n1. 추천인원(제주대→재단) : 1명(학과(전공)별 1명 이내 추천)\n2. 장학금액 : 학기당 금1,500,000원(등록금 초과수혜 불가)\n* 다른 장학재단 장학금 이중수혜 불가, 교내 및 국가장학금은 등록금 범위 내 차액으로 수혜 가능\n3. 지원기간: 1년간 지원, 재단의 계속 지급요건 충족시 수업연한까지 지원\n4. 지원자격 : 잔여학기가 2개 이상 남은 학부 재학생(2026-2학기 포함)\n5. 제출서류 : 추천서, 장학금 지급원서, 서약서, 성적증명서, 주민등록등본, 보호자의 재산세과세증명서 또는 근로소득 원천징수영수증\n6. 제출처 : 학과(전공)사무실로 제출(제출기한은 각 학과마다 상이할 수 있으니 학과로 문의)\n* 2026. 8. 18.(화)까지 학과에서 학생복지과로 추천 완료되어야 함\n7 쁜소식, 유자\n노력, 농물의료\n3\n독일학과\n환경\n4\n동행\n정서지원\n5\n두드림\n노력\n6\n메이드인 패션\n교육\n7\n반창꼬\n교육, 동물의료, 환경\n8\n소나기\n교육, 노력, 의료\n9\n엔젤인널스\n교육, 의료\n10\n제주대봉우리\n노력\n11\n제주대학교 RCY\n교육, 노력, 동물의료\n12\n함께하는 우리\n교육\n3. 안내사항\n▷ 선발된 팀의 팀별 세부 안내사항은 팀 대표 및 총무에게 개별 안내할 예정입니다.\n▷ 원활한 봉사활동 추진을 위해 안내되는 사항을 확인하여 주시기 바랍니다.\n▷ 회계교육: 2026. 8. 14.(금…", "attachments": [{"name": "2026학년도 1차 JNU나눔실천봉사단 회계교육용 자료.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=279455&no=1"}, {"name": "JNU나눔실천봉사단 증빙 양식.zip (390 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=279455&no=2"}], "deadline": "2026-10-08", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-2548 / http://pf.kakao.com/_XrTSX (카카오톡채널 …", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=279455"}, {"seq": 279449, "cat": "event", "title": "「2026년 안양시 공공데이터·AI 활용 대학생 경진대회」 안내", "author": "학생복지과(학생)", "date": "2026-08-10", "views": 6935, "pinned": false, "posted": "2026-08-10 15:45", "excerpt": "안양시에서 공공데이터와 ai를 활용한 제품 및 서비스 개발을 통해 공공데이터·ai 활용을 촉진하고 데이터 기반 창의적이고 혁신적인 아이디어 및 비즈니스 모델을 발굴·지원하기 위해\n「2026년 안양시 공공데이터·ai 활용 대학생 경진대회」를 개최하고 있습니다. 관심 있는 학생들의 많은 참여 바랍니다.\n1. 접수기간: 2026. 8. 10.(월) ~ 9. 21.(월)\n2. 대회부문: 공공데이터와 ai를 활용한 제품·서비스 개발 경진대회\n3. 참가자격: 안양시에 관심 있는 전국 대학생(개인 또는 팀)\n4. 시상규모: 총 4개/팀(최우수 1 <300만원>, 우수 1 <150만원>, 장려 2 <각 50만원>)\n5. 참가방법: 안양시 누리집 접속 후 공고문 확인(안양시 누리집(www.anyang.go.kr) → 시정소식 → 고시/공고 → 고시공고)", "attachments": [], "deadline": "2026-09-21", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "안양시에 관심 있는 전국 대학생(개인 또는 팀)", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279449"}, {"seq": 279440, "cat": "general", "title": "「2026년 제주특별자치도 인권작품 아이디어 공모전」 홍보 안내", "author": "인권센터", "date": "2026-08-10", "views": 9822, "pinned": false, "posted": "2026-08-10 14:05", "excerpt": "《2026년 제주특별자치도 인권작품 아이디어 공모전 개요》\n○ 접수기간 :2026. 8. 10.(월) ~ 10. 16.(금)\n○ 응모자격 :인권에 관심 있는 국민 누구나\n○ 공모주제 :제주평화인권헌장의 평화·인권 가치 확산 및 인권존중문화 조성\n○ 공모분야 : 숏폼, 카드뉴스, 캘리그래피, 포스터\n○ 접수방법 : 제주도청 홈페이지 접수(https://www.jeju.go.kr/join/human_contest/2026.htm)\n○ 시상규모 : 상장 총 12점 및 상금 총 400만원 수여\n○ 결과발표 : 2026. 11월 중 ※ 자세한 사항 공고문 및 포스터 참조\n자세한 내용은 첨부2 \"2026년 제주특별자치도 인권작품 아이디어 공모전 공고문\"을 참고 바랍니다.", "attachments": [{"name": "[본문] 「2026년 제주특별자치도 인권작품 아이디어 공모전」 홍보 및 참여 협조 요청.pdf (338 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279440&no=1"}, {"name": "☆ 2026년 제주특별자치도 인권작품 아이디어 공모전 공고문.hwpx (84 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279440&no=2"}, {"name": "도청 자치행정과 인권팀_ 인권작품 아이디어 공모전 [1080X1080].jpg (469 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279440&no=3"}], "deadline": "2026-10-16", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "제주도청 홈페이지 접수(https://www.jeju.go.kr/join/human_contest/2026.htm)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279440"}, {"seq": 279384, "cat": "general", "title": "취업연계 국가근로장학사업 2학기 학생 모집 안내", "author": "현장실습지원센터", "date": "2026-08-07", "views": 10007, "pinned": false, "posted": "2026-08-07 16:22", "excerpt": "※ PDF 파일이 아닌 1개의 한글파일(HWP) 형태로 제출해주시기 바랍니다.\n※ 기업리스트는 추가될 수 있으므로 수시로 확인해 주시기 바랍니다.\n〇 신청방법(아래 두가지 모두 다 신청해야 함)\n- 한국장학재단 홈페이지(장학금 한눈에 보기 → 국가근로 및 중소기업 취업연계 장학금 바로가기-국가근로장학금 신청)\n※ 현재 통합신청 기간이라 취업연계중점대학 신청이 안되어 추후 선발 후 변경할 예정입니다.\n- 제주대학교 포털사이트 접속 후 경력관리-비교과 프로그램 → 신청 → 제목에 “취업연계” 검색 후 신청 → 구비 서류 이메일 제출(munhee1014@jejunu.ac.kr)\n※ 구비서류 : ①신청서 및 자기소개서(소속 단과대 취업지원관에게 컨설팅 받은 후 제출), ②성적증명서, ③자격증 및 어학능력시험 성적표(해당자만 제출), ④2026년 2학기 수업시간표 ※ 서약서는 선발 후 제출\n※ 주의사항\n○ 제주대학교 포털사이트 신청 전 반드시 한국장학재단 홈페이지에서 \"국가근로장학금\" 신청 …", "attachments": [{"name": "(학생용)2026.사업 공고문 및 지원신청서류(2학기).hwp (161 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279384&no=1"}, {"name": "2026학년도 2학기 취업연계 국가근로장학 신청기업 리스트.xlsx (37 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279384&no=2"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279384"}, {"seq": 279382, "cat": "general", "title": "(수정)[선착순 모집] SWEAT OUT 슬로우런 8월 1•2차 프로그램 : 마음이 따라오지 않는 날, 몸부터 천천히 움직여보는 시간", "author": "글로컬대학사업단", "date": "2026-08-07", "views": 8453, "pinned": false, "posted": "2026-08-07 15:43", "excerpt": "안녕하세요. 제주대학교 학생들의 일상 속 작은 행동과 마음건강을 연결하는 프로젝트팀 SWEAT OUT(스웻아웃)입니다.\n스웻아웃에서는 행동활성화 이론을 바탕으로, 가벼운 신체활동을 직접 시작하고 활동 전후 자신의 상태를 살펴보는 슬로우런 프로그램을 진행합니다.\n본 프로그램은 빠르게 달리거나 기록을 경쟁하는 러닝 모임이 아닙니다. 제주대학교 실내에서 간단한 오리엔테이션과 설문을 진행한 뒤,\n실외로 나가 스트레칭과 권제오름 및 제주대학교 아라캠퍼스를 천천히 걷고 가볍게 달릴 예정입니다. 러닝 경험이 없어도 괜찮으며,\n개인의 체력과 당일 컨디션에 따라 걷기만으로도 충분히 참여할 수 있습니다.\n[프로그램 안내]\n・ 일시: 1차 2026.08.12. (수) 17:00-18:30 / 2차 2026.08.17. (월) 17:00-18:30\n・ 집결 장소: 제주대학교 학생회관 지하 공연연습실\n・ 활동 장소: 제주대학교 아라캠퍼스 및 권제오름 일대\n・ 활동 내용: 오리엔테이션, 사전 설문, 웜업 스…", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "각 회차당 제주대학교 재학생 20명", "benefit": "참여자 전원 SWEAT OUT 티셔츠 제공", "how": "포스터의 QR코드 및 아래 링크를 통해 구글폼 작성", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279382"}, {"seq": 279360, "cat": "event", "title": "국토안전관리원 「2026년 국토안전 AI 콘텐츠 공모전」 안내", "author": "학생복지과(학생)", "date": "2026-08-07", "views": 7251, "pinned": false, "posted": "2026-08-07 10:02", "excerpt": "", "attachments": [{"name": "붙임 1. 응모요강.pdf (98 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279360&no=1"}, {"name": "붙임 2. 참가신청서.hwpx (53 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279360&no=2"}, {"name": "붙임 3. 저작권 및 개인정보 수집·이용 동의서.hwpx (73 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279360&no=3"}, {"name": "붙임 4. 디자인 소스(CI 및 마스코트) 사용 안내.png (44 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279360&no=4"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279360"}, {"seq": 279359, "cat": "scholarship", "title": "2026년 2학기 보훈(가족)장학 신청 안내 공고", "author": "학생복지과(장학)", "date": "2026-08-07", "views": 6284, "pinned": false, "posted": "2026-08-07 09:43", "excerpt": "첨부된 파일(공고문)을 참고하여 해당자는 신청하시기 바랍니다.\n2026년 2학기 보훈(가족)장학 신청 안내 공고\n□ 지원개요\n보훈(가족)장학은 법령에 의하여 교육지원이 되지 않는 대학원, 특수학교 및 대학에 재학 중인 국가유공자 등의 교육비 경감을 위하여 한국보훈복지의료공단의 수익금을 기반으로 재원의 한도 내에서 선발하여 지원하고 있습니다.\n□ 신청서 접수기간, 접수처 및 제출서류\n○ 신청서 접수 : 2학기(’26. 9. 1. ~ 9. 30.)\n※ 등기우편의 경우 신청 학기별 신청서 접수 마지막일 우체국 소인분까지 유효\n○ 접 수 처 : 제주특별자치도보훈청 보훈과\n○ 문 의 : 제주특별자치도보훈청 보훈과(064-710-8408)", "attachments": [{"name": "★260731 2026년 2학기 보훈(가족)장학 신청 안내 공고문 .hwpx (115 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279359&no=1"}], "deadline": "2026-09-30", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "ur ne": "2026-08-12", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": "금5,000,000원 내외(타 장학금과 이중수혜 가능) ※추후 모금액 규모에 따라 선발인원 및 지원금액은 변동될 수 있음", "how": "이메일제출(c5256@jejunu.ac.kr)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=279320"}, {"seq": 279319, "cat": "scholarship", "title": "2026학년도 제14회 이시향박사 장학생 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-08-06", "views": 6797, "pinned": false, "posted": "2026-08-06 13:46", "excerpt": "발전기금 이시향박사 장학생 선발계획을 붙임과 같이 안내하오니, 해당 학생들은 기한 내 신청하시기 바랍니다.\n1. 선발인원: 한경면 출신 2명, 제주중앙고 출신 2명, 저소득 성적우수 4명\n(※한경면 및 제주중앙고 출신 선발에서 교육대학 재학생 제외)\n2. 선발기준 및 제출서류: 붙임1 선발계획 참고\n3. 장학금액: 1인 200만원 ※학습보조비 장학금, 타 장학금과 중복수혜 가능\n4. 학과 추천기한: 2026. 8. 24.(월)\n→해당 기한은 각 학과(전공)에서 학생복지과로 공문이 도착하는 기한을 말하며, 학과별로 장학생 신청서류 접수기간이 상이할 수 있으니 제출기한은 반드시 각 학과로 문의바람", "attachments": [{"name": "2026학년도 제14회 이시향박사 장학생 선발계획(안).hwp (159 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279319&no=1"}, {"name": "이시향 장학생 추천서.hwp (30 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279319&no=2"}, {"name": "개인정보 수집이용 및 제3자 제공 동의서.hwp (76 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=279319&no=3"}], "deadline": "2026-08-24", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": "1인 200만원 ※학습보조비 장학금, 타 장학금과 중복수혜 가능", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=279319"}, {"seq": 279302, "cat": "general", "title": "★ 해외(카자흐스탄 등) 취업사기 피해 예방을 위한 주의 안내", "author": "학생복지과", "date": "2026-08-05", "views": 7953, "pinned": false, "posted": "2026-08-05 18:01", "excerpt": "최근 카자흐스탄 등 해외 일부 지역에서 SNS 및 메신저(텔레그램 등)를 통해 '고수익 보장', '항공권·숙식 제공', '단기 통역/IT 업무' 등을 미끼로 재학생 및 청년을 유인한 뒤,\n현지 도착 시 여권을 압수하고 불법 스캠 범죄에 강제로 동원하는 해외 취업 사기 피해 사례가 발생하고 있습니다.\n이에 주의사항을 안내드리니, 안전한 대학생활을 위하여 아래의 사항을 숙지하여 주시기 바랍니다.\n1. 주요 피해 수법\n◦ SNS, 메신저, 구인구직 사이트를 통한 \"고수익 단기 알바\", \"단순 통역·번역\" 모\n◦ 현지 도착 즉시 여권 및 통신 기기 압수 후 외부와 차단\n◦ 리딩방 사기, 로맨스 스캠, 보이스피싱 등 불법 행위 강제 동원 및 감금·협박\n2. 유의 사항 및 행동 수칙\n◦ (검증되지 않은 채널 주의) 비공식 메신저(텔레그램, DM 등)를 통한 고수익 해외 채용 제안은 무조건 의심\n◦ (업체 및 비자 사전 확인) 정식 취업 비자 발급 여부 및 해외 구인 업체의 실존 여부 필수 검증…", "attachments": [], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279302"}, {"seq": 279296, "cat": "event", "title": "주한미국대사관 연계 「Discover U.S. 글로벌 의사 소통 역량 강화 프로그램」 8월 2차 모집 안내", "author": "RISE 사업단", "date": "2026-08-05", "views": 7395, "pinned": false, "posted": "2026-08-05 15:19", "excerpt": "▶ 신청 기간: 2026. 8. 5. ~ 8. 14. (17:00시까지)\n▶ 운영 기간: 2026. 8. 18.(화) ~ 2026. 8. 20.(목)/ 매일 13:00~15:00\n▶8월 18일(화) 제주대학교 런칭 회차 주한미국대사관 외교관 참여 예정!\n▶ 회차별 운영/3회 모두 신청 가능/1회차만 신청 가능\n▶ 문의: 제주대학교 RISE사업단 산학연계교육2팀(064-754-4560)", "attachments": [{"name": "8월 참가 안내 포스터_최종(2차).png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279296&no=1"}], "deadline": "2026-08-14", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "제주대학교 RISE사업단 산학연계교육2팀(064-754-4560)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279296"}, {"seq": 279281, "cat": "volunteer", "title": "(완료)2026학년도 2학기 국가근로 장애대학생 수업도우미학생 모집안내(초과학기생, 소득분위 가능)(4)", "author": "학생복지과(학생)", "date": "2026-08-05", "views": 6691, "pinned": false, "posted": "2026-08-05 10:37", "excerpt": "2026학년도 2학기 국가근로 장애대학생 수업도우미학생 모집안내(초과학기생, 소득분위 가능)\n- 장애대학생 성명 : 이**\n- url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279245"}, {"seq": 279230, "cat": "event", "title": "[기초과학 전문가 초청 대중강연] “기상과학의 발달과정과 기후위기 원인의 이해”(8/22)@제주 문학관", "author": "제주대학교 기초과학연구소", "date": "2026-08-04", "views": 7308, "pinned": false, "posted": "2026-08-04 14:16", "excerpt": "제주대학교 기초과학연구소입니다.\n2026 기초과학 전문가 초청 대중강연을 아래와 같이 안내드립니다.\n요즘 날씨는 왜 이렇게 달라졌을까요?\n폭염, 집중호우, 태풍 같은 이상기상은 우리 생활과 어떻게 연결되어 있을까요?\n이번 강연에서는 일기예보의 발달 과정부터 기후위기의 원인과 기후위기 시대 시민의 역할까지 쉽고 흥미롭게 살펴봅니다.\n*주제: 기상과학의 발달과정과 기후위기 원인의 이해\n*연사: 김해동 교수(계명대학교)\n*일시: 2026. 8. 22.(토) 14:00 ~ 16:00\n*장소: 제주문학관(제주시 연북로 339)\n*대상: 관심 있는 누구나\n*참가 신청방법: 네이버 폼 QR코드 신청\n- 네이버 폼 : https://naver.me/xqbvKCUm\n(링크가 열리지 않을 경우, 링크 주소를 복사한 뒤 인터넷 주소창에 붙여넣어 접속해 주세요!)\n*문의: 064-754-8308(제주대학교 기초과학연구소)\n자세한 사항은 포스터를 참고해 주시기 바라며, 많은 관심과 참여 부탁드립니다.\n※전…", "attachments": [{"name": "2026 기초과학 전문가 초청 대중강연 홍보 포스터 .png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279230&no=1"}, {"name": "2026 대중강연 전체 일정 포스터.png (487 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=279230&no=2"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "관심 있는 누구나", "benefit": null, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=279230"}, {"seq": 279131, "cat": "event", "title": "(제주개발공사) 제주삼다수-지하수 가치 확산 체험형 프로그램 참가 모집 안내", "author": "학생복지과(학생)", "date": "2026-08-04", "views": 7443, "pinned": false, "posted": "2026-08-04 08:45", "excerpt": "", "attachments": [], "deadline": null, "org": "제주개발공사", "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=2
