 null, "how": null, "contact": null, "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=283564"}, {"seq": 283530, "cat": "general", "title": "[앵커사업단] 2026 앵커 교육혁신 융합교육과정 참여후기 숏폼 공모전 신청 안내", "author": "제주대학교 앵커사업단", "date": "2026-11-20", "views": 678, "pinned": false, "posted": "2026-11-20 17:37", "excerpt": "2026학년도 앵커 교육혁신 융합교육과정 참여 학생을 대상으로\n「융합교육과정 참여 후기 숏폼 공모전」을 개최합니다.\n융합교육과정에 참여하며 경험한 다양한 활동과 소감을 숏폼 영상으로\n자유롭게 표현하고 공유할 수 있는 기회이니, 학생 여러분의 많은 관심와 참여 바랍니다.\n1️⃣ 참가자격: 2026 앵커 교육혁신 융합교육과정 참여자\n2️⃣ 공모내용: 자신이 참여한 융합교육과정에 대한 참여 후기를 숏폼으로 제작하여 성과 공유\n3️⃣ 제출형식: 2분 이내 세로형 숏폼 동영상 파일(MP4)\n4️⃣ 제출기한: 2026. 12. 4.(금) 18:00까지\n5️⃣ 제출서류 :\n- 숏폼 참가신청서 및 작품설명서\n- 숏폼 동영상 파일(MP4)\n6️⃣ 제출방법: 이메일 제출(jnurise_edu@jejunu.ac.kr)\n7️⃣ 시상계획: 사업단장상(대상, 최우수상, 우수상, 장려상)\n☎ 문의: 앵커사업단 핵심인재양성팀(064-754-4558,4562)", "attachments": [{"name": "(서식) 융합교육과정 참여 후기 숏폼 참가신청서 및 작품설명서.hwp (41 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283530&no=1"}], "deadline": "2026-12-04", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "앵커사업단 핵심인재양성팀(064-754-4558,4562)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283530"}, {"seq": 283529, "cat": "general", "title": "[앵커사업단] 2026 앵커 교육혁신 융합교육과정 성과공유회 개최 안내", "author": "제주대학교 앵커사업단", "date": "2026-11-20", "views": 513, "pinned": false, "posted": "2026-11-20 17:31", "excerpt": "제주대학교 앵커사업단에서는 2026학년도 앵커 교육혁신 융합교육과정(융합트랙)의 성과 공유 및 우수사례 확산을 위하여 아래와 같이 ‘2026 앵커 교육혁신 융합교육과정 성과공유회’를 운영하고자 하오니 많은 관심과 참석 바랍니다.\n가. 행 사 명: 2026 앵커 교육혁신 융합교육과정 성과공유회\n나. 일 시: 2026. 12. 18.(금) 10:00~18:00\n다. 장 소: 제주대학교 산학협력관 1층 대강당\n라. 대 상: 융합교육과정 참여학과 교수, 학생, 조교 및 참여 기업 관계자 등 누구나\n마. 주요내용(붙임 파일 참조)\n1) 융합교육과정 자체평가 및 비교과 프로그램 우수사례 발표\n2) 융합트랙 참여 후기 숏폼 공모전\n3) 참여 기업 네트워킹 등\n붙임 1. 2026 앵커 교육혁신 융합교육과정 성과공유회 안내문 1부. 026-11-18 13:34", "excerpt": "국제교류처에서 2027학년도 제1학기 해외파견 교류수학생(9차)을 아래와 같이 선발하고자 하오니\n지원을 희망하는 학생은 붙임의 공고문[붙임 파일] 및 세부 정보를 숙지하여 소속 학과 사무실로\n지원서를 제출 바랍니다.\n※해외파견 교류수학 자주하는 질문(국제교류처 홈페이지)\nhttps://cms.jejunu.ac.kr/intl/community/qna4.htm\n1. (9차)파견 예정 대학 및 선발 인원: 3개국 3개 대학 10명 내외(SAF포함) ※[붙임 2] 대학 정보 참조\n※ 2027학년도 1학기 해외파견 교류수학 프로그램(10차) 일정: 11월 말(10차 대학 리스트 미정)\n2. 선발 기준\n- 선발 1순위 대상자 : 수업연한 미초과자*, 해외파견 교류수학 경험이 없는 자(온라인 파견 제외)\n* 수업연한 초과자, 학업연장자 및 대학원생의 경우 대학 지원금 지급 불가\n- 1~2지망 대학을 기준으로 어학 성적 기준을 모두 충족하는 자\n- 어학 기준 충족 인원이 선발 인원 초과 시 학업 …", "attachments": [{"name": "[붙임1] 2027-1학기 해외파견 교류수학 프로그램 9차 선발 공고.pdf (241 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283429&no=1"}, {"name": "2027-1학기 교류수학 선발 대학 세부정보(9차).xlsx (68 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283429&no=2"}, {"name": "[붙임3] (서식) 2027-1학기 해외파견 교류수학 프로그램 9차 지원서.hwp (89 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283429&no=3"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "국제교류과 064)754-2198 / intl3@jejunu.ac.kr", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283429"}, {"seq": 283411, "cat": "volunteer", "title": "[모집] 2026학년도 2학기 국가근로 겨울방학 교류수학 장애학생 기숙사 도우미 모집 (1호관 거주자 우대)", "author": "학생복지과(학생)", "date": "2026-11-18", "views": 657, "pinned": false, "posted": "2026-11-18 11:31", "excerpt": "[모집] 2026학년도 2학기 겨울방학 교류수학 장애학생 기숙사 도우미 모집 (1호관 거주자 우대)\n제주대학교 장애학생지원센터에서는 2026학년도 겨울방학기간 동안 본교에서 교류수학을 진행하는 타 대학 장애학생의 원활한 기숙사 생활을 지원하기 위해 아래와 같이 '한국장학재단 국가근로 장애대학생 도우미'를 모집합니다. 학생 여러분의 많은 관심과 지원 바랍니다.\n1. 활동 안내\n▶ 활동 기간: 2026. 12. 28.(월) ~ 2027. 2. 19.(금)\n▶ 활동 장소: 학생생활관 1호관\n▶ 활동 내용: 휠체어 사용 장애학생의 기숙사 내 생활 지원 (청소 및 빨래, 택배 대리 수령 등)\n▶ 지원 대상: 교류수학 학생 정** (정도가 심한 지체장애 / 휠체어 사용)\n2. 근로 조건\n▶ 근로 유형: 한국장학재단 국가근로 장학 (장애대학생 도우미 유형)\n▶ 급여 단가: 시간당 12,790원\n▶ 근로 시간: 주당 최소 20시간 최대 40시간\n※장애학생과 협의 후 근로 시간 확정\n3. 지원 자격…", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "교류수학 학생 정** (정도가 심한 지체장애 / 휠체어 사용)", "benefit": null, "how": "064-754-2547(담당자 김순자)으로 유선 신청 후 절차 진행", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=283411"}, {"seq": 283397, "cat": "event", "title": "2027 과학기술문화 자문단(대학교 과학기술 동아리) 모집 안내", "author": "학생복지과(학생)", "date": "2026-11-18", "views": 470, "pinned": false, "posted": "2026-11-18 09:59", "excerpt": "과학기술정보통신부와 한국과학창의재단은 청소년의 이공계 유입 촉진의 정책-사업 방향을 함께 모색하고,\n다양한 과학기술문화 프로그램을 함께 기획-운영할 '대학교 과학기술 동아리 자문단'을 모집합니다.\n가. 모집기한 : 2026.11.16(월) ~ 11.30(월), 2주간\n나. 신청방식 : 한국과학창의재단 온라인 접수(https://apply.kosac.re.kr/onlnrcpt/getbscinfo.do?pbancno=2026-s760)\n다. 지원자격 : 학교 측에서 공인된 대학 내 과학기술동아리\n※ 모집 상세정보는 한국과학창의재단 홈페이지 및 공고문 참조\n라. 문의 : 한국과학창의재단 02-559-3885, (이메일) kimbyul@kosac.re.kr\n붙임 : 2027 대학교 과학기술 동아리 자문단 모집 공고문 1부. 끝.", "attachments": [{"name": "붙임_2027 과학문화 자문단 모집 공고 및 신청서 양식.hwpx (68 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=283397&no=1"}], "deadline": "2026-11-30", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "학교 측에서 공인된 대학 내 과학기술동아리", "benefit": null, "how": "한국과학창의재단 온라인 접수(https://apply.kosac.re.kr/onlnrcpt/getbscinfo.do?pbanc…", "contact": "한국과학창의재단 02-559-3885, (이메일) kimbyul@kosac.re.kr", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=283397"}, {"seq": 283385, "cat": "general", "title": "2026 제주대학교 글로컬대학사업단 학생 크리에이터 1기 모집", "author": "글로컬대학사업단", "date": "2026-11-17", "views": 789, "pinned": false, "posted": "2026-11-17 17:42", "excerpt": "📢\n2026 제주대학교 글로컬대학사업단\n학생 크리에이터 1기 모집!\n글로컬대학사업단의 ": "event", "title": "AI 스펙 쌓자! 🍱 <실전 AI 브런치 클래스> 모집", "author": "제주대학교 앵커사업단(프로젝트교육팀)", "date": "2026-11-16", "views": 1088, "pinned": true, "posted": "2026-11-16 09:48", "excerpt": "도시락 먹고 AI 스펙 쌓자! 🍱 <실전 AI 브런치 클래스> 모집\n\"화·목 점심 뭐 먹지?\" 고민 끝!\n맛있는 무료 도시락 먹으면서 웹페이지부터 요즘 핫한 숏 드라마까지 AI로 뚝딱 만들어보는 시간!\n코딩의 'ㅋ'자도 몰라도 완전 환영합니다\n👉 신청하기 클릭!!\n* 대상: 제주대학교 재학생 누구나 (코딩 몰라도 OK!)\n* 일시: 11. 24.(화) ~ 12. 3.(목) 매주 화·목 11:00~14:00\n- 11/24(화): 나만의 웹 페이지 제작\n- 11/26(목): 모집 페이지 제작·배포, 업무 자동화\n- 12/1(화): 브랜드 이미지 제작\n- 12/3(목): 홍보 영상·숏 드라마 제작\n* 장소: 산학협력관 321호\n* 혜택 및 준비물: 점심 도시락 무료 제공 🍱 / 개인 노트북 지참 필수\n* 모집 기간: 11. 12.(목) ~ 11. 20.(금)\n* 모집 인원: 회차별 선착순 20명 (원하는 강의 중복 신청 가능!)", "attachments": [], "deadline": "2026-11-20", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 누구나 (코딩 몰라도 OK!)", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=283301"}, {"seq": 283299, "cat": "scholarship", "title": "[한국건설교통신기술협회] 2026년 미래 건설교통신기술인 장학사업 안내", "author": "학생복지과(장학)", "date": "2026-11-16", "views": 675, "pinned": false, "posted": "2026-11-16 09:18", "excerpt": "한국건설교통신기술협회에서 건설교통 분야 미래인재의 학업을 지원하고 우수 인재를 육성하기 위해\n미래 건설교통기술인 장학생을 선발하오니, 희망하는 학생은 기한 내 신청하시기 바랍니다.", "attachments": [{"name": "미래 건설교통신기술인 장학사업 안내.pdf (124 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=283299&no=1"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=283299"}, {"seq": 283296, "cat": "general", "title": "2026학년도 제7회 모의토익 실시(11/27,금) 안내", "author": "국제교류과", "date": "2026-11-16", "views": 817, "pinned": false, "posted": "2026-11-16 08:58", "excerpt": "2026년 제7회 모의토익 실시 안내\n국제교류처 언어교육 회(회차별 2시간)\n- 참여 대상: 제주대학교 학생 누구나\n- 모집 인원: 회차별 20명 이내\n- 교육 내용: AI를 활용한 자기주도적 외국어 학습 방법 및 AI 활용 실습\n- 운영 장소: 언어교육원 3층 314호 강의실\n※ 신청 수요에 따라 장소가 변경될 수 있습니다.\n- 강사: YBM 강사\n2. 세부 일정\n- 위 홍보물 일정 참고\n※ 참여 가…", "attachments": [], "deadline": "2026-11-23", "org": "국제교류처", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "제주대학교 학생 누구나", "benefit": null, "how": "온라인 신청", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283260"}, {"seq": 283249, "cat": "general", "title": "【교수학습지원센터】 2026학년도 「AI와 함께하는 바이브코딩(온라인특강)」참여자 모집 안내 (~11/15)", "author": "교수학습지원센터", "date": "2026-11-12", "views": 1110, "pinned": false, "posted": "2026-11-12 16:19", "excerpt": "제주대학교 교수학습지원센터에서는 2026학년도 AI 활용 역량강화 프로그램 「AI와 함께하는 바이브코딩」 참가자를 모집합니다.\n코딩을 몰라도 괜찮아! AI와 함께 웹사이트를 만들고, 공모전까지 도전하는 특별한 경험!\nAI를 활용한 웹서비스 개발에 관심 있는 학생들의 많은 관심과 참여 바랍니다 :)\n──────────────────\nStep1. [AI와 함께하는 바이브코딩] 함께해요 :)\n──────────────────\n코딩을 몰라도 웹사이트를 만들 수 있다면?\n아이디어에서 웹서비스 개발·배포까지!\nAI 도구를 활용하여 웹사이트를 직접 제작하고, 기능을 확장하여 하나의 웹서비스로 완성해 보세요!\n특강 수강 후에는 「AI 바이브 코딩 챌린지 공모전」에 참여하여 생활·대학·사회 문제를 해결하는 나만의 웹서비스를 개발할 수 있습니다.\n※ 특강 또는 공모전 각각 별도 참여 가능(단, 특강 참여자의 경우 공모전 심사 시 가산점 부여)\n제주대학교, 전북대학교, 국립군산대학교, 전주교육대학교 학…", "attachments": [], "deadline": "2026-12-06", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생", "benefit": null, "how": "공동교육혁신센터 홈페이지(http://www.jjec.or.kr) 를 통한 온라인 신청", "contact": "전북·제주공동교육혁신센터", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283249"}, {"seq": 283247, "cat": "general", "title": "[수강료 0원 + 수료생 전원 100만원 지급] 제주대학교 제주 콘텐츠 AI 부트캠프 교육생 모집", "author": "제주콘텐츠AX사업단", "date": "2026-11-12", "views": 1326, "pinned": false, "posted": "2026-11-12 15:57", "excerpt": "취업으로 이어지는 실무 AI 교육\n제주 콘텐츠 AI 부트캠프 교육생 모집\n[수강료 0원+수료생 전원 100만원 지급]\n*내일배움카드 없이 수강 가능!\n*국민취업지원제도 60만원 추가 수령 가능\n8일 만에 완성하는 실무 중심 인재 양성 과정\n기업이 원하는 AI 실무 인재 양성\n수강 전: 코딩이 막막한 비전공자, 이력서에 쓸 만한 실무 프로젝트 경험 부족\n수강 후: 생성형 AI 기반 웹·앱 기획/개발 역량 확보, 실제 기업 연계 해커톤 참여, 1:1 맞춤형 취업 포트폴리오 완성\n[√]포트폴리오가 없어 콘텐츠·마케팅·기획 직무 지원을 망설이는 분\n[√]생성형 AI 툴을 실무 서비스 제작에 제대로 써먹고 싶은 분\n[√]기업 연계 실무 경험과 전문가 포트폴리오 컨설팅을 받고 싶은 분\n교육으로 끝나지 않는 AI 실전 교육\n○ (초·중급-3기) 제주 IP 초중급 AX 기반 과정\n온라인: 12. 7.(월) ~ 12. 23.(수)\n오프라인: 12. 14.(월) ~ 12. 23.(수) 09:00~18…", "attachments": [{"name": "[포스터]제주 콘텐츠 AI 부트캠프 교육생 모집(11. 12.).jpg (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283247&no=1"}], "deadline": "2026-12-13", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "만 19세~34세 미취업 청년", "benefit": "수강료 전액 무료", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283247"}, {"seq": 283243, "cat": "general", "title": "[육성] 2026 동계 방학 글로벌 커리어 디자인(호주) 연수생 모집!(~11/18)", "author": "진로취업과", "date": "2026-11-12", "views": 1330, "pinned": true, "posted": "2026-11-12 15:15", "excerpt": "🌏✈️ [국립대학육성사업] 2026 동계방학 글로벌 커리어 디자인(호주) 연수생 모집!\n호주에서 글로벌 직무 경험을 쌓고 글로벌 리더로 성장할 수 있는 특별한 기회! 🔥\n재학생의 글로벌 진로 탐색 및 취업 역량 강화를 위해 「2026 동계방학 글로벌 커리어 디자인(호주)」 연수생을 모집합니다. 😉\nUTS 대학교 단기 과정부터 산업체 직무 연수, 인턴십 프로젝트, 현지 산업체 탐방까지 다양한 프로그램에 참여할 수 있는 기회이니 관심 있는 학생들의 많은 신청 바랍니다!\n📌 운영 개요\n· 운영기간: 2026년 11월 ~ 2027년 2월\n- 국외연수 일정: 2027. 1. 5.(화) ~ 1. 29.(금)\n· 운영국가: 호주(시드니)\n· 모집인원: 12명 이내\n· 주요내용 : 국내 연수: 사전 오리엔테이션, 비즈니스 영어 교육 등\n국외 연수: UTS 대학교 단기 과정, 산업체 직무 교육 및 인턴십 프로젝트, 현지 산업체 탐방 등\n📢 모집 안내\n·신청기간: ~ 2026. 11. 18.(수) 1…", "attachments": [{"name": "(육성) 2026 동계방학 글로벌 커리어 디자인(호주) 연수생 모집 안내.pdf (340 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283243&no=1"}, {"name": "(지원서식) 2026 동계방학 글로벌 커리어 디자인 지원 서식.hwp (120 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283243&no=2"}, {"name": ", "title": "【교수학습지원센터】 2026학년도 2학기 글쓰기의 첫걸음 「신입생 글쓰기 기초 Level-Up」프로그램 참여자 모집 알림", "author": "교수학습지원센터", "date": "2026-11-10", "views": 1024, "pinned": false, "posted": "2026-11-10 09:15", "excerpt": "「글쓰기의 첫걸음: 신입생 글쓰기 기초 Level-up 프로그램」은 지식 전달(특강)과 실천적 훈련(튜터링)을 결합한 글쓰기 기초학력 향상 목적 프로그램입니다.\n글쓰기의 기본 원리(글쓰기의 개념-단어-문장-문단과 글)를 다루는 4회의 오프라인 특강을 통해 글쓰기 기초에 대한 체계적 이해를 제공하고,\n글쓰기 튜터링을 통해 학생이 직접 쓴 글에 대한 개별 피드백과 고쳐쓰기 지도를 제공합니다.\n[모집 안내] ※ 선착순으로 마감되니 빠른 신청 부탁드립니다.\n• 모집기간: ~ 2026년 11월 17일(화)\n• 모집인원: 30명\n• 신청방법: 제주대 포털→경력관리→비교과 프로그램→ '글쓰기' 신청\n■ 운영방식\n- 특강(4회), 튜터링(4개 주제)을 교차 배치하여 ‘원리 학습(특강)→쓰기 실습‧피드백(튜터링)’의 순환 구조로 운영\n- 학생 1인 기준 특강 4회와 튜터링 4회(총 8회)에 참여하며, 모든 프로그램은 오프라인으로 진행함.\n□ 글쓰기의 기초 특강(11/20~12/11 매주 금요일 14…", "attachments": [], "deadline": "2026-11-17", "org": null, "opp": {"category": "비교과", "grades": [1], "colleges": "전체", "who": null, "benefit": null, "how": "제주대 포털→경력관리→비교과 프로그램→ '글쓰기' 신청", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283115"}, {"seq": 283085, "cat": "general", "title": "[모집]초등돌봄 강사 양성 및 역량강화 프로그램 수강생 추가 모집 안내", "author": "앵커사업단 늘봄학교지원팀", "date": "2026-11-09", "views": 1206, "pinned": false, "posted": "2026-11-09 14:05", "excerpt": "", "attachments": [{"name": "공고문.pdf (158 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283085&no=1"}, {"name": "제출서식.hwp (102 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283085&no=2"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283085"}, {"seq": 283070, "cat": "volunteer", "title": "2026학년도 2학기 대학생 청소년 AI 교육지원장학금 학생 멘토 등록 및 신청 안내", "author": "학생복지과(학생)", "date": "2026-11-09", "views": 2147, "pinned": false, "posted": "2026-11-09 11:09", "excerpt": "◎ 2026학년도의 경우 현재 대청교(대학생 청소년교육지원사업) 활동 기관 중 대청교AI(대학생 청소년 AI 교육지원 사업)로 전환 신청하는 활동 기관과 사업 진행하고자 합니다.\n◎ 2026학년도 사업 예산에 따라 1인당 최대 활동 가능 시간은 평균 110시간 내외로 제한될 수 있습니다(기관 매칭 및 사업 예산 집행 상황에 따라 변동 가능).\n◎ 기존 활동 중인 대청교 멘토에 사전 안내되는 내용이며, 추후 사업비에 따라 멘토 신규 신청을 받을 수 있습니다.\n◎ 2027학년도 사업은 차년도 1분기 중 안내될 예정입니다.\n◎ 기존 대청교 학생들의 경우 대청교 한국장학재단 포털 상 활동 종료 후 대청AI교로 사업 신청(활동계획서도 제출) 해야 함\n-----------------------------------------------------------------------------------------------------------------------------------------…", "attachments": [{"name": "2026학년도 2학기 대학생 청소년 인공지능(AI) 교육지원장학금 멘토 선발 계획 변경(안).pdf (177 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=283070&no=1"}, {"name": "2026년도 대학생 청소년 AI 교육지원장학금 업무처리기준 변경(안).pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=283070&no=2"}, {"name": "대청AI교 붙임 서식.zip (271 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=283070&no=3"}, {"name": "2026년도 대학생 청소년 AI 교육지원장학금 시스템 매뉴얼(멘토용).pdf (6 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=283070&no=4"}], "deadline": "2027-02-28", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생(현재 대청교 활동 멘토 우선 신청 및 등록)", "benefit": null, "how": null, "contact": null, "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=283070"}, {"seq": 283063, "cat": "general", "title": "[학생상담센터] 2026학년도 대학생 인간관계 증진 집단상담 프로그램 참여자 모집", "author": "학생상담센터", "date": "2026-11-09", "views": 760, "pinned": false, "posted": "2026-11-09 09:58", "excerpt": "집단상담 안내입니다.\n신청기간 : 2026. 11. 3.(화) ~ 11. 23.(월) 선착순 선발 (자유전공 학생, 도외학생, 편입생 우선선발)\n※ 선발대상자는 신청 기간 이후 개별 연락드립니다.\n집단상담 일정 : 2026.11. 27.(금) / 2026. 12. 4.(금) (10:00~16:00) (양일 참석)\n신청 링크:https://forms.gle/RFr6qYDVueHP8DbD8", "attachments": [{"name": "(붙임) 홍보 포스터.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=283063&no=1"}], "deadline": "2026-12-04", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=283063"}, {"seq": 282963, "cat": "general", "title": "[해외파견 교류수학] 2027 가을학기 SAF 방문학생 및 IES 해외 인턴십 대면 설명회 안내", "author": "관리자", "date": "2026-11-06", "views": 1037, "pinned": false, "posted": "2026-11-06 15:15", "excerpt": "SAF Korea 사무소에서는 2027 가을학기 SAF 방문학생 및 IES 해외 인턴십과 관련하여 대면 설명회를 진행하고자 하니,\n관심 있는 학생들은 많은 참여 바랍니다.\n일시: 2026. 11. 21.(토) 13시 ~ 15시\n장소: SAF Korea 사무소 (광화문역 8번 출구)", "attachments": [{"name": "2027 가을학기 SAF 방문학생 IES 해외 인턴십 대면 설명회 포스터.png (4 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282963&no=1"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282963"}, {"seq": 282960, "cat": "general", "title": "2026년 토익특별반 가을학기 2차 강좌(11월) 모집 안내(~11/13까지 신청연장)", "author": "국제교류과", "date": "2026-11-06", "views": 771, "pinned": false, "posted": "2026-11-06 15:10", "excerpt": "026년 토익특별반 가을학기 2차 강좌(11월) 모집 안내(~11/13까지 신청연장)\n언어교육원에서는 재학생들의 어학 실력 향상을 위해 11월에 단기 어학 강좌 수강생을 모집하고 있습니다. 실시간 줌(Zoom) 프로그램을 활용한 실시간 수업 및 녹화강의 등 다양한 방식으로 수업이 진행하니 관심 있는 학생들의 많은 참여 바랍니다.\n■ 프로그램 세부사항\n1. 진행 프로그램\n- 수준별 토익(비대면), 토익스피킹, 오픽\n- 자세한 진행 프로그램 첨부(홍보물) 파일 참고\n2. 수업 진행방식 : 줌(Zoom) 비대면 및 녹화강의 제공\n3. 접수 기간 : 2026. 10. 14.(수) ~ 2026. 11. 13.(금) (기간연장)\n4. 진행 기간 : 2026. 11. 09.(월) ~ 2026. 11. 26.(목) / 3주\n5. 수강생 혜택\n가. 졸업 영어 인정점수 강좌당 it": "A형 학기당 600만원(등록금성, 중복수혜불가)과 B형 학기당 400만원(생활비성, 중복수혜가능) 중에 선택하여 수혜 [결격사…", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282859"}, {"seq": 282836, "cat": "general", "title": "(글로컬)에듀리프레시 센터 연계 비교과 프로그램 ｢해녀 : 항일 정신부터 해양 미식까지｣ 모집 안내", "author": "중어중문학과", "date": "2026-11-03", "views": 1292, "pinned": false, "posted": "2026-11-03 15:01", "excerpt": "제주대학교에서 해녀의 항일 정신과 공동체 문화를 통해 제주 해양 인문학의 정체성을 이해하고 창해녀의 삶을 담은 공연과 식사를 통해 해양 자원의 가치와 미식 문화 체험할 수 있는 에듀리프레시 센터 연계 비교과 프로그램 ｢해녀 : 항일 정신부터 해양 미식까지｣을 진행합니다. 학내 구성원 여러분의 많은 관심과 응원 바랍니다.\n◎ 행사 개요\n• 행사명: 에듀리프레시 센터 연계 비교과 프로그램 ｢해녀 : 항일 정신부터 해양 미식까지｣\n• 행사 일시: 2026. 11. 20.(금)[1일간]\n• 참가 대상: 제주대학교 재학생 및 지역주민·타지역 참가자 등\n• 주최/주관: 제주대학교, 제주대학교 글로컬대학사업단\n• 주요 활동: 해녀박물관 관람, 해녀 인터뷰 진행, 고무옷 업사이클링 및 해녀 음식문화 체험, 항일운동 유적 및 해양연구원 탐방", "attachments": [{"name": "(글로컬)해녀 포스터.jpg (2 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282836&no=1"}], "deadline": "2026-11-20", "org": "글로컬", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 및 지역주민·타지역 참가자 등", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282836"}, {"seq": 282814, "cat": "scholarship", "title": "2026학년도 발전기금 자매국수 장학생 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-11-03", "views": 2083, "pinned": false, "posted": "2026-11-03 11:36", "excerpt": "2026학년도 발전기금 자매국수 장학생 선발계획을 붙임과 같이 안내하오니 희망 학생은 기한 내 학과 사무실로 신청하여 주시기 바랍니다.\n1. 선발인원: 4명(대정읍 2명, 저소득 2명)\n2. 추천기한: ~ 2026. 11. 18.(수)\n※ 학과에서 학생복지과로 공문 접수되는 기한을 말하며, 학과(전공)별 신청서 접수 기간은 상이할 수 있으니 신청서 제출기한은 학과로 문의 바람\n3. 장학금액: 1인 100만원(학습지원금으로 등록금성 장학금과 중복수혜 가능*)\n* 2026학년도 등록금 이외에 학습보조비 장학금 100만원 이상 수혜한 학생 제외\n4. 제출서류\n- 장학생 신청서 1부(공통)\n- 학자금 지원구간 통지서 1부(공통)\n- 주민등록 등(초)본(주소지 이력 포함) 1부(대정읍 출신)\n- 가족관계증명서 1부(대정읍 출신)\n※ 세부사항 붙임 선발계획 참고" 26-11-03", "views": 962, "pinned": false, "posted": "2026-11-03 10:55", "excerpt": "“친구가 힘들어 보이는데, 어떤 말을 건네면 좋을까?”\n“도움을 주고 싶지만, 어떻게 해야 할지 모르겠어.”\n이런 고민을 해본 적이 있다면,\n생명지킴이 양성 교육 심화과정 '캠퍼스 마음구조대'에 참여해 보세요.\n'캠퍼스 마음구조대'는\n주변 사람의 위기 신호를 알아차리고, 공감하며 대화하고,\n전문적인 도움으로 연결하는 방법을 실습을 통해 배워요.\n아울러 도움을 주는 나의 마음을 돌보는 방법도 함께 알아봅니다.\n- 대상: 생명지킴이 온라인 교육 과정(JNUclass, 1시간)을 이수한 학부생 및 대학원생 20명\n- 일시: 2026. 11. 9.(월) 10:00~12:00\n- 장소: 제주대학교 집단상담실(글로벌하우스 B1)\n- 내용: 위기 신호 알아차리기, 상황별 사례 실습하기, 내 마음 돌보기 등\n- 신청: 2026. 11. 6.(금)까지 온라인 신청 ( https://buly.kr/5UKo7bo )\n- 문의: 학생상담센터 (064-754-4457)\n친구를 돕고 싶은 마음, 혼자 고민하…", "attachments": [{"name": "(붙임) 생명지킴이 양성 교육 심화과정 홍보물.jpg (333 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282806&no=1"}], "deadline": "2026-11-06", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "생명지킴이 온라인 교육 과정(JNUclass, 1시간)을 이수한 학부생 및 대학원생 20명", "benefit": null, "how": null, "contact": "학생상담센터 (064-754-4457)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282806"}, {"seq": 282801, "cat": "general", "title": "(마약류 예방) 해외여행 마약범죄 연루 예방 홍보 영상(40초)", "author": "건강증진센터", "date": "2026-11-03", "views": 1727, "pinned": true, "posted": "2026-11-03 10:39", "excerpt": "겨울방학 해외여행 증가 시기를 틈타 대학생을 타깃으로 한 마약 대리 운반 등 마약 범죄* 연루 사례가 우려되고 있습니다.\n(* 공짜 해외여행이나 고수익 알바 미끼 또는 지인 부탁 등으로 마약류 대리운반)\n(마약류 대리 운반시 마약류 관리법 위반 징역 5년 이하 5천만원 이하의 벌금)\n마약범죄 연루 예방 홍보 영상(40초)을 시청해주세요.", "attachments": [{"name": "마약대리운반_수상한캐리어(40초).mp4 (9 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282801&no=1"}], "deadline": null, "org": "마약류 예방", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282801"}, {"seq": 282798, "cat": "general", "title": "[학생상담센터] 2026학년도 대학생 인간관계 증진 집단상담 프로그램 참여자 모집", "author": "학생상담센터", "date": "2026-11-03", "views": 898, "pinned": false, "posted": "2026-11-03 10:20", "excerpt": "집단상담 안내입니다.\n신청기간 : 2026. 11. 3.(화) ~ 11. 23.(월) 선착순 선발 (자유전공 학생, 도외학생, 편입생 우선선발)\n※ 선발대상자는 신청 기간 이후 개별 연락드립니다.\n집단상담 일정 : 2026.11. 27.(금) / 2026. 12. 4.(금) (10:00~16:00) (양일 참석)\n신청 링크: https://forms.gle/RFr6qYDVueHP8DbD8", "attachments": [{"name": "(붙임) 홍보 포스터.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282798&no=1"}], "deadline": "2026-12-04", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282798"}, {"seq": 282794, "cat": "scholarship", "title": "2026년 국가근로장학금 동계방학 집중근로 일정(학생신청 기간포함~11월12일까지) 안내", "author": "학생복지과(장학)", "date": "2026-11-03", "views": 1982, "pinned": false, "posted": "2026-11-03 09:46", "excerpt": "한국장학재단에서 운영하고 있는 「동계방학 집중근로 프로그램」일정에 대해 아래와 같이 알려 드리니, 해당 프로그램에 참여를 희망하는 학생은 신청하시기 바랍니다.\n1. 동계방학 집중근로 프로그램 개요\n가. 운영기간 : ’27. 1. 1.(금) ∼ 2. 19.(금)\n나. 지원대상 : 2026년 2학기 국가근로장학금 일반 유형을 신청한 재학생\n다. 지원단가 : 교외근로 시간당 12,790원\n라. 근로시간 : 1일 최대 8시간, 주당 최대 40시간, 학기당 최대 640시간 이내\n2. 동계방학 집중근로 운영 일정\n①대학\n⇨\n②근로기관\n⇨\n③근로장학생\n동계방학 집중근로 신청\n~’26. 10. 16.(금)\n근로장학생 수요 신청\n’26. 9. 29.(화) ∼ 10. 20.(화)\n희망 근로지 신청\n’26. 10. 30.(금) ∼ 11. 12.(목)\n⇩\n⑥근로장학생\n⇦\n⑤대학\n⇦\n④한국장학재단\n동계방학 집중근로 진행\n’27. 1. 1.(금) ∼ 2. 19.(금)\n근로장학생 선발\n∼ ’26. 12. 11…", "attachments": [{"name": "붙임1-1. 2026년 동계방학 집중근로 희망근로지 신청 매뉴얼(홈페이지).pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282794&no=1"}, {"name": "붙임1-2. 2026년 동계방학 집중근로 희망근로지 신청 매뉴얼(모바일).pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282794&no=2"}], "deadline": "2026-11-12", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "2026년 2학기 국가근로장학금 일반 유형을 신청한 재학생", "benefit": null, "how": null, "contact": "한국장학재단 상담센터(☎ 1599-2290)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282794"}, {"seq": 282792, "cat": "general", "title": "[수강료 0원 + 수료생 전원 100만원 지급] 제주대학교 제주 콘텐츠 AI 부트캠프 교육생 모집", "author": "제주콘텐츠AX사업단", "date": "2026-11-03", "views": 1246, "pinned": false, "posted": "2026-11-03 09:18", "excerpt": "취업으로 이어지는 실무 AI 교육\n제주 콘텐츠 AI 부트캠프 교육생 모집\n[수강료 0원+수료생 전원 100만원 지급]\n*내일배움카드 없이 수강 가능!\n*국민취업지원제도 60만원 추가 수령 가능\n8일 만에 완성하는 실무 중심 인재 양성 과정\n기업이 원하는 AI 실무 인재 양성\n수강 전: 코딩이 막막한 비전공자, 이력서에 쓸 만한 실무 프로젝트 경험 부족\n수강 후: 생성형 AI 기반 웹·앱 기획/개발 역량 확보, 실제 기업 연계 해커톤 참여, 1:1 맞춤형 취업 포트폴리오 완성\n[√]포트폴리오가 없어 콘텐츠·마케팅·기획 직무 지원을 망설이는 분\n[√]생성형 AI 툴을 실무 서비스 제작에 제대로 써먹고 싶은 분\n[√]기업 연계 실무 경험과 전문가 포트폴리오 컨설팅을 받고 싶은 분\n교육으로 끝나지 않는 AI 실전 교육\n○ (초·중급-2기) 제주 IP 초중급 AX 기반 과정\n온라인: 11. 23.(월) ~ 12. 9.(수)\n오프라인: 11. 30.(월) ~ 11. 4.(수) 09:00~18:…", "attachments": [{"name": "[포스터]제주 콘텐츠 AI 부트캠프 교육생 모집.jpg (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282792&no=1"}, {"name": "[리플릿]제주 콘텐츠 AI 부트캠프 교육생 모집.pdf (289 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282792&no=2"}], "deadline": "2026-11-29", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "만 19세~34세 미취업 청년", "benefit": "수강료 전액 무료", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282792"}, {"seq": 282767, "cat": "general", "title": "(글로컬대학)2026학년도 해외대학 파견을 위한 외국어 역량 Jump-Up 참여자 모집(추가모집 ~11/5))", "author": "국제교류과", "date": "2026-11-02", "views": 1196, "pinned": false, "posted": "2026-11-02 17:25", "excerpt": "(글로컬대학)2026학년도 해외파견을 위한 외국어 역량 Jump - Up (추가모집 ~11/5)\n해외대학 파견을 희망하는 학생 중 어학성적 기준을 충족하지 못해 지원에 어려움을 겪는 학생을 위해\n「해외파견을 위한 외국어 역량 Jump-Up」프로그램 참여자를 모집합니다.\n자세한 내용은 첨부파일 프로그램 안내문(pdf 파일)을 꼭 참고해주시기 바랍니다.\n※언어권별 인원 미달일 경우 폐강될 수 있습니다.", "attachments": [{"name": "해외파견을 위한 외국어 역량 Jump-Up 안내(문)_추가모집.pdf (130 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282767&no=1"}], "deadline": null, "org": "글로컬대학", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282767"}, {"seq": 282762, "cat": "general", "title": "[학생상담센터] 11월 심리검사 프로그램 참가신청 안내", "author": "학생상담센터", "date": "2026-11-02", "views": 1108, "pinned": false, "posted": "2026-11-02 15:57", "excerpt": "11월 심리검사 프로그램 참가신청 안내\n11월 심리검사 및 해석상담 프로그램 참가신청 안내드립니다.\n참가 대상 : 제주대학교 재학생 (학부생, 대학원생) 및 교직원\n신청 기간 : 2026. 11. 02. (월) ~ 2026. 11. 05. (목)\n검사 코드 발송 : 2026. 11. 06. (금) 13:00 - 14:00\n온라인 검사 결과 확인 또는 1:1 개인 해석상담 : 2026. 11. 09. (월) ~ 2026. 11. 24. (화)\n수검 방법: 심리검사 온라인 코드 수령 후 심리검사 실시(온라인)\n문의 번호: 064-754-4506\n신청 링크 : https://zrr.kr/YCJMsk\n많은 참여 부탁드립니다.", "attachments": [{"name": "2026-2 11월 심리상담 포스터.jpg (1021 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282762&no=1"}], "deadline": "2026-11-05", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 (학부생, 대학원생) 및 교직원", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282762"}, {"seq": 282759, "cat": "general", "title": "2026학년도 '마약류 중독 예방 캠페인' 및 '마약류 오남용 예방 교육' 참여 안내", "author": "건강증진센터", "date": "2026-11-02", "views": 1242, "pinned": false, "posted": "2026-11-02 15:10", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": 부 대학생기자단 울림 22기 모집 안내", "author": "학생복지과(학생)", "date": "2026-11-02", "views": 1360, "pinned": false, "posted": "2026-11-02 08:50", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=282714"}, {"seq": 282695, "cat": "general", "title": "【교수학습지원센터】 2026학년도 2학기 학습역량강화 「학습법워크숍-온라인특강」 운영 알림", "author": "교수학습지원센터", "date": "2026-10-30", "views": 1842, "pinned": false, "posted": "2026-10-30 17:53", "excerpt": "제주대학교 교수학습지원센터에서는 재학생의 자기주도적 학습역량 강화를 위해 「2026학년도 2학기 학습법 워크숍(온라인 특강)」을 운영합니다.\n학습역량 주요 영역별 맞춤형 강좌를 통해 자신에게 필요한 학습전략을 익히고, 효과적인 학습습관을 형성할 수 있도록 다양한 온라인 강좌를 제공하오니 많은 관심과 참여 바랍니다.\n나에게 맞는 학습법을 찾고, 더 나은 학습습관을 만들어보세요!\n학생 여러분의 적극적인 참여 바랍니다 :)\n■ 운영 안내\n- 참여대상: 제주대학교 학부 재학생(휴학생 및 수료생도 수강 가능)\n- 신청기간: 2026. 10. 30.(금) ~ 2027. 1. 22.(금)\n- 운영기간: 2026. 10. 30.(금) ~ 2027. 1. 31.(일)\n- 운영방법: JNU Class를 통한 온라인 특강 수강\n- 주요내용\n인지영역: 메타인지, 창의적 사고\n기술영역: 기초학습, 응용학습, 효율적 학습, 자기관리·협업기술, 비전공자를 위한 IT 정석\n태도영역: 학습동기, 학습정서, AI시…", "attachments": [], "deadline": "2027-01-22", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생(휴학생 및 수료생도 수강 가능)", "benefit": null, "how": null, "contact": "교수학습지원센터 ☎ 064-754-2674", "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282695"}, {"seq": 282659, "cat": "scholarship", "title": "[주거안정장학금 선발완료 학생용]2026년 장학생 지급요청서 작성 매뉴얼 안내", "author": "학생복지과(장학)", "date": "2026-10-30", "views": 1930, "pinned": false, "posted": "2026-10-30 11:10", "excerpt": "[주거안정장학금 선발완료 학생용]2026년 장학생 지급요청서 작성 매뉴얼 안내드리오니, 선발된 학생들은 기한내 지급요청서 작성하여 주시기 바랍니다.\n● 제출기한: 매월 5일까지 *2026-2학기 변동사항: (기존)3개월분 일괄지급 → (변경)매월 지급\n● 작성방법\n-매월 5일까지 직전월에 대한 지급요청서 작성(붙임파일 참고)(ex. 11월 5일까지 10월 지급요청서 작성)\n-한국장학재단홈페이지(한국장학재단)→장학금→주거안정장학금→지급요청서 작성\n● 지급일자: 매월 15일~20일 사이\n※ 제출기한까지 지급요청서 미작성시 장학금 지급이 지연될 수 있습니다.(전체학생 장학금 일괄 지급)\n※ 국가나 지자체 주거지원사업으로 수혜를 받고 있는 경우 중복 수혜에 해당하므로, 지급불가함(단, 국토부 가구 단위 주거급여와는 중복 수혜 가능)\n→ 중복수혜 관련하여 정확한 확인 등 필요한 경우 한국장학재단 상담센터로 문의(1599-2000)", "attachments": [{"name": "(붙임) 2026년 장학생 지급요청서 작성 매뉴얼.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282659&no=1"}, {"name": "(붙임) 2026년 장학생 포기 및 반환 매뉴얼.pdf (969 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282659&no=2"}], "deadline": "2026-11-05", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282659"}, {"seq": 282579, "cat": "event", "title": "★2026년 제주 지·산·학 IP 페스티벌 행사 개최★", "author": "지식재산교육센터", "date": "2026-10-30", "views": 1935, "pinned": false, "posted": "2026-10-30 10:07", "excerpt": "★2026년 제주 지·산·학 IP 페스티벌 행사 개최★\n- 2026년 11월 6일(금) 13:40 ~\n- 메종글래드 제주 1층 컨벤션홀\n많은 관심과 참여 부탁드립니다 !!", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=282579"}, {"seq": 282536, "cat": "class", "title": "2026학년도 동기 계절학기 한국외국어대학교 교류수학 안내", "author": "교육혁신과", "date": "2026-10-29", "views": 1853, "pinned": false, "posted": "2026-10-29 17:13", "excerpt": "2026학년도 동기 계절학기 한국외국어대학교 교류수학 안내\n◆ 수업기간: 2026. 12. 22.(화) ~ 2027. 1. 13.(수) ※ 교과목별 수업기간이 다를 수 있음\n1. 신청자격: 1학기 이상 이수한 성적 평균 평점이 2.4 이상인 학부 학생(휴학생은 별도 문의 바랍니다)\n2. 신청방법 : 2026. 11. 13.(금) 18:00까지 필요서류를 갖추어 소속학과로 신청(첨부파일 참조)\n3. 제출서류 : 타대학수학신청원(첨부파일 참조) 및 소정양식(교류대학양식으로, 첨부파일 참조)\n4. 주의사항\n- 교류수학 타대학 중복신청 불가\n- 교류 대학별 신청일정 및 수강신청 방법 등 안내사항 필히 027).pdf (554 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=282477&no=4"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=282477"}, {"seq": 282472, "cat": "general", "title": "2026학년도 동계 단기 해외 어학연수 프로그램(2차) 및 추가 선발 안내", "author": "국제교류처", "date": "2026-10-29", "views": 2763, "pinned": false, "posted": "2026-10-29 11:10", "excerpt": "□ 프로그램명: 2026학년도 동계 단기 해외 어학연수 프로그램(2차) 및 추가선발\n□ 운영내용: 교류대학에 파견되어 어학과정(3~4주)을 이수하고, 본교 학점(2~3학점)을 취득\n□ 지원자격\n- 지원 마감일 기준 한 학기 이상 이수한 자\n- 연수 종료 후 1개 학기 이상 수학 가능한 재학생\n- 이수한 학기까지 전체 성적이 2.4/4.3 이상인 자\n□ 지원제한\n- 우리대학 학칙에 의거하여 징계 받은 사실이 있는 자\n- 입학 후 타 대학 이수학점이 졸업에 필요한 학점의 2분의 1을 초과하는 자\n- 2026학년도 2학기 현재 휴학생 및 2027년 2월 졸업 예정자\n- 국제교류처 주관 해외어학연수 프로그램 기 참가자 및 해외어학연수 1 또는 2 교과목 취득자\n□ 선발기준: [붙임 1] 안내자료\n□ 교류대학 목록 및 파견인원(2차 및 추가 선발)\n※ 대학별세부 정보 및 일정: [붙임 2] 파견대학 안내 자료 참고\n(싱가포르, 캐나다: https://cms.jejunu.ac.kr/intl/c…", "attachments": [{"name": "(육성)2026학년도 동계 단기 해외 어학연수 프로그램(2차) 및 추가선발 안내자료.pdf (273 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282472&no=1"}, {"name": "2026학년도 동계 단기 해외 어학연수(2차) 파견 대학 안내.pdf (300 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282472&no=2"}, {"name": "[서식] 2026학년도 동계 단기 해외 어학연수 지원서 및 수학계획서.hwp (136 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282472&no=3"}], "deadline": "2027-02-04", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "첨부된 신청서를 작성하여 소속 학과 사무실에 접수", "contact": "제주대학교 국제교류처 어학연수 담당자(제주대학교 아라뮤즈홀 3층 국제교류과 / 064-75…", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282472"}, {"seq": 282460, "cat": "general", "title": "2026 학생생활관 동기방학 특별개관 입주학생 모집 안내", "author": "학생생활관", "date": "2026-10-29", "views": 1883, "pinned": false, "posted": "2026-10-29 10:25", "excerpt": "1. 학생생활관 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭 확인해 주세요. 또한, 입주기간 변경이 어려우니 신청 시 입주기간을 신중히 결정하시어 신청하시기 바랍니다.\n2. 타대학 교류학생인 경우 원활한 신청을 위하여 신청 시간 전에 모집 안내문의 [붙임1]을 참조하여 제주대학교 포털시스템에서 로그인 해보시기 바랍니다.\n3. 신청은 되도록 PC나 노트북 등으로 해주시기 바라며, 스마트폰에서는 신청이 안될 수 있으니 이점 유의 바랍니다. 그리고 인터넷 브라우저는 크롬이나 엣지를 활용해 주세요. 그 외 브라우저에서는 신청이 안될 수 있습니다.\n4. 건물별(호관별)로 모집인원보다 신청인원이 현저히 적을 경우 에너지의 효율적 운영을 위해 저층부터 운영할 예정이니 2학기 입주자 중 고층 입주자들은 저층 입주실로 이동할 예정이니 이점 협조 바랍니다.", "attachments": [{"name": "2026 동기방학 특별개관 입주학생 모집 안내(문)_홈페이지 첨부용.pdf (369 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282460&no=1"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282460"}, {"seq": 282450, "cat": "general", "title": "찾아가는 해외파견 교류수학 프로그램 설명회 (2차) 안내", "author": "국제교류과", "date": "2026-10-29", "views": 1442, "pinned": false, "posted": "2026-10-29 09:22", "excerpt": "찾아가는 해외파견 교류수학 프로그램 설명회 (2차) 를 개최함에 따라, 아래와 같이 안내드리오니\n관심있는 재학생들은 설명회에 많은 참여바랍니다.\n가. 운영일정\n단과대학\n날짜 및 시간\n장소\n사범대학\n2026. 10. 29.(목) 16:00~\n사범대학 2호관 2232호\n생명자원과학대학\n2026. 11. 3.(화) 16:00~\n생명자원과학대학 310호\n예술디자인대학\n2026. 11. 4.(수) 16:00~\n미술관 204호 영상미디어실\n해양과학대학\n2026. 11. 11.(수) 16:00~\n해양과학대학 1호관 5121호\nSAF 온라인 설명회\n2026. 11. 12.(목) 17:00~\n온라인 줌으로 진행(추후 별도 공지)\n나. 내용 : 해외파견 교류수학 프로그램 설명 및 SAF 방문학생 프로그램 소개\n다. 참석대상 : 해외파견 교류수학에 관심 있는 재학생\n(문의: 064-754-2198)", "attachments": [{"name": "찾아가는 해외파견 교류수학 프로그램 설명회 (2차).jpg (473 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282450&no=1"}], "d : "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282385"}, {"seq": 282369, "cat": "scholarship", "title": "2027년도 제22기 전기공사공제조합장학회 장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-10-27", "views": 2188, "pinned": false, "posted": "2026-10-27 10:22", "excerpt": "(재) 전기공사공제조합장학회에서 아래와 같이 2027년도 제22기 장학생을 선발한다고 하오니, 관심있는 학생들의 많은 지원 바랍니다.\n가. 선발인원 : 대학생 74명(일반 전형, 조합원 전형)\n나. 지원자격(신청일 기준)\n1) 일반 전형 : 전기관련학과에 재학 중인 자\n2) 조합원 전형 : 전기공사공제조합에 가입된 조합원과 임직원 및 그 자녀(전공 무관)\n다. 성적기준 : 최근 이수학기의 이수학점이 12학점 이상이며, 평균평점이 3.0(4.5만점 기준) 이상인 자\n라. 장 학 금 : 연 금5,000,000원(등록금성, 학기당 최대 금2,500,000원)\n※ 등록금에서 교내 및 국가장학금을 제한 금액을 학기당 최대 250만원 한도 내에서 지급\n마. 지급기간 : 2027년도 1학기 및 2학기(정규학기에 한정) \\\n※ 계절학기 및 초과학기는 지원 불가\n바. 접수기간 : 2026. 11. 2.(월) 9시 ~ 11. 13.(금) 18시\n사. 접수방법 : 온라인 원서접수(www.ecfcsf.o…", "attachments": [{"name": "[붙임1] 2027년도 제22기 장학생 선발 공고.pdf (95 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282369&no=1"}, {"name": "[붙임2] 자기소개서.hwp (25 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282369&no=2"}, {"name": "[붙임3] 체크리스트.hwp (173 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282369&no=3"}, {"name": "[붙임4] 2027년 제22기 장학생 지원서 작성요령 및 제출서류 준비 안내.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282369&no=4"}], "deadline": "2026-11-13", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "온라인 원서접수(www.ecfcsf.or.kr)만 가능(학생이 직접 신청)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282369"}, {"seq": 282367, "cat": "general", "title": "[2026년 10월호 생명존중 카드뉴스] 생명지킴이 양성 교육 심화과정 참여자 모집", "author": "학생상담센터", "date": "2026-10-27", "views": 2874, "pinned": false, "posted": "2026-10-27 10:08", "excerpt": "제주대학교 학생상담센터에서는\n학내 자살예방 및 생명존중문화 조성을 위하여\n생명존중 카드뉴스를 배포합니다.\n누구에게도 말하지 못한 고민으로 마음이 무거운 날,\n혹은 스스로를 감당하기 힘든 위기의 순간이 찾아온다면\n혼자 견디지 않고 아래의 방법을 통해 즉시 도움을 요청하세요.\n1. 교내 상담 지원 (평일 주간)\n- 방문상담: 아라캠퍼스 학생회관 3층 학생상담센터\n- 전화상담: 064-754-4457\n2. 24시간 위기 상담 (야간/공휴일 포함)\n- 전화상담: 109 또는 1577-0199\n- SNS상담: ‘마들랜’\n때로는 누군가에게 마음을 꺼내놓는 것만으로도 큰 위로가 됩니다.\n제주대학교 학생상담센터가 언제나 이곳에서 기다리고 있겠습니다.", "attachments": [{"name": "(붙임) 2026-10월 생명존중 카드뉴스(PNG).png (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282367&no=1"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282367"}, {"seq": 282361, "cat": "general", "title": "[대학원혁신실] 2026학년도 2학기 교내근로장학생 선발 안내", "author": "대학원혁신실(일반대학원_행정실)", "date": "2026-10-27", "views": 2406, "pinned": false, "posted": "2026-10-27 09:34", "excerpt": "2026학년도 2학기 교내근로장학생 선발 안내\n❍ 선발 대상 및 인원: 1명\n- 본교 재학생 중 직전학기에 12학점이상(학부 최종학년 및 대학원생인 경우 1과목 이상 이수) 취득한 외국인 유학생(학부생 가능) 또는 대학원생\n- 신입생은 취득학점 무관\n❍ 모집 일자: 2026.10.27(화)~2026. 10. 30.(금)\n❍ 접수방법 : 제출 서류를 지참하여 본인 방문 접수(사회과학대학 1층 2118호 교육정책팀)\n❍ 면접안내 : 방문 접수 시 현장에서 면접을 바로진행\n- 접수 및 면접 시간 : 오전 10:00 ~ 11:30/ 오후 13:00 ~ 17:00\n- 10.30.(금) 14:00 ~ 16:00에는 행사 일정으로 접수 및 면접이 불가함.\n❍ 근로 기간: 선발 후~2027. 2. 19.(금)\n❍ 지급 단가: 시간 당 10,320원\n❍ 지급일: 청구 대상 월의 다음달 15일 이내\n❍ 근로 내용\n- 외국인 유학생 학사 및 장학 제도 안내\n- 대학원(일반대학원, 특수대학원) 입학 전형…", "attachments": [{"name": "근로장학생 신청서(개인정보포함).hwp (44 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282361&no=1"}], "deadline": "2026-10-30", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "1명", "benefit": null, "how": "제출 서류를 지참하여 본인 방문 접수(사회과학대학 1층 2118호 교육정책팀)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282361"}, {"seq": 282346, "cat": "general", "title": "[모집] 온(ON)동네 초등돌봄 강사 양성 및 역량강화 프로그램 수강생 모집", "author": "앵커사업단 늘봄학교지원팀", "date": "2026-10-26", "views": 2639, "pinned": false, "posted": "2026-10-26 16:19", "excerpt": "", "attachments": [{"name": "공고문.pdf (156 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282346&no=1"}, {"name": "제출서식.hwp (102 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282346&no=2"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282346"}, {"seq": 282322, "cat": "scholarship", "title": "2026학년도 2학기 국가근로장학생 선발 공고문(입학관리과)", "author": "입학관리과", "date": "2026-10-26", "views": 3344, "pinned": false, "posted": "2026-10-26 09:40", "excerpt": "󰏚 선발개요\n가. 선발인원 : 1명(근로시간 : 약 320시간)\n나. 지원자격(아래 기준을 모두 충족하는 자)\n1) 우리 대학 학부생으로 한국장학재단 국가근로장학금 신청완료자\n2) 학자금 지원구간 9구간 이하 및 직전학기 성적 1.4/4.3(70점/100점) 이상인 재학생\n※ 휴학, 졸업, 수료, 자퇴, 초과학기생, 조기취업자, 시간제등록생 등 제외\n다. 근무부서(업무) : 글로벌하우스 2층 입학관리과(행정업무 보조)\n라. 근로기간 : 최종 선발일로부터 ∼ 2027. 2. 19.(금)\n마. 선발기준 : 소득분위(50점), 면접(30점), 성적(20점), 가점(직전학기 미선발자) 5점\n󰏚 지원기간 및 방법\n가. 지원기간 : 2026. 10. 26.(월) ∼ 10. 28.(수) 18:00\n나. 지원방법 : 입학관리과 방문하여 서류 제출(글로벌하우스 2층)\n다. 제출서류\n1) 국가근로장학 참여신청서 1부.\n2) 학자금지원구간(장학재단) 확인자료 1부.\n3) 2026학년도 2학기 수업시간표…", "attachments": [{"name": "2026학년도 2학기 국가근로장학생 선발 공고문(입학관리과).hwpx (60 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282322&no=1"}, {"name": "국가근로장학 참여신청서(서식).hwp (48 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282322&no=2"}], "deadline": "2027-01-04", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "입학관리과 방문하여 서류 제출(글로벌하우스 2층)", "contact": "입학관리과(☎064-754-3991)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282322"}, {"seq": 282288, "cat": "class", "title": "2026학년도 동기 계절학기 부산외국어대학교 교류수학 안내", "author": "교육혁신과", "date": "2026-10-23", "views": 2273, "pinned": false, "posted": "2026-10-23 15:45", "excerpt": "2026학년도 동기 계절학기 부산외국어대학교 교류수학 안내\n1. 신청자격: 1학기 이상 이수한 성적 평균 평점이 2.4 이상인 학부 학생(휴학생은 별도 문의 바랍니다)\n2. 신청방법 : 2026. 11. 4.(수) 18:00까지 필요서류를 갖추어 소속학과로 신청(첨부파일 참조)\n3. 제출서류 : 타대학수학신청원(첨부파일 참조) 및 소정양식(교류대학양식으로, 첨부파일 참조)\n4. 주의사항\n- 교류수학 타대학 중복신청 불가\n- 교류 대학별 신청일정 및 수강신청 방법 등 안내사항 필히 확인\n- 이수 가능 학점 : 6학점 이내(학부과정) → 지원하는 대학 규정상 상이할 수 있으니, 안내사항 필히 확인\n- 타 대학교 교류수학 중 본교 교과목(원격수업 포함) 수강신청 불가\n- 신청 후 교류수학 변동사항(학적 변경, 포기 등)이 있을 경우 즉시 소속학과로 알림\n5. 학점인정 관련\n- 타 대학에서 이수한 교양과목은 타대학 이수 교양(S)으로, 그 외 과목은 일반선택(G)으로 인정됨\n- 전공, 복수…", "attachments": [{"name": "타 대학 수학신청원 및 취소원 서식.hwp (52 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=282288&no=1"}, {"name": "[붙임1] 2026학년도 동계 계절학기 수학 안내문(타대용).hwp (313 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=282288&no=2"}, {"name": "[붙임2] 2026학년도 동계 계절학기 개설 예정 교과목 목록(최종).xlsx (44 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=282288&no=3"}, {"name": "[붙임3] 2026학년도 동계 계절학기 교류 수학 추천자 명단(양식).xlsx (10 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=282288&no=4"}], "deadline": "2027-02-04", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "1학기 이상 이수한 성적 평균 평점이 2.4 이상인 학부 학생(휴학생은 별도 문의 바랍니다)", "benefit": null, "how": "202 vent.htm?category=200&act=view&seq=282267"}, {"seq": 282266, "cat": "general", "title": "생명지킴이 양성 교육 심화과정 '캠퍼스 마음구조대' 참여자 모집", "author": "학생상담센터", "date": "2026-10-23", "views": 2209, "pinned": false, "posted": "2026-10-23 09:06", "excerpt": "“친구가 힘들어 보이는데, 어떤 말을 건네면 좋을까?”\n“도움을 주고 싶지만, 어떻게 해야 할지 모르겠어.”\n이런 고민을 해본 적이 있다면,\n생명지킴이 양성 교육 심화과정 '캠퍼스 마음구조대'에 참여해 보세요.\n'캠퍼스 마음구조대'는\n주변 사람의 위기 신호를 알아차리고, 공감하며 대화하고,\n전문적인 도움으로 연결하는 방법을 실습을 통해 배워요.\n아울러 도움을 주는 나의 마음을 돌보는 방법도 함께 알아봅니다.\n- 대상: 생명지킴이 온라인 교육 과정(JNUclass, 1시간)을 이수한 학부생 20명\n- 일시: 2026. 11. 9.(월) 10:00~12:00\n- 장소: 제주대학교 집단상담실(글로벌하우스 B1)\n- 내용: 위기 신호 알아차리기, 상황별 사례 실습하기, 내 마음 돌보기 등\n- 신청: 2026. 11. 5.(목)까지 온라인 신청 ( https://buly.kr/5UKo7bo )\n- 문의: 학생상담센터 (064-754-4457)\n친구를 돕고 싶은 마음, 혼자 고민하지 말고 함께…", "attachments": [{"name": "(붙임) 생명지킴이 양성 교육 심화과정 홍보물.png (141 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282266&no=1"}], "deadline": "2026-11-05", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "생명지킴이 온라인 교육 과정(JNUclass, 1시간)을 이수한 학부생 20명", "benefit": null, "how": null, "contact": "학생상담센터 (064-754-4457)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282266"}, {"seq": 282257, "cat": "general", "title": "(글로컬대학)2026학년도 「해외대학 파견을 위한 외국어 역량 Jump-Up」 참여자 모집(수정)", "author": "국제교류과", "date": "2026-10-22", "views": 4253, "pinned": false, "posted": "2026-10-22 17:14", "excerpt": "(글로컬대학)2026학년도 해외파견을 위한 외국어 역량 Jump - Up\n해외대학 파견을 희망하는 학생 중 어학성적 기준을 충족하지 못해 지원에 어려움을 겪는 학생을 위한\n「해외파견을 위한 외국어 역량 Jump-Up」프로그램 참여자를 모집합니다.\n※ 수강료 변경에 따른 장학금 금액 변경이 있으니 수정된 내용에 대해 꼼꼼히 읽어보시기 바랍니다.\n(기존) 수강료: 400,000원 → (변경) 수강료: 260,000원\n(기존) 장학금: 280,000원 → (변경) 장학금: 182,000원\n(기존) 모집인원: 총 40명(영어:20명, 중국어:10명, 일본어:10명)\n→ (변경) 모집인원: 총 65명(영어:30명, 중국어:15명, 일본어:20명)\n참여대상 명확화\n- (기존) 제주대학교 학부 재학생 40명(2027학년도 2학기 해외대학 파견 희망자)\n※2026년도 2학기가 마지막 학기인 학생은 신청 불가\n→ (변경) 제주대학교 학부 재학생 65명(2027 junu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282225"}, {"seq": 282207, "cat": "volunteer", "title": "(시립문래청소년센터)2027 동계 해외봉사단 6기 모집 안내(인도네시아편)", "author": "학생복지과(학생)", "date": "2026-10-21", "views": 2730, "pinned": false, "posted": "2026-10-21 17:12", "excerpt": "2027 시립문래청소년센터 동계 해외봉사단 6기 모집 안내(인도네시아편)\n1. 서울특별시가 설립하고, 명지전문대학에서 운영중인 시립문래청소년센터는 청소년들이 글로벌 감수성과 나눔의 가치를 체득하고, 지속가능한 공동체의 일원으로 성장할 수 있도록 지원하는 해외봉사활동을 운영하고 있습니다.\n2. 이와 관련하여 청소년들이 다양한 봉사활동 및 문화교류를 통해 인성과 역량을 함양할 수 있도록 서울시립청소년문화교류센터와 연계하여‘2027 시립문래청소년센터 동계 해외봉사단 6기(인도네시아편)’ 참가자를 모집하오니, 참여해 주시길 부탁드립니다.\n가. 사 업 명: 2027 시립문래청소년센터 해외봉사단 6기 모집\n나. 모집기간: 2026년 10월 20일(화) ~ 10월 30일(금)\n다. 활동기간:\n구분\n일자\n장소\n사전모임\n2027년 1월 2일(토) ~ 1월 3일(일)\n시립문래청소년센터\n봉사활동\n2027년 1월 13일(수) ~ 1월 20일(수)\n인도네이사 워노소보\n사후모임\n2027년 2월 13일(토)\n…", "attachments": [{"name": "2027 시립문래청소년센터 동계 해외봉사단 6기 모집(인도네시아편) 포스터.png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=282207&no=1"}], "deadline": "2026-10-30", "org": "시립문래청소년센터", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "14세 ~ 24세 청소년 20명(2002년생 ~ 2013년생 신청 가능)", "benefit": "봉사활동 시간 인증, 우수 참가자 표창 등", "how": "네이버폼 신청(https://naver.me/5c8n8a3g) ※ 신청 후 계약금이 납부 확인되어야 신청 완료", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=282207"}, {"seq": 282182, "cat": "general", "title": "(육성_진로취업과) 지역인재 7급 선발 선발 대비 모의고사 참여자 모집", "author": "진로취업과", "date": "2026-10-21", "views": 3423, "pinned": false, "posted": "2026-10-21 12:52", "excerpt": "<지역인재 7급 선발 선발 대비 모의고사>\n1. 건명 : 2027 지역인재 7급 선발 대비 모의고사(PSAT 및 헌법)\n2. 일시 : 2026. 10. 30.(금), 10:00 ~ 17:00 ※ 09:20까지 강의실 입실\n3. 장소 : 학내 강의실 ※ 참여자 별도 안내 예정\n4. 대상 : 지역인재 7급 및 공직적격성검사(PSAT) 준비생 등 관심있는 누구나 ※선착순 20명 모집\n5. 내용 : PSAT 영역별(상황판단, 언어논리, 자료해석) 및 헌법 모의고사\n6. 신청 : 2026. 10. 26.(월) 13시까지 온라인(https://forms.gle/3tekPCdwCbBqoho98)신청", "attachments": [], "deadline": "2026-10-30", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "지역인재 7급 및 공직적격성검사(PSAT) 준비생 등 관심있는 누구나 ※선착순 20명 모집", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282182"}, {"seq": 282180, "cat": "volunteer", "title": "(육성)2026학년도 2차 JNU나눔실천봉사단 공모팀 선발 결과 안내", "author": "학생복지과(학생)", "date": "2026-10-21", "views": 2368, "pinned": false, "posted": "2026-10-21 12:14", "excerpt": "(육성)2026학년도 2차 JNU나눔실천봉사단 공모팀 선발 결과 안내\n2026학년도 2차 JNU나눔실천봉사단 공모팀 선발 결과를 다음과 같이 안내드립니다.\n1. 선발 결과\n▷ 선발팀: 총 14팀\n▷ 활동기간: 2026. 10. 1.(목) ~ 2027. 1. 29.(금)\n▷ 활동비 배정: 심사 결과 및 예산 여건을 고려하여 선발팀 전원 활동비 신청액 대비 80~90% 배정\n※ 배정금액은 회장 및 총무에게 포털 혹은 문자로 안내 발송\n▷ 결과(활동)보고 기한: 2027. 2. 5.(금)까지\n▷ 활동비 지급: 2027. 2. 12.(금) 이후\n※ 결과보고 보완 등 사유에 따라 활동비 지급 일정 변경 가능\n2. 선발팀\n연번\n팀명\n봉사영역\n1\nNurseMentoring\n노력\n2\n소나기\n교육, 의료, 노력\n3\n엔젤인널스\n교육, 의료\n4\nENCHANT\n노력, 환경\n5\n제주대봉우리\n노력\n6\n독일학과\n교육, 환경\n7\n참된 이치와 슬기\n교육\n8\n두드림\n노력\n9\nvet-erang\n동물의료, 노력\n10\n…", "attachments": [{"name": "2026학년도 2차 JNU나눔실천봉사단 회계교육용 자료.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=282180&no=1"}, {"name": "JNU나눔실천봉사단 증빙 양식.zip (403 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=282180&no=2"}], "deadline": "2027-02-05", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-2548 / http://pf.kakao.com/_XrTSX (카카오톡채널 …", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=282180"}, {"seq": 282179, "cat": "volunteer", "title": "(시립서울청소년센터)2026년 찾아가는 서울시 특수학급 예능발표회 및 청소년 어울림 한마당 자원봉사자 모집 안내", "author": "학생복지과(학생)", "date": "2026-10-21", "views": 2496, "pinned": false, "posted": "2026-10-21 12:12", "excerpt": "2026년 찾아가는 서울시 특수학급 예능발표회 및 청소년 어울림 한마당 자원봉사자 모집 안내\n1. 시립서울청소년센터에서는 서울시 내 특수학급 청소년을 대상으로 다양한 예술활동과 문화 체험의 기회를 제공하고, 자기표현 능력 향상 및 사회참여를 지원하기 위해「2026년 찾아가는 서울시 특수학급 예능발표회 및 청소년 어울림 한마당」을 개최하고자 합니다.\n2. 이에 행사 운영을 지원할 자원봉사자를 모집하오니, 청소년학과, 사회복지학과, 특수교육과, 교육학과 등 관련 학과 재학생들의 참여를 부탁드립니다.\n가. 활 동 명 : 찾아가는 서울시 특수학급 예능발표회 및 청소년 어울림 한마당\n나. 활동일시 : 2026. 11. 3.(화) ~ 11. 5.(목)\n- 사전 준비 및 부스 설치: 11. 3.(화) 또는 11. 4.(수) 중 1일 선택 참여 가능\n- 본행사 운영: 11. 5.(목) 필수 참여\n다. 활동장소 : 시립성동청소년센터 1층 무지개극장 및 행사장 일대\n라. 모집대상 : 청소년·사회복지·…", "attachments": [{"name": "2026년 찾아가는 서울시 특수학급 예능발표회 및 청소년 어울림 한마당 자원봉사자 모집 안내문.png (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=282179&no=1"}], "deadline": null, "org": "시립서울청소년센터", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "청소년·사회복지·특수교육·교육 관련 학과 대학생 및 봉사활동 실적 인정 또는 활동비 지원이 필요한 대학생", "benefit": "자원봉사활동 실적 인정 또는 관련 규정에 따른 활동비 지급 등", "how": "네이버폼 신청서 작성 및 제출(https://naver.me/5394nhun)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=282179"}, {"seq": 282163, "cat": "scholarship", "title": "2026년도 인산란심 청운재단 장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-10-20", "views": 3250, "pinned": false, "posted": "2026-10-20 17:55", "excerpt": "[재단법인 인산란심 청운재단]에서 아래와 같이 2026년도 장학생을 선발한다고 하오니, 신청을 희망하는 학생은 기한내에 신청 바랍니다.\n1. 선발인원(제주대->재단) : 2명(학과(전공)별 1명 이내 추천)\n2. 장학금 : 1인당 금1,500,000원(1회 지원, 타 장학금 중복수혜 불가)\n3. 지원자격(모두 충족)\n가. '26-2학기 다른 장학금을 받지 않는 학부 재학생(휴학생, 수업연한초과자 제외)\n※ 국가장학(외부재단 포함) 혹은 교내장학으로 등록금 범위 전액 수혜자는 신청 불가(단, 등록금 범위내 일부만 수혜받은 학생은 신청 가능)\n나. 직전학기 2.7점(4.3만점) 및 12학점 이상 이수한 학생\n4. 제출서류 : 장학금 수혜지원서, 추천서, 성적증명서, 주민등록등본, 학부모의 지방세 세목별 과세증명서, '26년도 2학기 학자금 지원구간 통지서\n5. 제출처 및 제출기한 : 학과(전공)사무실 / 2026. 10. 27.(화) 14시까지 학과에서 학생복지과로 추천 완료되어야 함(…", "attachments": [{"name": "[인산란심청운재단] 장학금 수혜지원서 및 추천서(서식).hwp (26 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282163&no=1"}, {"name": "개인정보 수집이용동의서(학교용).hwp (44 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282163&no=2"}], "deadline": "2027-02-07", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282163"}, {"seq": 282145, "cat": "general", "title": "[중앙도서관] (BK21)2026 논문작성 지원을 위한 전지적 논문시점 프로그램 신청 안내: 10.13.(화)~10.23.(금)_수정", "author": "중앙도서관(학술정보운영실)", "date": "2026-10-20", "views": 2940, "pinned": false, "posted": "2026-10-20 13:52", "excerpt": "", "attachments": [], "deadline": "2026-10-23", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282145"}, {"seq": 282109, "cat": "scholarship", "title": "[한국지도자육성장학재단] 2027년 한국지도자육성재단 신규 장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-10-19", "views": 3640, "pinned": false, "posted": "2026-10-19 16:31", "excerpt": "[한국지도자육성장학재단] 에서 2027학년도 장학생을 아래와 같이 선발하오니, 신청을 희망하는 학생은 기한내에 신청 바랍니다.\n1. 추천 인원(제주대→재단) : 1명(학과(전공)별 1명 이내 추천)\n2. 장학금액\n장학금 유형\n지원금\n지원 성격\n지원 기간\n1) 등록금 지원\n등록금 전액\n등록금성으로, 타 장학금 중복지원 불가\n최대 2년(정규 4개 학기)\n※ 정규학기를 초과한 학기는 지원하지 않으며, 학적변동 시 지급 종료\n2) 학업지원금 지원\n학기당 350만원\n생활비성으로, 타 장학금 중복지원 가능\n※ 두가지 유형 중 하나를 선택하여 지원(동시지원 및 지원 이후 유형변경 불가)\n3. 신청자격(아래의 4가지 조건을 모두 갖춘 자)\n가. 2027년도 1학기 기준, 3학년 1학기에 등록예정인 자\n나. 매 정규학기 당 최소 12학점 이상 이수한 자(계절학기 미인정)\n다. 전체학기 백분율 성적이 85점 이상인 자\n라. 학칙에 의한 징계사실(학사징계 포함)이 없는 자\n4. 제출서류 : 지원서, 추…", "attachments": [{"name": "제출서류 양식.zip (237 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282109&no=1"}], "deadline": "2026-10-30", "org": null, "opp": {"category": "장학", "grades": [3], "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282109"}, {"seq": 282108, "cat": "scholarship", "title": "[엔지니어링인재육성재단] 2027년도 제2기 장학생 선발 공고", "author": "학생복지과(장학)", "date": "2026-10-19", "views": 3218, "pinned": false, "posted": "2026-10-19 16:25", "excerpt": "[엔지니어링 인재육성재단] 에서 아래와 같이 2027년 제 2기 장학생을 선발한다고 하오니, 신청을 희망하는 학생은 기한내에 신청하기 바랍니다.\n1. 선발규모\n1) 모집인원 : 총 50명\n2) 장학금액 : 1인당 연간 금500만원(학습보조비 / 타 장학금과 중복수혜 가능)\n2. 신청자격\n1) 국내 4년제 대학교의 엔지니어링 및 에너지 관련 학과에 3학기 이상 재학 중인 자\n2) 최근 이수학기 및 전체학기 평균평점이 각각 3.0/4.5 이상인 자\n3) 최근 이수학기 이수학점이 12학점 이상인 자\n4) 추천서(학과장, 학부장, 지도교수 등) 제출자\n5) 선발일 기준 대한민국 국적 보유자\n※ 장학금 수혜기간(2027년도) 중 정규학기 정상 이수 예정자\n3. 신청방법 : 재단 이메일로 구비서류 제출(학생이 직접 재단에 개별신청 / 구글폼 작성 필수)\n4. 심사 일정, 제출서류 등 자세한 사항은 붙임 공고문을 참고하기 바랍니다.\n붙임 장학생 선발 공고문 1부. 끝.", "attachments": [{"name": "[엔지니어링인재육성재단] 제2기(2027년도) 장학생 선발 공고.pdf (171 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282108&no=1"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": "1인당 연간 금500만원(학습보조비 / 타 장학금과 중복수혜 가능)", "how": "재단 이메일로 구비서류 제출(학생이 직접 재단에 개별신청 / 구글폼 작성 필수)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282108"}, {"seq": 282106, "cat": "event", "title": "제2회 인공지능 활용 우수사례 공모전 참가자 모집 안내", "author": "학생복지과(학생)", "date": "2026-10-19", "views": 3300, "pinned": false, "posted": "2026-10-19 15:11", "excerpt": "", "attachments": [{"name": "붙임2. 2026년 인공지능 활용 우수사례 공모전 시행 공고문.pdf (165 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=282106&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=282106"}, {"seq": 282105, "cat": "general", "title": "[마감] [IoT COSS] AIoT 국제전시회 연계 융합기술 탐방 프로그램 참가자 모집(~10/23)", "author": "사물인터넷 혁신융합대학사업 제주대사업단", "date": "2026-10-19", "views": 2937, "pinned": false, "posted": "2026-10-19 14:24", "excerpt": "사물인터넷 혁신융합대학사업단에서는 AIoT 분야의 최신 기술과 융합산업을 직접 보고 체험할 수 있는 「2026 AIoT 국제전시회 연계 융합기술 탐방 프로그램」 참가학생을 모집합니다.\nAI·IoT, 로보틱스, 스마트시티, 빅데이터 등 미래 기술에 관심 있는 학생들의 많은 참여 바랍니다.\n1. 모집 안내\n모집 대상: 사물인터넷 혁신융합대학사업단 융합전공 및 마이크로디그리 참여학생\n모집 인원: 선착순 20명 이내\n모집 기간: 2026년 10월 23일(금)까지\n탐방 일정: 2026년 11월 3일(화) ~ 11월 5일(목) 중 1일 선택\n탐방 장소: 서울 코엑스(COEX)\n2. 주요 프로그램\nAI·IoT 국제전시회 관람\n로보틱스·스마트시티·빅데이터 체험\n관련 세미나 및 콘퍼런스 참여\n3. 신청 방법\n①포스터 내 QR코드 스캔 후 신청서 다운로드\n②신청서 작성\n③이메일 제출: coss@jejunu.ac.kr\n※ 선착순 모집으로 조기 마감될 수 있습니다.\n4. 문의: 사물인터넷 혁신융합대학사업…", "attachments": [{"name": "2026 AIoT 국제전시회 연계 융합기술 탐방 프로그램 참가신청서 및 개인정보동의서.hwpx (38 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282105&no=1"}], "deadline": "2026-10-23", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "사물인터넷 혁신융합대학사업단 융합전공 및 마이크로디그리 참여학생", "benefit": null, "how": null, "contact": "사물인터넷 혁신융합대학사업단 064-754-4521", "always": false}, "closed": true, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282105"}, {"seq": 282104, "cat": "general", "title": "[IoT COSS] 2026학년도 사물인터넷 혁신융합대학 융복합 특강 신청자 모집", "author": "사물인터넷 혁신융합대학사업 제주대사업단", "date": "2026-10-19", "views": 2853, "pinned": false, "posted": "2026-10-19 14:11", "excerpt": "사물인터넷 분야의 최신 기술과 미래 산업에 관심 있는 분들을 위해 「2026학년도 사물인터넷 혁신융합대학 융복합 특강」을 운영합니다.\n컨소시엄 내 재학생 및 재직자라면 누구나 참여할 수 있으니, 관심 있는 분들의 많은 신청 바랍니다.\n📌 신청 안내\n신청 대상: 사물인터넷 분야에 관심 있는 재학생 및 재직자\n신청 기간: 회차별 특강 운영 2일 전까지\n신청 방법: 포스터 내 QR코드 및 안내된 신청 경로를 통해 신청\n📚 특강 일정\n[재학생 1회차] 10. 29.(목) 15:00~18:00 / 온라인 특강\nIoT와 Digital Twin, AI로 현실을 이해하는 기 "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282039"}, {"seq": 282025, "cat": "general", "title": "🌊 [해양수산과학기술진흥원] 2026년 찾아가는 진로상담 참여자 모집 안내", "author": "산학협력단", "date": "2026-10-15", "views": 3053, "pinned": false, "posted": "2026-10-15 13:40", "excerpt": "해양수산과학기술진흥원(KIMST)에서는 해양수산 분야 대학(원)생을 대상으로 「2026년 찾아가는 진로상담」을 개최합니다.\n해양수산 분야 주요 연구기관 및 공공기관 전문가와 직접 소통하고, 진로 및 취업에 관한 다양한 정보를 얻을 수 있는 기회이오니 관심 있는 학생들의 많은 참여 바랍니다. 😊\n📌 행사 개요\n일시: 2026. 11. 4.(수) 14:00~16:00\n장소: 대한상공회의소(서울) 중회의실 A\n대상: 해양수산 관련 학과 대학생 및 대학원생\n내용: 해양수산 분야 연구기관 및 공공기관 전문가와의 진로상담\n참여기관: 국립수산과학원, 한국해양과학기술원, 극지연구소, 선박해양플랜트연구소, 국립해양생물자원관, 해양환경공단 등\n📝 참가 신청 안내\n신청기한: 2026. 10. 19.(월) 18:00까지\n신청방법: 붙임 홍보 포스터 내 QR코드를 통한 사전 등록\n✨ 해양수산 분야 진로를 고민하고 있거나 관련 연구기관 취업에 관심 있는 학생들에게 유익한 기회가 될 예정이오니 많은 관심과 참…", "attachments": [{"name": "홍보 포스터.png (297 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282025&no=1"}], "deadline": "2026-10-19", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "해양수산 관련 학과 대학생 및 대학원생", "benefit": null, "how": "붙임 홍보 포스터 내 QR코드를 통한 사전 등록", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282025"}, {"seq": 282009, "cat": "general", "title": "2026년 『미래 환경변화 대응 공동연구』 2차 공모 안내", "author": "앵커사업단", "date": "2026-10-15", "views": 3054, "pinned": false, "posted": "2026-10-15 10:18", "excerpt": "제주대학교 앵커사업단 지역상생혁신팀에서는 제주의 미래를 전망하고 대안을 모색하는 『미래 환경변화 대응 공동연구』 2차 공모를 진행하오니, 많은 참여 부탁드립니다.\n1. 사업개요\n가. 사업명: 미래 환경변화 대응 지역가치 추구형 공동연구\n나. 사업기간: 2026년 11월 ~ 2027년 1월\n다. 지원대상: 제주대학교 교원 2인과 도의원 및 지역공동체 대표 1인 이상으로 구성된 연구팀\n라. 운영내용\n- 도의원, 지역 공동체 대표, 대학 교원을 매칭하여 지역현안을 발굴하고 이를 해결할 연구 방안 강구\n- 제주의 미래 환경변화에 따른 지역현안을 발굴하고 해결 방안을 도출하여 정책(조례, 기본계획, 시행계획) 제안\n마. 선정공모수: 2건\n바. 지원금액\n- 고도화과제: 3,000만원 이내 지원 (1차년도 ‘미래 환경 변화 대응 지역가치 추구형 공동연구’ 참여 과제 대상)\n- 신규과제: 2,000만원 이내 지원\n※ 과제별 연구개발비는 심사 결과에 따라 조정될 수 있으며, 고도화 과제 중 선정 기…", "attachments": [{"name": "(외부용)미래 환경변화 대응 공동연구 2차 공모 계획(안)_261014.hwp (220 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282009&no=1"}, {"name": "최종결과보고 자료.Zip (212 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=282009&no=2"}], "deadline": "2026-10-22", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 교원 2인과 도의원 및 지역공동체 대표 1인 이상으로 구성된 연구팀", "benefit": null, "how": "코러스 공문접수 ※ 붙임 1의 [첨부1~첨부4]’ 한글파일 첨부 필수", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=282009"}, {"seq": 282008, "cat": "scholarship", "title": "2026년도 2학기 명인다문화장학재단 장학생 모집 안내", "author": "학생복지과(장학)학", "date": "2026-10-15", "views": 3554, "pinned": false, "posted": "2026-10-15 10:12", "excerpt": "재단법인 명인다문화장학재단에서 아래와 같이 2026년도 2학기 대학 장학생을 선발하오니, 대상자들이 많이 신청할 수 있도록 소속 학생들에게 널리 알려주시기 바랍니다.\n1. 지원자격\n가. 국내 대학교 재학 중인 1~3학년 다문화가정 자녀\n나. 2026년 기준 중위소득 100% 이하 다문화가정 자녀\n※ 지원 제외 대상: ①2026년 2학기 현재 휴학 중인 학생, ②2026년 2학기가 복학/입학/편입 첫 학기인 학생, ③2026년 2학기가 졸업 전 마지막 학기인 학생\n2. 신청기간 : ~ 2026. 10. 30.(금)까지\n3. 신청방법 : 우편접수만 가능(마감일 도착분에 한함)\n※ 주소: (06653) 서울특별시 서초구 효령로 267, 명인타워 9층 명인다문화장학재단\n4. 선발방법 : 붙임참조\n5. 문 의 처 : 명인다문화장학재단 ☎ 02-3465-8955\n붙임 1. 2026년도 2학기 명인다문화장학재단 대학 장학생 모집 공고문 1부.\n2. 장학생 신청서 및 제출서류 서식 1부. 끝", "attachments": [{"name": "00_대학 장학생 선발안내.pdf (58 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282008&no=1"}, {"name": "01_장학금 신청서.hwp (70 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282008&no=2"}, {"name": "02_개인정보 제공 동의서.hwp (47 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=282008&no=3"}], "deadline": "2026-10-30", "org": null, "opp": {"category": "장학", "grades": [1, 2, 3], "colleges": "전체", "who": null, "benefit": null, "how": "우편접수만 가능(마감일 도착분에 한함)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=282008"}, {"seq": 281998, "cat": "scholarship", "title": "[두산연강재단] 2027년도 두산연강재단 장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-10-14", "views": 3458, "pinned": false, "posted": "2026-10-14 17:50", "excerpt": "[재단법인 두산연강재단] 에서는 아래와 같이 2027년도 두산연강재단 장학생을 선발한다고 하오니, 관심있는 학생들의 많은 지원 바랍니다.\n1. 선발인원 : 00명\n2. 지원자격(아래 항목 모두 해당하는 자에 한함)\n가. 국내 대학교 중 4년제 학과 소속 학부생\n나. 2027년 3월(1학기) 기준 2학년 1학기 진학 예정자\n다. 선발 후 2027년 1학기, 2학기 모두 재학이 가능한 자\n라. 전체 학기 성적 평점 평균이 3.0/4.5 이상인 자\n※ 공고일 현재 1학년 2학기에 재학 중인 경우에는 1학년 1학기 성적으로 지원\n마. 한국장학재단 학자금지원구간(2026-2학기 기준) 6구간 이내인 자\n※ 군복무, 휴학 등으로 2026년 2학기 소득분위가 없을 경우 대체 서류 제출 가능\n바. 수여식 등 재단에서 주최하는 행사에 참석이 가능한 자\n※ 2027년 2월 22일(월) 예정인 장학증서 수여식에 불참 시 장학생 선발 취소\n3. 장학금 : 졸업 시까지 학기당 학업장려금(생활비성 장학금) …", "attachments": [{"name": "2027년도 두산연강재단 장학생 선발 공고문.pdf (155 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281998&no=1"}, {"name": "자주 묻는 질문(Q&A).pdf (237 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281998&no=2"}, {"name": "추천서(재단 양식).docx (121 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281998&no=3"}], "deadline": "2026-11-13", "org": null, "opp": {"category": "장학", "grades": [1, 2], "colleges": "전체", "who": null, "benefit": null, "how": "학생이 직접 재단 홈페이지 신청(http://www.yonkang.org/kr)", "contact": "두산연강재단 장학담당(02-708-5514) 평일 오전 10시~오후 5시", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=281998"}, {"seq": 281994, "cat": "general", "title": "2026학년도 제6회 모의토익 실시(10/30,금) 안내", "author": "국제교류처", "date": "2026-10-14", "views": 3357, "pinned": false, "posted": "2026-10-14 17:30", "excerpt": "2026년 제6회 모의토익 실시 안내\n국제교류처 언어교육원에서는 영어에 대한 관심을 일깨우고, 학생들의 영어실력을 확인함과 동시에 정규토익에서 긍정적인 성취감을 주기 위하여 다음과 같이 2026학년도 제6회 모의토익을 실시하고자 하오니 재학생 여러분의 많은 참가바랍니다.\n□시험일시 : 2026년 10월 30일(금) 오전 9시 20분 ~ 11시 30분\n- 9시 10분까지 입실/ 9시 20분 부터 입실 불가\n□시험장소 : 제주대학교 언어교육원(시험 전날 문자안내 및 당일 강의실 현관 입구 접수번호 확인 후 입실)\n□응시인원 : 100명(선착순)\n1) 대상: 재학생, 휴학생, 대학원생, 수료생 가능\n2) 그 외 일반인의 경우 여석 있을 시 가능\n□접수기간: 2026. 10. 21.(수) 09:00 ~ 10. 29.(목) 14:00\n□환불신청기간: ~ 10. 28.(수) 까지 (환불액은 모의토익 당일 기준으로 약 1~2주일 후 환불됩니다)\n□접수장소 : 제주대학교 포털 (인터넷 접수) - …", "attachments": [{"name": "2026_제6회 모의토익 시험 안내.hwp (101 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281994&no=1"}], "deadline": "2026-10-29", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "재학생, 휴학생, 대학원생, 수료생 가능", "benefit": null, "how": null, "contact": "064-754-2292", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281994"}, {"seq": 281993, "cat": "scholarship", "title": "2026학년도 발전기금 덕산문화재단 장학생 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-10-14", "views": 3285, "pinned": false, "posted": "2026-10-14 17:24", "excerpt": "2026학년도 발전기금 덕산문화재단 장학생 선발계획을 붙임과 같이 알려드리니, 해당학생은 기한 내 소속 학과(전공)로 신청하여 주시기 바랍니다.\n1. 선발인원: 8명\n2. 장학생 추천 기준 및 제출서류: 붙임1 참조\n3. 장학금액: 1인당 2,000,000원\n4. 기타사항: 모든 제출 서류는 접수마감일로 부터 3개월 이내 발급한 서류로 제출하며, 주민번호 뒷자리는 \"*\"처리하여 제출할것\n※2026. 10. 21.(수)까지 학과→학생복지과로 공문 추천 완료되어야함\n※학과마다 신청서 접수 기간은 상이할 수 있으니, 신청서 제출 기한은 각 학과로 문의바람\n자세한 선발기준 등은 반드시 붙임 선발계획 확인바랍니다.", "attachments": [{"name": "2026학년도 발전기금 덕산문화재단 장학생 선발계획(안).hwp (147 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281993&no=1"}, {"name": "덕산문화재단 장학생 신청서(서식).hwp (59 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281993&no=2"}], "deadline": "2026-10-21", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "w gory=323&act=view&seq=281843"}, {"seq": 281836, "cat": "general", "title": "2026학년도 살기좋은 지역사회 협의체 (추가 공모)", "author": "앵커사업단", "date": "2026-10-09", "views": 4430, "pinned": false, "posted": "2026-10-09 10:59", "excerpt": "2026학년도 살기좋은 지역사회 협의체 (추가 공모)\n1. 지원대상: 지역공동체 실무자 + 지역주민 + 대학, 기업, 지자체, 연구기관 실무자 등\n※ 제주대학 교원 필수 참여\n※ 협의체 총 구성원 5명 이상 필수\n2. 지원주제: 지역현안 영역 (① 지역 경제 ②지역 불균형 ③인구문제 ④기후위기)\n3. 신청기간: ~ 2026. 10. 15.(목) 15시\n4. 신청방법: 제대로산학1번지 홈페이지(https://jedaero.jejunu.ac.kr) 온라인 신청\n※ 온라인 신청: 프로그램 공고 →2026 살기좋은 지역사회 협의체(추가공모)→ 프로그램 신청 → 온라인 신청서 작성 및 운영계획서(한글) 첨부\n5. 지원규모: 협의체 1개 추가 모집 / 협의체 당 2백만원 이내 지원 (4개 내외 협의회 선정)\n※ 지원 항목: 회의비, 전문가 활용비, 사무용품 구입비 지원\n6. 사업기간: 2026. 10. ~ 2027. 1.\n※ 예산집행은 26.12.31.까지 완료\n7. 필수사항\n- 협의체 운영 …", "attachments": [{"name": "살기좋은 지역사회 협의체 추가 공모 계획(안)_외부발송용.hwp (86 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281836&no=1"}], "deadline": "2026-10-15", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "지역공동체 실무자 + 지역주민 + 대학, 기업, 지자체, 연구기관 실무자 등", "benefit": null, "how": "제대로산학1번지 홈페이지(https://jedaero.jejunu.ac.kr) 온라인 신청", "contact": "앵커사업단 지역상생혁신팀 064-754-4568", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281836"}, {"seq": 281829, "cat": "general", "title": "2026 NH농협은행 취업 아카데미 참여자 모집(~10. 22. 14시까지)", "author": "현장실습지원센터", "date": "2026-10-08", "views": 4285, "pinned": false, "posted": "2026-10-08 17:02", "excerpt": "금융권 취업을 준비한다면? NH농협은행 취업아카데미 🏦\n금융 분야의 업무와 직무부터 은행 현직자의 생생한 이야기까지! NH농협은행에 대해 알아보고 진로와 취업을 준비해 보세요.\n제주대학교 재학생·졸업생이라면 누구나 신청할 수 있습니다 😊\n📅 운영기간\n[1~4주] 2026. 10. 30.(금) ~ 11. 20.(금), 매주 금요일(총 4회)\n[5주차] 2026. 11. 23.(월) ~ 11. 27.(금) 기간 내 취업지원관 1:1 상담 (1회 필수)\n⌚ 운영시간 : 매주 금요일 14:00 ~ 16:00\n📍 운영장소 : 제주대학교 교양강의동 4226\n💡 주요내용\n- 금융 분야 및 NH농협은행, 농협경제지주 이해 및 특강\n- 선배와의 대화 및 현직자 멘토링\n- 취업지원관 1:1 상담 (자기소개서 작성 및 면접 컨설팅)\n※ 과정별 세부 교육내용 및 일정은 운영 상황에 따라 변경될 수 있습니다.\n🏆 수 load&category=203&seq=281814&no=2"}], "deadline": "2026-11-11", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": "총장상 및 총 상금 280만 원(대상: 1팀×100만 원, 우수상: 3팀×60만 원)", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281814"}, {"seq": 281794, "cat": "general", "title": "2026년 제주시 취업준비 청년 국내기업 탐방 프로그램 참여자 모집", "author": "대학일자리플러스센터", "date": "2026-10-08", "views": 5626, "pinned": false, "posted": "2026-10-08 10:20", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281794"}, {"seq": 281781, "cat": "volunteer", "title": "[재안내](제주시자원봉사센터) 2026 자원봉사 만남축제 '오늘 우리 만나요' 운영 자원봉사자 모집", "author": "학생복지과(학생)", "date": "2026-10-07", "views": 3949, "pinned": false, "posted": "2026-10-07 17:06", "excerpt": "(제주시자원봉사센터) 2026 자원봉사 만남축제 '오늘 우리 만나요' 운영 자원봉사자 모집\n10월 31일 '자원봉사 만남축제' 행사를 운영합니다.\nㅁ 본문 내용\n-행사명: 2026 자원봉사 만남축제 \"오늘 우리 만나요\"\n- 일시: 2026. 10. 31.(토) 11:00 ~ 16:00\n- 장소: 제주시평생학습관 운동장 및 제주시 일대\n- 참여자: 가족, 형제, 친구, 직장동료, 동아리 등 누구나\n- 운영내용: 만남주간, 체험존, 봉사수다(지역 봉사활동 팀 모집 중), 어울림 난장, 친환경 실천, 점심 국수 제공\n- 문의: 064-728-7527\n* 2026 자원봉사 만남축제 운여에 따라서 자원봉사자를 모집하고 있습니다.\n신청방법: 1365자원봉사포털(1365.go.kr)에서 [만남축제]를 검색하고, 신청해보세요!", "attachments": [{"name": "[만남축제] 운영지원자원봉사자 모집.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281781&no=1"}, {"name": "[만남축제] 자원봉사 스토리텔링 길투어 모집.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281781&no=2"}, {"name": "[만남축제]김장나눔 봉사자 모집.jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=281781&no=3"}], "deadline": null, "org": "제주시자원봉사센터", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "1365자원봉사포털(1365.go.kr)에서 [만남축제]를 검색하고, 신청해보세요!", "contact": "064-728-7527", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=281781"}, {"seq": 281761, "cat": "general", "title": "【교수학습지원센터】 2026학년도 2학기 「학습공동체」참여자 모집 안내 (~10/15)", "author": "교수학습지원센터", "date": "2026-10-07", "views": 5482, "pinned": false, "posted": "2026-10-07 14:29", "excerpt": "제주대학교 교수학습지원센터에서는\n재학생의 자기주도적 학습역량 강화와 협력학습 활성화를 위해\n2026학년도 2학기 「학습공동체」 참가자를 모집합니다.\n교과목을 기반으로 공동의 학습목표를 설정하고 함께 배우고 성장하고 싶은 학생 여러분의\n많은 관심과 참여, 홍보 부탁드립니다 :)\n──────────────────\n2026학년도 2학기 [학습공동체] 함께해요 :)\n──────────────────\n혼자 하는 공부에서, 함께 성장하는 학습으로!\n같이 공부하면, 배움의 깊이가 달라집니다.\n교과목을 기반으로 공동의 학습목표를 세우고,\n함께 공부하며 우리만의 학습성과를 만들어보세요!\n전공부터 교양, 일반선택까지!\n교과목을 기반으로 함께 배우고 성장하고 싶은 재학생이라면 누구나 학습공동체에 참여할 수 있습니다.\n제주대학교 교수학습지원센터가 여러분의 '함께 배우고 성장하는 학습 과정'을 지원합니다.\n──────────────────\n＃ 모집대상 : 2026학년도 2학기 개설 교과목을 기반으로 공동의…", "attachments": [{"name": "(붙임)2026학년도 2학기 학습공동체 세부 운영 기준 및 제출서류.hwp (148 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281761&no=1"}], "deadline": "2026-10-15", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "2026학년도 2학기 개설 교과목을 기반으로 공동의 학습목표를 설정한 우리 대학 재학생 4~6명으로 구성된 학습공동체", "benefit": null, "how": "온라인 신청", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281761"}, {"seq": 281749, "cat": "general", "title": "2027학년도 제1학기 해외파견 교류수학생(5차) 선발 안내", "author": "국제교류과", "date": "2026-10-07", "views": 4041, "pinned": false, "posted": "2026-10-07 13:16", "excerpt": "국제교류처에서 2027학년도 제1학기 해외파견 교류수학생(5차)을 아래와 같이 선발하고자 하오니\n지원을 희망하는 학생은 붙임의 공고문[붙임 파일] 및 세부 정보를 숙지하여 소속 학과 사무실로\n지원서를 제출 바랍니다.\n※해외파견 교류수학 자주하는 질문(국제교류처 홈페이지)\nhttps://cms.jejunu.ac.kr/intl/community/qna4.htm\n1. (5차)파견 예정 대학 및 선발 인원: 6개국 12개 대학 24명 내외(SAF포함) ※[붙임 2] 대학 정보 참조\n※ 2027학년도 1학기 해외파견 교류수학 프로그램(6차) 일정: 10월 중순(6차 대학 리스트 미정)\n2. 선발 기준\n- 선발 1순위 대상자 : 수업연한 미초과자*, 해외파견 교류수학 경험이 없는 자(온라인 파견 제외)\n* 수업연한 초과자, 학업연장자 및 대학원생의 경우 대학 지원금 지급 불가\n- 1~2지망 대학을 기준으로 어학 성적 기준을 모두 충족하는 자\n- 어학 기준 충족 인원이 선발 인원 초과 시 학업 …", "attachments": [{"name": "[붙임1] 2027-1학기 해외파견 교류수학 프로그램 5차 선발 공고.pdf (242 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281749&no=1"}, {"name": "2027-1학기 교류수학 선발 대학 세부정보(5차).xlsx (74 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281749&no=2"}, {"name": "[붙임3] (서식) 2027-1학기 해외파견 교류수학 프로그램 5차 지원서.hwp (89 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281749&no=3"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "국제교류과 064)754-2198 / intl3@jejunu.ac.kr", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281749"}, {"seq": 281743, "cat": "event", "title": "「제13회 대학생 물환경 정책·기술 공모전」 개최 안내", "author": "학생복지과(학생)", "date": "2026-10-07", "views": 4028, "pinned": false, "posted": "2026-10-07 11:08", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281743"}, {"seq": 281742, "cat": "event", "title": "2027 전국 대학생 자작 미래자동차 경진대회 개최 안내", "author": "학생복지과(학생)", "date": "2026-10-07", "views": 3892, "pinned": false, "posted": "2026-10-07 11:08", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=281742"}, {"seq": 281734, "cat": "scholarship", "title": "2026학년도 2학기 가족장학생(학부 및 대학원생) 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-10-07", "views": 5267, "pinned": false, "posted": "2026-10-07 10:22", "excerpt": "2026학년도 2학기 가족장학생(학부 및 대학원) 선발계획을 아래와 같이 안내드리니,\n해당자는 기한 내에 소속 학과(가족 중 대표 1인이 소속된 학과에만 신청)로 신청하여 주시기 바랍니다.\n※ 2026. 11. 6.(금)까지 학과에서 학생복지과로 공문 추천 완료되어야 함\n※ 학과마다 신청서 접수기간은 상이할 수 있으니, 신청서 제출 기한은 각 학과로 문의 바람\n1. 신청서 접수처 : 학과(전공)사무실\n2. 제출서류\n가. 신청서\n나. 가족관계증명서 또는 주민등록등본(주민번호 뒷자리 \"*\"처리)\n※ 가족 중 대표 1명이 소속 학과에만 제출, 신청서에 가족 재학생 전원의 자필 서명 필수\n※ 주민등록등본으로 제출할 경우에는 등본으로 가족관계 증명 가능해야 함.\n3. 선발대상: 2026학년도 2학기 현재 학부 및 대학원에 재학하고 있는 가족이 2인 이상인 학생\n※ 휴학생 및 수업연한초과자는 가족 인원수에 포함 안 함\n4. 장학생 선발 기준(등록금 초과 수혜 불가)\n가. 2026-2학기 등록금…", "attachments": [{"name": "2026학년도 2학기 가족장학생(학부 및 대학원생) 선발계획.hwp (91 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281734&no=1"}, {"name": "2026학년도 2학기(학부 및 대학원) 가족장학생 신청서.hwp (156 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=281734&no=2"}], "deadline": "2026-11-06", "org": null, "opp": {"category": "장학", "grades": [1, 3], "colleges": "전체", "who": "2026학년도 2학기 현재 학부 및 대학원에 재학하고 있는 가족이 2인 이상인 학생", "benefit": null, "how": null, "contact": "학생복지과 장학팀(064-754-2051)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=281734"}, {"seq": 281730, "cat": "event", "title": "2026 원도심 야간여행 섬야시즌 축제", "author": "제주대학교", "date": "2026-10-07", "views": 4930, "pinned": false, "posted": "2026-10-07 09:52", "excerpt": "", "attachments": [{"name": "2026 원도심 야간여행 섬夜시즌 운영.hwp (3 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200 /noticesurvey/outEvent.htm?act=download&category=323&seq=281713&no=2"}], "deadline": "2027-02-28", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": true, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=281713"}, {"seq": 281682, "cat": "general", "title": "[수강료 0원 + 수료생 전원 100만원 지급] 제주대학교 제주 콘텐츠 AI 부트캠프 교육생 모집", "author": "제주콘텐츠AX사업단", "date": "2026-10-06", "views": 4507, "pinned": false, "posted": "2026-10-06 14:22", "excerpt": "취업으로 이어지는 실무 AI 교육\n제주 콘텐츠 AI 부트캠프 교육생 모집\n[수강료 0원+수료생 전원 100만원 지급]\n*내일배움카드 없이 수강 가능!\n*국민취업지원제도 60만원 추가 수령 가능\n8일 만에 완성하는 실무 중심 인재 양성 과정\n기업이 원하는 AI 실무 인재 양성\n수강 전: 코딩이 막막한 비전공자, 이력서에 쓸 만한 실무 프로젝트 경험 부족\n수강 후: 생성형 AI 기반 웹·앱 기획/개발 역량 확보, 실제 기업 연계 해커톤 참여, 1:1 맞춤형 취업 포트폴리오 완성\n[√]포트폴리오가 없어 콘텐츠·마케팅·기획 직무 지원을 망설이는 분\n[√]생성형 AI 툴을 실무 서비스 제작에 제대로 써먹고 싶은 분\n[√]기업 연계 실무 경험과 전문가 포트폴리오 컨설팅을 받고 싶은 분\n교육으로 끝나지 않는 AI 실전 교육\n○ (초·중급-1기) 제주 IP 초중급 AX 기반 과정 (122H | 온라인 60H + 오프라인 62H):\n온라인: 10. 19.(월) ~ 11. 4.(수) / 오프라인: 1…", "attachments": [{"name": "[포스터]제주 콘텐츠 AI 부트캠프 교육생 모집.jpg (9 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=281682&no=1"}], "deadline": "2026-11-01", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "만 19세~34세 미취업 청년", "benefit": "수강료 전액 무료", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=281682"}, {"seq": 281681, "cat": "general", "title": "★ [1년 이상 장기휴학생·졸업유예생·졸업생 주목] 제주 2주 몰입 AI 교육 + 최대 210만 원 수료장학금 지원", "author": "AI융합원", "date": "2026-10-06", "views": 4461, "pinned": false, "posted": "2026-10-06 14:12", "excerpt": "🔥 [장기휴학생·졸업유예생·졸업생만 신청 가능]\n제주 청년도약 구글 AI 부트캠프 참가자 모집\n제주대학교에서 만 19~34세 청년을 대상으로 Google AI 실무교육을 운영합니다.\n✅ 1년 이상 장기휴학생\n✅ 졸업유예생\n✅ 대학 졸업생\n✅ 고졸·자퇴·중퇴 청년\n✅ 사업자등록증 보유자도 휴업·사업 미영
