과정 편성교과목 평균평점이 3.3 이상인자 및 연계융합전공 과정 편성교과목 평균평점이 2.7 이상인자\n③ ①,②항의 조건을 충족한 자 중 사물인터넷기초 마이크로디그리과정 이수자·신청자(연계융합전공 이수자는 제외)\n④ 24년 2학기부터 이수한 교과목이 한 과목이라도…", "attachments": [{"name": "사물인터넷 혁신융합대학사업단 마이크로디그리 장학금 신청 안내.pdf (280 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279034&no=1"}, {"name": "장학금 신청서 및 개인정보수집이용동의서 서식.hwpx (54 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279034&no=2"}], "deadline": "2026-08-06", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "사물인터넷혁신융합대학사업 제주대사업단에서 개설한 마이크로디그리 교육과정 이수자(교육과정 내 편성 교과목 모두 이수완료 자) 및…", "benefit": null, "how": "제출 서류 파일 압축하여 하나의 파일로 메일 제출", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=279034"}, {"seq": 279007, "cat": "general", "title": "2026학년도 2학기 취업연계 국가근로장학사업 참여기업 모집 안내", "author": "현장실습지원센터센터", "date": "2026-07-31", "views": 8822, "pinned": false, "posted": "2026-07-31 09:47", "excerpt": "1. 기업신청기간 : ~ 8. 6. 18:00까지\n2. 기업 선발 결과 공지 : 2026. 8. 7. 18:00까지 / 신청서에 기재된 담당자 이메일로 결과 안내 메일 발송 예정\n** 학생 신청 : 2026. 8. 7. ~ 8. 14. ☞ 근로 시작 : 2026. 9. 1.\n3. 제출 서류 : 담당자 이메일 제출(munhee1014@jejunu.ac.kr)\n① 참여신청서(직인 날인 필수)\n② 국세 완납증명서(신청일 기준)\n③ 지방세 완납증명서(신청일 기준)\n④ 4대보험 완납증명서(신청일 기준)\n⑤ 사업자등록증 사본\n** 제출 서류 미비 시 자동 취소 처리 됩니다.(별도 연락 하지 않음)\n4. 행정사항\n① 신청 시 기재하는 ‘모집인원’은 수요조사를 위해 받는 것이며, 참여기업 수요에 따라 인원이 조정될 수 있습니다. 최종 선발 가능인원은 기업 선발 완료 후 확정됩니다.\n* 기업 선발은 신규 참여 여부, 채용 연계 가능성, 현장점검 시 지적 사항 발생 여부 등을 포함해 제주대학교 자체 …", "attachments": [{"name": "(기업용)2026.사업 공고문 및 지원신청서류(2학기).hwp (85 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=279007&no=1"}], "deadline": "2026-09-01", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https 8, "cat": "event", "title": "2026년 지역살이 프로그램 「워크스테이 in 안동」3기 참여자 모집 안내", "author": "학생복지과(학생)", "date": "2026-07-30", "views": 8365, "pinned": false, "posted": "2026-07-30 10:12", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278958"}, {"seq": 278931, "cat": "general", "title": "[7.30. 모집 중] 2026-2학기 학생생활관 입주학생(남학생) 추가 모집 안내", "author": "학생생활", "date": "2026-07-30", "views": 8928, "pinned": false, "posted": "2026-07-30 09:10", "excerpt": "1. 이번 모집은 2026학년도 2학기 입주자 결원에 따른 추가 모집이므로 모집인원이 적으며, 신청인원이 많을 경우 학생생활관 합격이 안될 수 있으니 이점 유의 바랍니다.\n2. 학생생활관 입주학생 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭!! 확인해 주세요.\n3. 신청은 되도록 PC나 노트북 등으로 해주시기 바라며, 스마트폰에서는 신청이 안될 수 있으니 이점 유의 바랍니다.\n그리고 인터넷 브라우저는 크롬이나 엣지를 활용해 주세요. 그 외 브라우저에서는 신청이 안될 수 있습니다.\n4. 입주 예정자(2학기 생활관비 납부자)가 입주호관 변경을 위해 새로 신청을 희망하는 경우\n포털시스템에서 입주포기 신청 후 학생생활관 행정실로 전화 바라며, 입주포기 처리가 완료 된 후 2학기 추가모집 신청이\n가능하니 이점 유의 바랍니다. 입주포기 처리는 행정실 근무시간 중에만 가능하니 모집 마지막 날(7. 23.)은 17:00까지 연락\n바랍니다. 그리고 제출서류도 안내한 바와 같이 모두 제출하셔야 …", "attachments": [{"name": "2026-2학기 학생생활관 입주학생(남학생) 추가 모집 안내(문).pdf (467 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278931&no=1"}], "deadline": "2026-08-22", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278931"}, {"seq": 278909, "cat": "event", "title": "[BK21] 5단계 BK21사업 추진 관련 소통 간담회 알림", "author": "대학원혁신실", "date": "2026-07-29", "views": 6946, "pinned": false, "posted": "2026-07-29 15:29", "excerpt": "5단계 BK21사업 추진과 관련하여 아래와 같이\n질의응답 중심의 소통 간담회를 개최하오니, 관심있는 학내 구성원들의 많은 참여 바랍니다.\n일시 및 장소 : 2026. 8. 4.(화) 대표하는 랜드마크로 자리잡았습니다.\n그리고 2027년, 새로운 도전 ‘9.81 인천공항'이 그 시작을 준비 중에 있습니다.\n9.81파크의 즐거움은 우연히 만들어지지 않습니다.\n콘텐츠와 공간을 즐기는 고객들의 동선 하나, 안전장치 하나까지 세심하게 설계되어 운영되고 있습니다.\nSA는 이 공간 안에서 고객의 즐거움을 함께하며, 동시에 아무도 눈치채지 못하게 공간과 안전을 지켜내는 운영의 핵심 크루입니다.\n제주에서 실무를 배우고 SA가 되어, 9.81인천공항의 오픈 멤버로서 새로운 랜드마크를 만들어 갈 인재를 채용합니다.\n고객의 특별한 하루, 즐거운 순간을 더 신나게 이끌면서도,\n기술로 연결된 공간과 서비스를 이해하고,\n그 이면에서 안전을 책임질 수 …", "attachments": [], "deadline": "2026-07-30", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278668"}, {"seq": 278664, "cat": "event", "title": "제3회 KRC AI 디지털 혁신 공모전 안내", "author": "학생복지과(학생)", "date": "2026-07-22", "views": 7716, "pinned": false, "posted": "2026-07-22 16:09", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278664"}, {"seq": 278661, "cat": "event", "title": "[경상국립대학교] 2026 GNU-SDGs/ESG 공모전 개최 안내", "author": "학생복지과(학생)", "date": "2026-07-22", "views": 6881, "pinned": false, "posted": "2026-07-22 14:02", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278661"}, {"seq": 278647, "cat": "general", "title": "제주대신문 수습기자, 특별기자 모집", "author": "신문방송출판부", "date": "2026-07-22", "views": 9297, "pinned": false, "posted": "2026-07-22 10:13", "excerpt": "제주대신문 수습기자·특별기자를 모집합니다.\n수습기자 부문과 대학원생(특별기자) 부문 모집이 함께 진행되오니 많은 관심과 참여 부탁드립니다.\n■ 모집 기간 / 모집 방법\n2026. 7. 22 ~ 7. 31\n• 1차 서 icesurvey/outEvent.htm?category=200&act=view&seq=278574"}, {"seq": 278571, "cat": "general", "title": "1:1 온라인 취업 컨설팅 (8월) 참여자 모집(20명 선착순)", "author": "대학일자리플러스센터", "date": "2026-07-21", "views": 9781, "pinned": false, "posted": "2026-07-21 09:31", "excerpt": "★ 구글폼 신청 URL: https://forms.gle/WfkHK9C1yevwg3wm8 ★\n①구글폼 신청과 ②첨부파일(한글 or PDF 중 택 1) 작성하여 이메일 제출까지 해야 신청이 완료됩니다.\n※ 제출처: ydkim5053@jejunu.ac.kr", "attachments": [{"name": "(졸업생_자필서명 필) 온라인 컨설팅_참여 신청서_성명.hwp (86 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278571&no=1"}, {"name": "(졸업생_자필서명 필) 온라인 컨설팅_참여 신청서_성명.pdf (156 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278571&no=2"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278571"}, {"seq": 278549, "cat": "general", "title": "[선착순 모집] SWEAT OUT 슬로우런 파일럿 프로그램", "author": "글로컬대학사업단", "date": "2026-07-20", "views": 8946, "pinned": false, "posted": "2026-07-20 18:00", "excerpt": "마음이 따라오지 않는 날, 몸부터 천천히 움직여보는 시간\n안녕하세요. 제주대학교 학생들의 일상 속 작은 행동과 마음건강을 연결하는 프로젝트팀 SWEAT OUT(스웻아웃)입니다.\n스웻아웃에서는 행동활성화 원리를 바탕으로, 가벼운 신체활동을 직접 시작하고 활동 전후 자신의 상태를 살펴보는 슬로우런 파일럿 프로그램을 진행합니다.\n이번 프로그램은 빠르게 달리거나 기록을 경쟁하는 러닝 모임이 아닙니다. 제주대학교 대운동장에서 간단한 오리엔테이션과 설문, 스트레칭을 진행한 뒤 권제오름을 천천히 걷고 가볍게 달릴 예정입니다.\n러닝 경험이 없어도 괜찮으며, 개인의 체력과 당일 컨디션에 따라 걷기만으로도 충분히 참여할 수 있습니다.\n[프로그램 안내]\n・ 일시: 2026년 7월 29일 오후 4시\n・ 집결 장소: 제주대학교 대운동장\n・ 활동 장소: 제주대학교 및 권제오름 일대\n・ 활동 내용: 오리엔테이션, 사전 설문, 웜업 스트레칭, 권제오름 슬로우 러닝, 쿨다운 스트레칭, 마무리 활동\n・ 예상 소요 …", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 재학생 10명", "benefit": "참여자 전원 SWEAT OUT 티셔츠 제공", "how": "포스터의 QR코드 및 아래 링크를 통해 구글폼 작성", "contact": "064) 754-3759", "alw ": [{"name": "(외부계획)제주의 미래를 생각하자 캠페인_260716.hwp (84 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278539&no=1"}, {"name": "붙임 2.zip (117 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278539&no=2"}], "deadline": "2026-07-28", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 교원 및 학생, 지역공동체대표 등으로 이루어진 팀", "benefit": null, "how": "지원기간 내 코러스 공문 접수", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278539"}, {"seq": 278538, "cat": "general", "title": "『2026년 지역현안 연구공동체』 공모 안내", "author": "RISE사업단", "date": "2026-07-20", "views": 8255, "pinned": false, "posted": "2026-07-20 15:17", "excerpt": "제주대학교 RISE사업단 지역상생혁신팀에서는 지역주민의 현장 경험과 수요 반영, 대학 교원의 전문성을 결합하여 지역현안을 연구하고 해결하는 『지역현안 연구공동체』 공모를 진행하오니, 많은 참여 부탁드립니다.\n1. 사업개요\n가. 사 업 명: 2026년 지역현안 연구공동체\n나. 사업기간: 2026년 7월 ~ 2027. 1. 31\n다. 지원대상: 제주대학교 교원 및 학생, 지역혁신기관, 지역공동체대표 등으로 이루어진 팀\n※ 도의원 참여시 가산점\n라. 운영내용: 지역공동체-교원 매칭을 통해 지역 현안 기반의 공동 연구 주제 발굴 및 실행가능한 정책 대안 제시\n마. 선정공모수/지원금액: 5건 / 과제당 1,500만원 이내 지원\n※ 연구주제에 맞는 공모 지원이 없으시 미선발하며, 평가 후 예산 조정 가능\n2. 신청방법\n가. 접수기한: ~ 2026. 7. 28.(화) 16시\n*접수기한 엄수 및 신청서 한글파일 업로드 주의\n나. 신청방법: 제대로산학1번지 홈페이지(https://jedaero.je…", "attachments": [{"name": "(외부계획)지역현안 연구공동체_260716.hwp (88 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278538&no=1"}, {"name": "붙임 2.zip (117 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278538&no=2"}], "deadline": "2026-07-28", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 교원 및 학생, 지역혁신기관, 지역공동체대표 등으로 이루어진 팀", "benefit": null, "how": "제대로산학1번지 홈페이지(https://jedaero.jejunu.ac.kr) 온라인 신청", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/notice e, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278403"}, {"seq": 278401, "cat": "general", "title": "2026년 언어교육원 7월 정기토익 대비 무료 특강", "author": "국제교류과", "date": "2026-07-15", "views": 9498, "pinned": false, "posted": "2026-07-15 18:00", "excerpt": "2026년 언어교육원 7월 정기토익 대비 무료 특강\n언어교육원 토익특별반에서는 7월에 시행되는 공인 어학성적의 고득점 달성을 목표로 학습하는 학생들을 위하여 7월 정기 토익 대비 특강을 진행합니다. 재학생이라면, 누구나 무료로 수강 가능한 특강이오니 정기 토익 시험을 준비하고 있는 재학생 여러분들의 많은 참여 바랍니다.\n■ 프로그램 세부사항\n1. 진행 프로그램 : 7월 정기토익 시험 대비 특강\n2. 특강 진행방식 : 줌 프로그램 활용 비대면 실시간 라이브\n3. 신청 기간 : 2026. 7. 16.(목) ~ 2026. 7. 23.(목) 15시 마감\n4. 특강 일정 : 2026. 7. 24.(금) 10시~12시 / 2시간 진행\n5. 프로그램 수강방법\n1) 구글폼 https://forms.gle/ccGG5k9PykmWo7ff9 접속하여 신청\n혹은 홍보물 QR코드 스캔 후, 구글폼 접속하여 신청\n2) 2026. 7. 23.(목) 17시 문자로 개별 발송된 줌 수업 링크로 접속하여 특강 참여…", "attachments": [], "deadline": "2026-07-23", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "언어교육원 (064-754-2347)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278401"}, {"seq": 278392, "cat": "general", "title": "[경영혁신지원실] 2026학년도 1학기 국가근로장학생 추가 선발 안내", "author": "경영혁신지원실", "date": "2026-07-15", "views": 9203, "pinned": false, "posted": "2026-07-15 16:50", "excerpt": "2026학년도 1학기 경영혁신지원실(말산업전문인력양성센터) 대체 국가근로장학생을 아래와 같이 모집하오니 많은 지원 바랍니다.\n* 근로기간 및 근로시간은 내부사정에 따라 변동될 수 있으며, 접수 인원이 많을 경우 조기마감 될 수 있습니다.\n1. 지원자격: '26학년도 1학기 한국장학재단 국가근로장학금 신청완료자 중 학자금 지원구간 9구간 이하 및 직전학기 성적 1.4/4.3(70점) 이상인 재학생(수업연한초과자 제외)\n2. 선발인원: 재학생 1명\n3. 근로내용: 경영혁신지원실 업무 보조\n4. 근로예정기간: 2026. 7. 22.(수) ~ 8. 31.(월)\n5. 접수기간: 2026. 7. 15.(수) ~ 7. 21.(화) 18:00까지, 방문 접수\n※ 접수기간 내에 선발인원 미달 시 수시 접수 및 선발\n6. 선발방법\n- 서류 제출 방문자 대상 담당자 직접 면접 실시\n. 필수지표(50점)-학자금 지원구간 / 자율지표1(30점)-성적 / 자율지표2(20점)-면접 / 가점 10점\n7. 선발안…", "attachments": [{"name": "(서식) 2026-1학기 국가근로장학 신청서.hwp (112 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download t": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=278325"}, {"seq": 278316, "cat": "general", "title": "【교수학습지원센터】 2026학년도 「리빙랩캠프 in 청주」참여자 모집 안내 (~7/23)", "author": "교수학습지원센터", "date": "2026-07-14", "views": 10928, "pinned": false, "posted": "2026-07-14 13:25", "excerpt": "제주대학교 교수학습지원센터에서는 「2026 리빙랩캠프 in 청주」 참가자를 모집합니다.\n지역사회 문제를 직접 발굴하고, 다른 대학 학생들과 함께 해결방안을 만들어가는 특별한 경험!\n많은 관심과 참여, 홍보 부탁드립니다 :)\n──────────────────\n[2026 리빙랩캠프 in 청주] 함께해요 :)\n──────────────────\n지역의 문제를 발견하고,\nSDGs(지속가능발전목표)와 연결하여\n창의적이고 실천 가능한 해결방안을 직접 만들어보세요!\n전북대학교, 국립군산대학교, 전주교육대학교 학생들과 함께하는\n연합 프로젝트형 캠프로 운영됩니다.\n──────────────────\n＃ 모집대상 : 제주대학교 학부 재학생\n- 지역사회 문제해결과 사회혁신 활동에 관심 있는 학생\n- 타 대학 학생들과 협업 프로젝트를 경험하고 싶은 학생\n＃ 모집인원 : 15명(개별 참여 신청만 가능)\n＃ 모집기간 : 공고일로부터 ~ 7. 23.(목)\n＃ 운영기간 : 2026. 8. 11.(화) ~ 8. 13…", "attachments": [{"name": "2026학년도 전북_제주지역 리빙랩 캠프 운영 안내.pdf (240 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278316&no=1"}, {"name": "2026학년도전북_제주 리빙랩 캠프 신청서.hwp (170 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278316&no=2"}], "deadline": "2026-07-23", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생", "benefit": null, "how": "신청서 작성 후, 공동교육혁신센터 홈페이지 제출", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278316"}, {"seq": 278311, "cat": "event", "title": "「2026 대구정원박람회」 학생 정원 작품 공모 안내", "author": "학생복지과(학생)", "date": "2026-07-14", "views": 8220, "pinned": false, "posted": "2026-07-14 11:21", "excerpt": "", "attachments": [{"name": "『2026 대구정원박람회』 학생정원 작품공모.pdf (179 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=278311&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278311"}, {"seq": 278305, "cat": "general", "title": "2026-2학기 학생생활관 입주학생 추가 모집 안내", "author": "학생생활", "date": "2026-07-14", "views": 10162, "pinned": false, "posted": "2026-07-14 09:28", "excerpt": "1. 이번 모집은 2026학년도 2학기 입주자 결원에 따른 추가 모집이므로 모집인원이 적으며, 신청인원이 많을 경우 학생생활관 합격이 안될 수 있으니 이점 유의 바랍니다.\n2. 학생생활관 입주학생 모집 및 신청에 대한 자세한 내용은 첨부파일을 꼭!! 확인해 주세요.\n3. 신청은 되도록 PC나 노트북 등으로 해주시기 바라며, 스마트폰에서는 신청이 안될 수 있으니 이점 유의 바랍니다.\n그리고 인터넷 브라우저는 크롬이나 엣지를 활용해 주세요. 그 외 브라우저에서는 신청이 안될 수 있습니다.\n4. 입주 예정자(2학기 생활관비 납부자)가 입주호관 변경을 위해 새로 신청을 희망하는 경우\n포털시스템에서 입주포기 신청 후 학생생활관 행정실로 전화 바라며, 입주포기 처리가 완료 된 후 2학기 추가모집 신청이\n가능하니 이점 유의 바랍니다. 입주포기 처리는 행정실 근무시간 중에만 가능하니 모집 마지막 날(7. 23.)은 17:00까지 연락\n바랍니다. 그리고 제출서류도 안내한 바와 같이 모두 제출하셔야 …", "attachments": [{"name": "2026-2학기 학생생활관 입주학생 추가 모집 안내(문).pdf (470 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278305&no=1"}], "deadline": "2026-08-22", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278305"}, {"seq": 278273, "cat": "general", "title": "취업연계 국가근로장학사업 1학기(4차) 학생 모집 안내", "author": "현장실습지원센터", "date": "2026-07-13", "views": 10777, "pinned": false, "posted": "2026-07-13 09:05", "excerpt": "※ PDF 파일이 아닌 1개의 한글파일 형태로 제출해주시기 바랍니다.\n※ 기업리스트 추가!!(확인필요)\n〇 신청방법(아래 두가지 모두 다 신청해야 함)\n- 한국장학재단 홈페이지(메뉴 → 장학금 → 장학금신청 → 신청서작성 → 국가근로장학금(상시)-취업연계중점대학 유형) 참가 신청 후\n※ 국가근로장학금(중소기업 취업연계장학금 아님)\n- 제주대학교 포털사이트 접속 후 경력관리-비교과 프로그램 → 신청 → 제목에 “취업연계” 검색 후 신청 → 구비 서류 이메일 제출(munhee1014@jejunu.ac.kr)\n※ 구비서류 : ①신청서 및 자기소개서(소속 단과대 취업지원관에게 컨설팅 받은 후 제출), ②성적증명서, ③자격증 및 어학능력시험 성적표(해당자만 제출), ④2026년 하기 계절수업시간표 ※ 서약서는 선발 후 제출\n※ 주의사항\n○ 제주대학교 포털사이트 신청 전 반드시 한국장학재단 홈페이지에서 \"국가근로장학금\" 신청 먼저 해주시기 바랍니다!\n○ 학업연장자도 참여 가능합니다. (휴학생,…", "attachments": [{"name": "(학생용)2026.사업 공고문 및 지원신청서류(4차).hwp (162 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278273&no=1"}, {"name": "2026학년도 1학기(4차) 취업연계 국가근로장학 신청기업 리스트.xlsx (22 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278273&no=2"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": true}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278273"}, {"seq": 278272, "cat": "scholarship", "title": "2026년 정읍시민장학재단 우수인재 장학금 장학생 선발 안내", "author": "대학본부", "date": "2026-07-13", "views": 7969, "pinned": false, "posted": "2026-07-13 09:01", "excerpt": "[재단법인 정읍시민장학재단] 에서 시행하는 2026년 장학생 선발계획을 아래와 같이 알려드립니다.\n1. 접수기간: '26. 7. 13.(월) ∼ 7. 27.(월) 18:00(토, 일 제외)\n2. 접수처: 정읍시 읍, 면, 동 주민센터(신청학생이 직접 방문 접수)\n3. 대상자: 공고일(7. 8.) 기준 정읍시에 1년 이상 주소를 두고 있는 부 또는 모의 자녀(재학생)\n4. 문 의: 정읍시민장학재단(063-539-5577)", "attachments": [{"name": "2026년 우수인재장학금 장학생 선발 공고.pdf (519 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=278272&no=1"}, {"name": "우수인재 장학금 지원서(서식).hwpx (63 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=278272&no=2"}], "deadline": "2026-07-27", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=278272"}, {"seq": 278244, "cat": "event", "title": "[기초과학 전문가 초청 대중강연] 내 안의 물고기를 찾아서(7/18)@제주문학관", "author": "기초과학연구소", "date": "2026-07-10", "views": 8954, "pinned": false, "posted": "2026-07-10 18:55", "excerpt": "제주대학교 기초과학연구소입니다.\n2026 기초과학 전문가 초청 대중강연을 아래와 같이 안내드립니다.\n인간의 몸에는 수억 년에 걸친 진화의 흔적이 담겨 있습니다.\n이번 북콘서트에서는 『내 안의 물고기』를 통해 인간과 생명의 연결성을 이해하고,\n과학과 문학이 만나는 흥미로운 이야기를 함께 나누고자 합니다.\n*주제: 내 안의 물고기를 찾아서\n*연사: 김종랑 회장(유망여성과학기술인네트워크), 최선미 박사(한의학연구원 책임연구원), 최윤정 교수(세종대학교 대양휴머니티칼리지)\n*일시: 2026. 7. 18.(토) 14:00 ~ 16:00\n*장소: 제주문학관(제주시 연북로 339)\n*대상: 관심 있는 누구나\n*참가 신청방법: 네이버 폼 QR코드 신청\n- 네이버 폼 : https://naver.me/xqbvKCUm\n(링크가 열리지 않을 경우, 링크 주소를 복사한 뒤 인터넷 주소창에 붙여넣어 접속해 주세요!)\n*문의: 064-754-8308(제주대학교 기초과학연구소)\n자세한 사항은 포스터를 참고해 …", "attachments": [{"name": "2026 기초과학 전문가 초청 대중강연 홍보 포스터 (2).png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=278244&no=1"}, {"name": "2026 대중강연 전체 일정 포스터.png (487 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=278244&no=2"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "관심 있는 누구나", "benefit": null, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278244"}, {"seq": 278231, "cat": "general", "title": "🖥️[RISE사업단] 「AI 전환의 시대, [ ]의 재정의」 성인학습자 특화 교육과정 수강생 🖥️", "author": "RISE사업단", "date": "2026-07-10", "views": 11209, "pinned": false, "posted": "2026-07-10 14:45", "excerpt": "RISE사업단(지역상생혁신팀)에서는 Claude배우는 계획서 작성, 업무자동화를 주제로 하는 성인학습자 특화 교육과정 \"AI 전환의 시대, [ ]의 재정의\" 프로그램을 운영하고 있습니다.\n아래의 내용을 참고하시고 많은 관심과 신청 부탁드립니다.\n□ 신청방법: https://naver.me/xaTxfAos", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "https://naver.me/xaTxfAos", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278231"}, {"seq": 278217, "cat": "scholarship", "title": "[제주4ㆍ3평화재단] 제12회 4ㆍ3장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-07-10", "views": 7769, "pinned": false, "posted": "2026-07-10 11:24", "excerpt": "[제주4ㆍ3평화재단] 에서는 4ㆍ3 희생자 및 유족의 후손 중 저소득 우수 학생들을 선발한다고 알려와 안내드립니다.\n신청을 희망하는 학생은 기한내에 신청바랍니다.\n1. 장 학 명 : 제12회 제주4ㆍ3평화재단 4ㆍ3장학생\n2. 장 학 금 : 금2,000,000원(생활비, 다른 장학금과 중복수혜 가능)\n3. 선발인원 : 11명\n4. 자격기준\n가. 4ㆍ3 희생자 및 유족의 후손 중 대학교 재학 중인 자\n나. 국내 대학교 재학생으로 '25년 2학기 12학점 이상 이수한 자(계절학기 제외)\n※ 다만, '26년 1학기 복학생은 휴학 직전학기 취득학점을 기준으로 함\n* 장학생 선발 시 제외 : '26년 1학기 신입생 및 휴학생, 신청일 기준 휴학생, 허위 서류 제출자\n5. 신청기간 : 2026. 7. 10.(금) ~ 7. 31.(금) 18:00까지\n6. 접수방법 : 학생이 직접 재단 방문 및 등기우편, 이메일 접수\n* 상세내역은 공고문 참고 바랍니다.\n붙임 제12회 제주4ㆍ3평화재단 선발계획 …", "attachments": [{"name": "【붙임 1】제12회 제주4·3평화재단 4·3장학생 선발 계획 공고문.hwp (60 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=278217&no=1"}, {"name": "【붙임 2】【붙임 3】_장학금신청서_ 개인정보동의서(서식).hwp (38 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=278217&no=2"}], "deadline": "2026-07-31", "org": null, "opp": {"category": "장학", "grades": [1], "colleges": "전체", "who": null, "benefit": null, "how": "학생이 직접 재단 방문 및 등기우편, 이메일 접수", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=278217"}, {"seq": 278193, "cat": "general", "title": "2026년 제주청년 갭이어프로그램 참여자 모집 안내", "author": "학생복지과(학생)", "date": "2026-07-09", "views": 11197, "pinned": false, "posted": "2026-07-09 16:51", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278193"}, {"seq": 278181, "cat": "event", "title": "국립광주과학관 2026 매스&사이언스 아트(Math&Science Art) 작품공모전 개최 안내", "author": "학생복지과(학생)", "date": "2026-07-09", " oad&category=323&seq=278111&no=1"}], "deadline": "2026-07-09", "org": "종합서비스센터", "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-3031(제주대학교 종합서비스센터)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=278111"}, {"seq": 278099, "cat": "volunteer", "title": "2026학년도 1학기 대학생 청소년 AI교육지원장학금 학생 멘토 모집 안내 공고", "author": "학생복지과(학생)", "date": "2026-07-07", "views": 10415, "pinned": false, "posted": "2026-07-07 17:10", "excerpt": "2026학년도 1학기 대학생 청소년 AI교육지원장학금 학생 멘토를 아래와 같이 모집합니다.\n자세한 사항은 붙임 자료를 참고하시기 바랍니다.\n★반드시 공고글을 끝까지 꼼꼼히 읽고 신청바랍니다★특히 신청 방법 및 주요 주의사항 필독!★\n가. 멘토 선발 개요\n- (멘토활동내용) 인공지능·소프트웨어(AI·SW) 역량을 갖춘 대학생이 희망하는 초·중·고등학교 학생들에게 관련 지식과 경험을 나눔으로써 전인적 성장을 지원 ※단, 활동기관 업무보조 및 단순 노무(청소, 빨래 등)의 활동은 불가\n- (최소활동조건) 선발 후 최소 10시간 이상 근로 조건(10시간 미만 근로 후 취소한 학생은 근로장학금 미지급)\n- (장학금 지급) 시간당 근로장학금 18,000원 *30분 단위 인정(시간당 급여 1/2)\n※ 단, 출발지와 활동기관 간 거리가 왕복 2시간 이상 걸리는 원거리 활동자는 대학이 합리적으로 판단하여 활동 시간으로 인정 가능(월 최대 12시간)\n- (활동시간기준)\n연간 최소 활동시간\n1일 최대\n…", "attachments": [{"name": "2026학년도 1학기 대학생 청소년 인공지능(AI) 교육지원장학금 멘토 선발 계획(안).pdf (293 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=278099&no=1"}, {"name": "2026 대학생 AI청소년교육지원사업 참여 기관 목록 참고 자료(게시용).xlsx (15 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=278099&no=2"}, {"name": "(멘토용) 대학생 멘토 신청 관련 매뉴얼.pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=278099&no=3"}, {"name": "멘토 활동계획서 양식.hwp (64 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=278099&no=4"}, {"name": "2026년도 대학생 청소년 AI 교육지원장학금 업무처리기준(안).pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=278099&no=5"}, {"name": "(양식) 출근부 미입력 사유서.hwp (34 KBytes)", "url": "ht 여 바랍니다.\n📌 모집대상\n식품 등 분야별 관련 계열 학과(전공) 4학년 재학생 ※ 휴학생 참여 불가\n📅 모집기간\n~ 2026. 7. 17.(금) 18:00까지\n📝 신청방법\n디지털식품정보플랫폼(DFIP)에서 직접 신청\n회원가입(개인회원) → 지원사업 → 사업공고 → 「2026년 4차 대학생 현장실습 모집공고」 신청\n모집공고 및 분야별 운영계획서를 반드시 확인 후 신청\n🔗 신청 바로가기 → https://www.foodpolis.kr/dfip/fo/main.do\n📂 제출서류 * 모집공고(붙임1) 내 [별지 제1~4호 서식] 참고\n대학생 현장실습 신청서 1부\n대학생 현장실습 자기소개서 1부\n자기소개 영상 1부(30초~1분)\n보안서약서 1부…", "attachments": [{"name": "[붙임1] 2026년 4차 대학생 현장실습 모집공고.hwpx (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278058&no=1"}, {"name": "[붙임2] 식품진흥원 분야별 운영계획서.pdf (486 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=278058&no=2"}], "deadline": "2026-07-17", "org": null, "opp": {"category": "비교과", "grades": [4], "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278058"}, {"seq": 278046, "cat": "event", "title": "「2026 동아시아문화도시 국제문화교류 청소년문화예술캠프」 도내 참가자 모집 (중국, 일본)", "author": "학생복지과(학생)", "date": "2026-07-07", "views": 9237, "pinned": false, "posted": "2026-07-07 10:47", "excerpt": "", "attachments": [{"name": "공고문(중국).hwpx (68 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=278046&no=1"}, {"name": "공고문(일본).hwpx (69 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=278046&no=2"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=278046"}, {"seq": 278039, "cat": "event", "title": "2026년 보훈 공공데이터·AI 활용 아이디어 공모전 개최 안내", "author": "학생복지과(학생)", "date": "2026-07-07", "views": 8129, "pinned": false, "posted": "2026-07-07 ry=203&seq=278002&no=1"}], "deadline": "2026-07-15", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=278002"}, {"seq": 277995, "cat": "general", "title": "[모집] 기업과 제품을 널리 알릴 기회! 「오픈비즈샵」 전시 참가기업 모집(~7/17)", "author": "제주대학교 RISE사업단", "date": "2026-07-06", "views": 10116, "pinned": false, "posted": "2026-07-06 17:56", "excerpt": "시제품, 어디에서 선보여야 할지 고민이신가요?\n좋은 제품을 만들었는데 홍보할 기회가 부족하셨나요?\n오픈비즈샵 전시를 통해\n📢 기업 · 제품 홍보\n🤝 판매 연계 · 판로 확대\n💬 관람객 피드백을 통한 시장성 검증\n🌟 예비 고객과의 접점 확대 · 브랜드 인지도 향상\n제품과 브랜드를 알리고, 시장성을 직접 검증해 보세요!\n[모집 안내]\n· 모집 대상: 제주대학교 (예비)창업기업 중 (시)제품 전시가 가능한 기업\n· 신청 기간: ~ 2026. 7. 17.(금)\n· 선정 발표: 2026. 7. 1.(수) / ※ 전시기업 최대 20개사 선정\n[전시 안내]\n· 기간: 2026. 7. ~ 2027. 1. 29.(금)\n· 장소: 제주대학교 산학협력관 1층 정보검색실 & 교류관\n[신청 방법]\n신청서 작성 후, 이메일 제출(✉️syoh@jejunu.ac.kr)\n[문의]\n제주대학교 RISE사업단 창업지원팀(☎️064-754-4555)\n📌 자세한 내용은 공고문 및 모집 포스터를 확인해 주세요!", "attachments": [{"name": "(공고문) 대학창업 홍보 전시관 오픈비즈샵 전시 기업 2차 모집.hwp (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277995&no=1"}], "deadline": "2026-07-17", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 (예비)창업기업 중 (시)제품 전시가 가능한 기업", "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277995"}, {"seq": 277991, "cat": "general", "title": "[모집] 창업기업 초기성장 지원 프로그램 「Startup Builder」 참여기업 모집(~7/31)", "author": "제주대학교 RISE사업단", "date": "2026-07-06", "views": 10348, "pinned": false, "posted": "2026-07-06 17:16", "excerpt": "시제품 제작부터 마케팅·판로개척까지,\n교내 창업기업의 성장을 지원합니다!\n사업화 역량을 강화하고 시장 경쟁력을 높일 수 있는 기회, 지금 신청하세요!\n[모집 안내]\n· 모집대상 : 제주대학교 대학(원)생 및 교원 창업기업(*휴학생, 수료생 지원 불가)\n· 신청기간 : ~ 2026. 7. 31.(금) 18:00 / * 상시 신청(예산 소진 시 조기 마감)\n· "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=277670"}, {"seq": 277654, "cat": "event", "title": "JEJU CIS 시민과학대학 7기 야외교육 및 연구활동안내(26.7.4, 토 9시~12시)", "author": "제주대학교 기초과학연구소", "date": "2026-06-29", "views": 8884, "pinned": false, "posted": "2026-06-29 18:16", "excerpt": "안녕하세요. 제주대학교 기초과학연구소입니다.\n26.7.4 토요일, JEJU CIS 시민과학대학 7기 야외교육 및 연구활동을 진행합니다.\n현장에서 모니터링 교육과 공동 연구활동이 함께 이루어질 예정입니다.\n*일시: 2026년 7월 4일(토) 09:00~12:00\n*장소: 교래곶자왈 민오름(제주시 봉개동 2750-2)\n*대상:관심있는 누구나\n*준비물\n- 개인 소지 촬영도구(스마트폰으로도 충분)\n- 돋보기(있는 분만 가져오셔도 됩니다)\n- 메모 보드 등 필기류\n* 안내사항\n- 위생상 문제로 식사는 제공되지 않습니다. 다과와 물은 제공 예정입니다.\n*참가 신청방법: 네이버 폼 QR코드 신청\n- 네이버 폼 : https://naver.me/FnspM8t6\n*문의: 064-754-8308(제주대학교 기초과학연구소)", "attachments": [{"name": "2026 시민과학대학 7기 야외교육 및 연구활동 홍보 포스터.png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=277654&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "관심있는 누구나", "benefit": null, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277654"}, {"seq": 277653, "cat": "event", "title": "[기초과학 전문가 초청 대중강연] 내 안의 물고기를 찾아서(7/18)@제주문학관", "author": "제주대학교 기초과학연구소", "date": "2026-06-29", "views": 9341, "pinned": false, "posted": "2026-06-29 18:10", "excerpt": "제주대학교 기초과학연구소입니다.\n2026 기초과학 전문가 초청 대중강연을 아래와 같이 안내드립니다.\n인간의 몸에는 수억 년에 걸친 진화의 흔적이 담겨 있습니다.\n이번 북콘서트에서는 『내 안의 물고기』를 통해 인간과 생명의 연결성을 이해하고,\n과학과 문학이 만나는 흥미로운 이야기를 함께 나누고자 합니다.\n*주제: 내 안의 물고기를 찾아서\n*연사: 김종랑 회장(유망여성과학기술인네트워크), 최선미 박사(한의학연구원 책임연구원), 최윤정 교수(세종대학교 대양휴머니티칼리지)\n*일시: 2026. 7. 18.(토) 14:00 ~ 16:00\n*장소: 제주문학관(제주시 연북로 339)\n*대상: 관심 있는 누구나\n*참가 신청방법: 네이버 폼 QR코드 신청\n- 네이버 폼 : https://naver.me/xqbvKCUm\n(링크가 열리지 않을 경우, 링크 주소를 복사한 뒤 인터넷 주소창에 붙여넣어 접속해 주세요!)\n*문의: 064-754-8308(제주대학교 기초과학연구소)\n자세한 사항은 포스터를 참고해 …", "attachments": [{"name": "2026 기초과학 전문가 초청 대중강연 홍보 포스터.png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=277653&no=1"}, {"name": "2026 대중강연 전체 일정 포스터.png (487 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=277653&no=2"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "관심 있는 누구나", "benefit": null, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277653"}, {"seq": 277649, "cat": "general", "title": "2026년 미국 캘리포니아 주립대학 석학 초청 특강 「AI 시대, 교사와 학습자의 새로운 역할」 개최 안내", "author": "글로컬대학사업단", "date": "2026-06-29", "views": 10390, "pinned": false, "posted": "2026-06-29 16:23", "excerpt": "제주대학교 글로컬대학사업단 및 지능소프트웨어교육연구소에서는\nAI 시대 교육환경 변화에 대한 이해를 높이고, 교사와 학습자의 새로운 역할을 함께 모색하고자\n미국 캘리포니아 주립대학(CSU) 석학 초청 특강을 개최합니다.\n이번 특강은 제주대학교 소속 학생, 교직원 등 학내 구성원 누구나 참여 가능하오니 관심 있는 분들의 많은 참여 바랍니다.\n(중식 제공을 위해 사전 신청이 필수입니다)\n- 일시: 2026. 7. 1.(수) 10:30 ~ 13:30\n- 장소: 제주대학교 사범대학 2호관 3층 에듀홀\n- 주제: AI 시대, 교사와 학습자의 새로운 역할\n- 행사일정\n1) 특강 진행: 10:30 ~ 12:30\n미국 캘리포니아 주립대학교(CSU) 고규한 교수 특강 진행\n특강은 한국어로 진행\n2) 점심 식사 및 네트워킹: 12:30 ~ 13:30\n점심 도시락 제공\nCSU 교수님 및 대학생과 네트워킹 진행\n- 참여대상: 제주대학교 소속 학생, 교직원 등 학내 구성원 누구나\n- 신청방법: 온라인 신청서…", "attachments": [], "deadline": "2026-07-01", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": "제주대학교 소속 학생, 교직원 등 학내 구성원 누구나", "benefit": null, "how": "온라인 신청서 제출", "contact": "제주대학교 지능소프트웨어교육연구소", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277649"}, {"seq": 277617, "cat": "event", "title": "2026 한국건축문화대상(학생설계 공모전 포함) 공모 참가 안내", "author": "학생복지과(학생)", "date": "2026-06-29", "views": 8764, "pinned": false, "posted": "2026-06-29 10:19" 26학년도 2학기 부산외국어대학교 교류 수학 안내\n1. 신청자격: 1학기 이상 이수한 성적 평균 평점이 2.4 이상인 학부 학생(재학생 및 복학예정자)\n※ 대학원생 교류 수학에 대한 사항은 해당 대학원으로 문의(064-754-2152)\n2. 신청방법 : 2026. 7. 14.(화) 18:00까지 필요서류를 갖추어 소속학과로 신청(첨부파일 참조)\n3. 제출서류 : 타대학수학신청원(첨부파일 참조) 및 소정양식(교류대학양식으로, 첨부파일 참조)\n4. 주의사항\n- 교류수학 타대학 중복신청 불가\n- 교류 대학별 신청일정 및 수강신청 방법 등 안내사항 필히 확인\n- 수강신청 가능 학점 : 18학점 이내(학부과정) → 지원하는 대학 규정상 상이할 수 있으니, 안내사항 필히 확인\n- 대학원 과정 수강 및 인정 학점은 소속 대학원 또는 학과로 문의바람(대학원별로 다름)\n- 타 대학교 교류수학 중 본교 교과목(원격수업 포함) 수강신청 불가\n- 신청 후 교류수학 변동사항(휴학, 포기 등)이 있을 경…", "attachments": [{"name": "타 대학 수학신청원 및 취소원 서식.hwp (52 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=277549&no=1"}, {"name": "[붙임1] 2026학년도 2학기 수학 안내문(타대용).hwp (330 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=321&seq=277549&no=2"}], "deadline": "2026-07-14", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "1학기 이상 이수한 성적 평균 평점이 2.4 이상인 학부 학생(재학생 및 복학예정자)", "benefit": null, "how": "2026. 7. 14.(화) 18:00까지 필요서류를 갖추어 소속학과로 신청(첨부파일 참조)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=321&act=view&seq=277549"}, {"seq": 277534, "cat": "general", "title": "(글로컬대학사업단) 2026년 「해외석학 인력교류사업」 과제 공모 신청 안내", "author": "글로컬대학사업단", "date": "2026-06-25", "views": 11156, "pinned": false, "posted": "2026-06-25 13:38", "excerpt": "2026년 글로컬대학사업으로 세계 여러 나라 연구자들과의 연구교류 및 다양한 국제협력 활동을 지원하여 R&D 글로벌 네트워크 구축· 공동연구 추진을 위한\n「2026년도 해외석학 인력교류사업」 과제를 아래와 같이 안내하오니, 공모 계획을 확인하시고 신청하여 주시기 바랍니다.\n1. 공모기간: 2026. 6. 24.(수) 14:00 ~ 2026. 7. 6.(월) 17:00 마감\n2. 지원분야: (특성화 분야) 무탄소 에너지, 친환경 MRO, AI기반 청정바이오, 제주 문화유산 보존\n3. 예산지원: 과제당 10~20백만원 이내 (25과제 내외 선정 예정)\n4. 신청방법: 글로컬대학사업단 공식 이메일 제출 (jejunu_glc@jejunu.ac.kr) ※ 유선문의(내선) 4950\n5. 제출서류: ①과제계획서 ②상대측 연구자와의 교환 서신 ③개인정보 활동 동의서\n6. 과제기간: 2026. 8. 1. ~ 2027. 1. 31.\n7. 기 타: 신청제한 사항, 의무 사항 등 기타 세부 내용 「붙임」…", "attachments": [{"name": "(공고용)2026년 해외석학 인력교류사업 신규과제 공고문.hwpx (114 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277534&no=1"}], "deadline": "2027-01-31", "org": "글로컬대학사업단", "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "글로컬대학사업단 공식 이메일 제출 (jejunu_glc@jejunu.ac.kr) ※ 유선문의(내선) 4950", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277534"}, {"seq": 277529, "cat": "scholarship", "title": "2026년 해양경찰청 해성장학회 장학생 선발 안내", "author": "학생복지과(장학)", "date": "2026-06-25", "views": 8250, "pinned": false, "posted": "2026-06-25 11:32", "excerpt": "[해성장학회] 에서 2026년 장학생을 선발하오니 신청을 희망하는 학생은 기한내에 신청 바랍니다.\n1. 추천 인원(제주대→재단) : 2명(각 학과(전공)별 1명 이내 추천)\n2. 장학금액 : 1인당 1,000,000원(1회 지급)\n※ 학습보조비 장학금으로, 다른 장학금(교내·외, 국가장학금)과 중복수혜 가능\n3. 신청자격 : 해양과학대학 소속 재학생\n- 25년 2학기 기준 평점평균 3.44/4.3 이상(최소 12학점 이수)\n- 25년 2학기 기준 소득분위 8구간 이내\n- 고학년 우선선발\n※ 직계존속 중에 해양경찰청 소속 공무원이 있는 학생, 국외 유학생, 정규학기 초과 재학생 및 졸업 유예 학생,\n휴학생, 징계받은 학생 제외\n4. 제출서류 : 장학금 신청서, 추천서, 재학증명서, 성적증명서, 한국장학재단 학자금지원구간 통지서, 개인정보이용동의서,\n학생본인의 통장사본\n5. 제출처 : 학과(전공)사무실(제출기한은 학과마다 상이할 수 있으니 학과로 문의 바람)\n※ 2026. 7. 6.(월…", "attachments": [{"name": "’26년 해성장학회 해양 인재육성 장학생 선발 계획.hwpx (116 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=277529&no=1"}, {"name": "’26년 해성장학회 제출서식.hwpx (52 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=277529&no=2"}], "deadline": "2026-07-06", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": ["해양과학대학"], "who": "해양과학대학 소속 재학생", "benefit": "1인당 1,000,000원(1회 지급)", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=277529"}, {"seq": 277524, "cat": "general", "title": "‘2026 대한민국 열린 토론대회’ 참가자 접수안내", "author": "학생복지과(학생)", "date": "2026- vey/outEvent.htm?act=download&category=323&seq=277421&no=1"}], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "(아라초등학교 도서관) 064-729-5900 ☞ 도서관 담당자 연결 요청", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=277421"}, {"seq": 277420, "cat": "volunteer", "title": "(제주시자원봉사센터) 자원봉사 스토리텔링 길 투어와 환경정화 활동 [북촌리 편-2편] 자원봉사자 모집", "author": "학생복지과(학생)", "date": "2026-06-23", "views": 8510, "pinned": false, "posted": "2026-06-23 10:43", "excerpt": "자원봉사 스토리텔링 길 투어와 환경정화 활동 [북촌리 편-2편] 자원봉사자 모집\n■ 모집 내용\n마을 주민의 생생한 목소리로 듣는 우리 동네 자원봉사 스토리텔링 길 투어, 그 특별한 여정 [북촌리 편-2편]에 함께 해주세요.\n마을의 깊은 역사와 자원봉사 이야기가 어우러진 볼런투어와 환경정화 활동이 진행 됩니다.\n1. 집결장소: 북촌리 리사무소(제주시 조천읍 일주동로 1514) 15:55까지\n2. 일시/장소: 2026. 7. 3.(금) 16:00~18:00 / 제주시 조천읍 북촌리\n3. 내 용: 마을 역사와 자원봉사 이야기가 있는 볼런 투어와 환경정화 활동\n4. 주 제: 마을 주민의 생생한 목소리로 듣는 우리 동네 자원봉사 스토리텔링\n길 투어 “북촌리 편”\n5.지원사항: 간식 지원\n6.준비물: 간편한 복장(운동화), 마실물, 썬크림, 모자\n7.유의사항: 활동인원이 저조한 경우, 우천시에는 취소 될 수 있습니다.\n8.문의: 제주시자원봉사센터 064-728-7527\n9. 신청방법: 1365…", "attachments": [{"name": "길투어.jpg (622 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=277420&no=1"}], "deadline": "2026-07-03", "org": "제주시자원봉사센터", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": "간식 지원", "how": "1365자원봉사포털에서 '북촌리 검색' 신청", "contact": "제주시자원봉사센터 064-728-7527", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=277420"}, {"seq": 277388, "cat": "general", "title": "(진로취업과) 2026학년도 1학기 진로취업과 국가근로장학생 추가 선발 안내", "author": "진로취업과", "date": "2026-06-22", "views": 10857, "pinned": false, "posted": "2026-06-22 17:19", "excerpt": "2026학년도 1학기 진로취업과 국가근로장학생을 아래와 같이 모집하오니 많은 지원 바랍니다.\n* 근로기간 및 근로시간은 내부사정에 따라 변동될 수 있으며, 접수 인원이 많을 경우 조기마감 될 수 있습니다.\n1. 지원자격: '26학년도 1학기 한국장학재단 국가근로장학금 신청완료자 중 학자금 학생이 아니더라도,…", "attachments": [], "deadline": "2026-06-18", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "제주대학교·제주관광대학교·제주한라대학교 창업동아리 참여/참여예정 학생", "benefit": null, "how": "포스터 내 QR코드 스캔", "contact": "제주대학교 RISE사업단 창업교육팀 064-754-4552", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277118"}, {"seq": 277111, "cat": "general", "title": "[UNITAR 제주국제연수센터] 2026 제주포럼 연계 동시세션 개최 안내", "author": "글로컬대학사업단", "date": "2026-06-17", "views": 15039, "pinned": false, "posted": "2026-06-17 09:13", "excerpt": "유엔훈련연구기구(UNITAR) 제주국제연수센터에서 오는 6월 26일(금), 제주포럼 2026의 연계 세션으로 「참여에서 공동 설계로: 글로벌 의제와 지역 실행의 연결」을 주제로 해비치 호텔 & 리조트 제주에서 동시세션을 개최할 예정입니다.\n이번 세션에는 UNITAR, UNDP, 지방정부 및 사회 혁신 분야 전문가들이 참여하여 지속가능발전목표(SDGs)를 비롯한 글로벌 의제와 지역사회의 연결, 그리고 청년을 포함한 다양한 지역 주체들의 역할에 대해 논의할 예정입니다.\n참가를 희망하는 분들의 많은 신청 바랍니다.\n■ 세션명\n참여에서 공동 설계로: 글로벌 의제와 지역 실행의 연결\n■ 일시 및 장소\n일시: 2026년 6월 26일(금) 13:30~14:50\n장소: 해비치 호텔 & 리조트 제주 크리스탈홀 E(B1)\n■ 지원사항\n제주시 ↔ 행사장 간 왕복 셔틀버스 제공\n중식 바우처 제공(행사장 인근 지정 식당 중 선택 가능)\n■ 셔틀버스 운영시간\n출발: 2026년 6월 26일(금) 10:30, …", "attachments": [{"name": "제주국제연수센터 2026년 제주포럼 UN세션 개최(안)_국문.hwp (79 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277111&no=1"}, {"name": "제주국제연수센터 2026년 제주포럼 UN세션 개최(안)_영문.pdf (428 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277111&no=2"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277111"}, {"seq": 277097, "cat": "general", "title": "2026년 하계 국제교류 '제주 런케이션 캡스톤 프로젝트' 참가자 모집 안내", "author": "교육학과", "date": "2026-06-16", "views": 14221, "pinned": false, "posted": "2026-06-16 17:23", "excerpt": "제주대학교 교육학과에서는 본교생과 미국 Georgia Tech 학생 간의 국제교류를 통해 지역 현안을 해결하고 글로컬 협력 모델을 구축하고자\n'제주 런케이션(Learncation) 캡스톤 프로젝트'를 운영하오니 학생 여러분들의 많은 관심 부탁드립니다.\n가. 프로그램 개요\n1) 활동내용 : 미국 Georgia Tech 학생과의 글로벌 팀 빌딩을 통한 제주 지역 현안 중심 해커톤 기반 캡스톤 프로젝트 수행\n2) 활동기간 : 2026. 6. 26.(금) ~ 6. 27.(토)\n3) 활동장소 : 제주 동·서부 일대\n4) 활동혜택 : 교통 및 식사 제공, 양일 참여 시 비교과 마일리지 제공 예정\n나. 참가신청\n1) 신청대상 : 제주 런케이션(Learncation) 캡스톤 프로젝트에 관심있는 제주대학교 학부 및 대학원생(수료생 포함)\n2) 신청기간 : 2026. 6. 16.(화) ~ 6. 18(목)\n3) 신청방법\n- 아래 포스터 내 QR 코드 접속 후 신청\n- 신청 구글폼 https://docs…", "attachments": [], "deadline": "2026-06-18", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": "제주 런케이션(Learncation) 캡스톤 프로젝트에 관심있는 제주대학교 학부 및 대학원생(수료생 포함)", "benefit": "교통 및 식사 제공, 양일 참여 시 비교과 마일리지 제공 예정", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277097"}, {"seq": 277067, "cat": "event", "title": "[외교부] 「2026년도 제19회 국제기구 진출 설명회」 개최", "author": "대학일자리플러스센터", "date": "2026-06-16", "views": 15267, "pinned": false, "posted": "2026-06-16 15:21", "excerpt": "", "attachments": [{"name": "2026년도 제19회 국제기구 진출 설명회 개최.pdf (161 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=277067&no=1"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277067"}, {"seq": 277059, "cat": "general", "title": "2026년도 제19회 국제기구 진출 설명회 개최 안내", "author": "국제교류과", "date": "2026-06-16", "views": 16195, "pinned": false, "posted": "2026-06-16 13:42", "excerpt": "「2026년도 제19회 국제기구 진출 설명회」 개최\n외교부는 우리 국민의 국제기구 진출을 지원하기 위해 국제기구 담당자들을 초청하여 「2026년도 제19회 국제기구 진출 설명회」를 개최할 예정입니다. 관심 있는 분들의 많은 참석 부탁드립니다.\nㅇ 행사명 : 2026년도 제19회 국제기구 진출 설명회\nㅇ 일시 및 장소 :\n- 2026.7.20.(월) 13:30-17:50 서울시청\n- 2026.7.21.(화) 서울시청(모의면접*)\n- 2026.7.22.(수) 13:30-17:50 제주웰컴센터\n* 사전신청 후 선발된 대상에 한해 비공개 진행\nㅇ 참석기구 : 유엔사무국(UN Secretariat), 유엔개발계획(UNDP), 유엔아동기금(UNICEF), 유엔교육과학문화기구(UNESCO), 국제원자력기구(IAEA), 경제협력개발기구(OECD)\nㅇ 설명회 사전 등록 :\n- 등록기간 : 2026.6.1.(월) - 7.13.(월) 자정(한국 표준시)\n- 등록방법 : 외교부 국제기구인사센터 홈페이지 …", "attachments": [{"name": "2026년도 제19회 국제기구 진출 설명회 개최.pdf (161 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277059&no=1"}, {"name": "2026 국제기구 진출 설명회 (메인).jpg (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277059&no=2"}, {"name": "2026 국제기구 진출 설명회 (프로그램).jpg (5 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277059&no=3"}, {"name": "2026 국제기구 진출 설명회 (참가기구).jpg (2 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=277059&no=4"}], "deadline": "2026-06-29", "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "외교부 국제기구인사센터 홈페이지 메인화면 국제기구 진출 설명회 팝업창을 통해 제출서류를 하나의 PDF 파일로 통합하여 업로드", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277059"}, {"seq": 277048, "cat": "general", "title": "[마감]한국동서발전(주)과 함께하는 EWP 발전공기업 직무이해 캠프 참가자 모집", "author": "대학일자리플러스센터", "date": "2026-06-16", "views": 15716, "pinned": false, "posted": "2026-06-16 11:37", "excerpt": "★ 온라인 신청: https://forms.gle/8i1K88mPtbUPzi7e6\n★ 카카오톡 문의: https://open.kakao.com/o/sxVOVfzf\n★ 온라인 신청: https://forms.gle/8i1K88mPtbUPzi7e6\n★ 카카오톡 문의: https://open.kakao.com/o/sxVOVfzf", "attachments": [], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": true, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277048"}, {"seq": 277041, "cat": "scholarship", "title": "2026학년도 1학기 발전기금 자립준비청년 장학생 선발계획 안내", "author": "학생복지과(장학)", "date": "2026-06-16", "views": 13516, "pinned": false, "posted": "2026-06-16 10:45", "excerpt": "2026학년도 1학기 발전기금 자립준비청년 장학생 선발계획 안내드리니, 해당 학생들은 기한 내 신청하여 주시기 바랍니다.\n○장학개요\n가. 지원대상: 제주대학교 학부 및 대학원 재학생 중 자립준비청년\n* 자립준비청년이란? 아동복지법 및 청소년복지지원법에 따라 아동복지시설, 위탁가정 또는 청소년쉼터 등에서 보호를 받다가 만 18세 이후(연장시 만 24세)가 되어 보호조치가 종료되거나 퇴소한 청년\n나. 선발인원: 선발 자격 충족시 전원 선발\n다. 장학금액: 1인 100만원 ※학습지원금(타 장학금과 이중수혜 가능)\n라. 신청기간: 2026. 6. 23.(화)까지\n마. 신청방법: 학생회관 3층 학생복지과 방문 또는 이메일 제출(c5256@jejunu.ac.kr)\n-방문제출시 평일 9시~18시(12시~13시 제외), 이메일 제출 시 6/23(화) 24시 전까지\n바. 제출서류: 장학생 신청서 및 자립준비청년 증빙서류\n※자세한 선발자격 및 증빙서류 등은 선발계획안을 반드시 읽어주시기 바랍니다. 감…", "attachments": [{"name": "2026학년도 1학기 발전기금 자립준비청년 장학생 선발계획(안).hwp (109 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=277041&no=1"}, {"name": "자립준비청년 지원 장학금 신청서(서식).hwp (60 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=277041&no=2"}, {"name": "자립준비청년 장학 안내 포스터.png (334 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=277041&no=3"}], "deadline": "2026-06-23", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 및 대학원 재학생 중 자립준비청년", "benefit": "1인 100만원 ※학습지원금(타 장학금과 이중수혜 가능)", "how": "학생회관 3층 학생복지과 방문 또는 이메일 제출(c5256@jejunu.ac.kr)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=277041"}, {"seq": 277034, "cat": "event", "title": "「2026 안산 e스포츠 페스티벌」 대회 선수 모집 안내", "author": "대학본부", "date": "2026-06-16", "views": 12175, "pinned": false, "posted": "2026-06-16 09:02", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277034"}, {"seq": 277033, "cat": "general", "title": "[ETRI/제주산학융합원] 「반도체 설계 이해 및 리눅스 실습 교육」 교육생 모집 (~6/24)", "author": "제주산학융합원", "date": "2026-06-16", "views": 15779, "pinned": false, "posted": "2026-06-16 09:00", "excerpt": "제주 핵심 수출 산업인 반도체 분야의 현장 실무 능력을 강화하고 도내 인재들의 역량을 높이기 위한 「반도체 설계 이해 및 리눅스 실습 교육」을 실시합니다.\n반도체 분야로의 취업이나 역량 강화를 희망하시는 도내 청년 및 재직자분들의 많은 관심과 참여 바랍니다.\n📌 교육 개요\n교 육 명 : 반도체 설계 이해 및 리눅스 실습 교육\n교육일정 : 2026년 6월 29일(월) ~ 7월 1일(수) (3일간, 총 19시간)\n교육장소 : 제주지식산업센터 ETRI 교육장\n모집인원 : 제주 지역 내 반도체 분야 교육 희망자 15명 내외\n교 육 비 : 전액 무료 (교재 및 중식 제공)\n📚 주요 교육 내용\n1일차 (6/29) 09:00-17:30 : SoC(System on Chip) 설계 전반의 이해 및 환경 구축\n2일차 (6/30) 09:00-17:30 : Linux System 사용 지식 습득 및 리눅스 명령어 실습\n3일차 (7/01) 09:00-13:00 : 반도체 산업 전문가 초청 특강\n👥 모집 …", "attachments": [], "deadline": "2026-06-24", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "구글 폼 링크를 통한 온라인 접수", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=277033"}, {"seq": 277032, "cat": "event", "title": "2026년 청(소)년 기후변화 컨퍼런스 LCOY Korea 개최 안내", "author": "대학본부", "date": "2026-06-16", "views": 13456, "pinned": false, "posted": "2026-06-16 08:57", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=277032"}, {"seq": 277024, "cat": "scholarship", "title": "[ 장학 ] 2026학년도 1학기 하계방학 시설과 교내근로 장학생 추가 선발 안내", "author": "제주대학교 시설과", "date": "2026-06-15", "views": 11394, "pinned": false, "posted": "2026-06-15 17:09", "excerpt": "2026학년도 1학기 하계방학 시설과 교내근로 장학생을 추가로 선발하고자 합니다.\n○ 근로종류 : 교내근로 장학생\n○ 모집기간 : 2026. 6. 15.(월) ~ 6. 19(금) 16:00까지 *기간 내  가능한 아이디어를 제안하게 됩니다.\"\n본 프로그램은 교수학습지원센터가 운영비와 프로그램 진행을 지원하며, 참가 학생들은 팀을 구성하여 건강 관련 사회문제를 탐색하고 아이디어를 기획·실행하는 전 과정을 주도적으로 수행하게 됩니다.\n건강한 대학과 지역사회를 위한 새로운 아이디어를 함께 만들어 갈 학생 여러분의 많은 관심과 참여를 바랍니다.\n■ 프로그램명: JNU 헬시톤(Healthython) - 건강 문해력 증진을 위한 실행형 아이디어톤\n■ 운영팀: 제보임팩트\n■ 모집기간: 2026. 6. 12.(금) ~ 2026. 6. 19.(금)\n■ 운영기간: 2026. 6. 25.(목) ~ 2…", "attachments": [{"name": "제보임팩트_포스터.png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=276986&no=1"}], "deadline": "2026-06-19", "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "제주대학교 학부 재학생 25명 이내", "benefit": null, "how": "지원하기] 2026 JNU 헬시톤 (~6/19(금)까지) - https://docs.google.com/forms/d/e/1F…", "contact": "교수학습지원센터 (064-754-2677)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=276986"}, {"seq": 276985, "cat": "general", "title": "2026년 폭력예방교육 이수 안내", "author": "인권센터", "date": "2026-06-15", "views": 15512, "pinned": false, "posted": "2026-06-15 09:57", "excerpt": "2026년 폭력예방교육 이수 안내 드립니다.\n이수기간: 2026년 12월 31일 까지\n이수방법: - (PC버전 접속방법) JNUClass 접속 (https://jnuclass.jejunu.ac.kr) ☞\n『내 강의실 바로가기』 ☞ 대시보드 『2026 폭력예방교육』 클릭 ☞ ‘주차별 강의콘텐츠’ / Zoom 화상강의 동영상 수강\n1. 관련법령\n가. 양성평등기본법 제31조 및 시행령 제19조, 제20조\n나. 성매매방지 및 피해자보호 등에 관한 법률 제5조 및 시행령 제2조\n다. 성폭력방지 및 피해자보호 등에 관한 법률 제5조 및 시행령 제2조\n라. 가정폭력방지 및 피해자보호 등에 관한 법률 제4조의3 및 시행령 제1조의2\n마. 제주대학교 성희롱 성폭력 예방지침 제 7조(성희롱∙성폭력 예방교육)\n2. 위 법률에 의거하여 기관장을 포함한 전 교직원 및 대학(원)생은 폭력예방교육을 연 1회 이상 이수해야 합니다. (교원 및 직원 4시간, 학생 2시간)\n교육대상 : 전체 교직원 및 학생\n구분\n…", "attachments": [{"name": "2026년 폭력예방교육 온라인 이수방법 안내자료(전구성원).pdf (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276985&no=1"}], "deadline": "2026-12-31", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "064-754-3096", "always": false}, "closed": false, "url": "http }, "closed": true, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=276800"}, {"seq": 276789, "cat": "general", "title": "2026학년도 학생생활관 기혼자숙소 입주학생 수시모집 안내", "author": "학생생활관", "date": "2026-06-11", "views": 15076, "pinned": false, "posted": "2026-06-11 10:40", "excerpt": "2026학년도 학생생활관 기혼자숙소 입주학생 수시모집 안내\nⅠ\n모집 및 선발 계획\n❍ 모집 대상 : 우리 대학에 재학 중인 학부 및 대학원생 기혼자\n※ 제주대학교 학생생활관 기혼자숙소 운영지침 제3조(입주자격의 제한)에 해당하는 학생은 입주 불가\n❍ 입주기간 : 입주일로부터 최대 1년\n❍ 기혼자숙소 모집현황\n구분\n호실\n면적\n구조\n사용료\n보증금\n가족실\nC106\nC108\n40.56㎡\n(약12.27평)\n투룸형\n(방2, 싱크대, 욕실, 베란다)\n월 458,000원\n700,000원\n※ 보증금은 입주 전 1회 납부하여 퇴사 시 반환\n※ 사용료는 1개월 단위로 선납하며, 공공요금(전기, 가스, 수도)은 실별 사용량에 따라 정산하여 후납\n❍ 모집구분\n구분\n일정\n비고\n입주신청 및 서류제출\n선착순\n포털시스템\n합격자 발표\n신청 순서에 따라 순차적으로 안내\n합격자, 불합격자 개별 통보\n생활관비 납부 및\n폐결핵 검사 결과서 제출\n입주 3일 전까지 납부 및 제출\n입주 예정인 가족 전원의\n폐결핵 검사 결과서 …", "attachments": [{"name": "재정지원확인서.hwp (52 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276789&no=1"}], "deadline": null, "org": null, "opp": {"category": "비교과", "grades": [1], "colleges": "전체", "who": "우리 대학에 재학 중인 학부 및 대학원생 기혼자", "benefit": null, "how": "포털시스템 – 교내활동 – 학생생활관(아라) – 기혼자 입주신청 – 입주 예정인 가족 사항 입력 – 필수 서류제출 – 입주신청", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=276789"}, {"seq": 276782, "cat": "general", "title": "2026 창업동아리 2차모집", "author": "제주대학교 RISE사업단", "date": "2026-06-11", "views": 13640, "pinned": false, "posted": "2026-06-11 09:44", "excerpt": "생각을 현실로! 2026 창업동아리의 주인공을 찾습니다!\n💡\n생각만 하던 아이디어를 현실로 만드는 경험\n🤝\n결이 같은 동료들과 함께하는 뜨거운 몰입\n🔥\n막연했던 꿈이 확실한 미래로 변하는 과정\n⠀[ 안내 사항 ]\n⠀- 운영 기간: 2026년 7월 ~ 2026년 12월\n⠀- 참여 대상: 창업아이디어를 보유한 제주대학교 재학생 3인 이상으로 구성된 팀\n⠀- 활동 유형\n⠀⠀⠀① 로컬창업트랙\n⠀⠀⠀⠀⠀· 지역기반 : 1차 산업 · 관광 · 식품 등 지역자원 활용 아이템\n⠀⠀⠀⠀⠀· 지역혁신 : 기술을 통한 지역 현안 해결 아이템\n⠀⠀⠀② 테크창업트랙\n⠀⠀⠀⠀⠀· 산업기술 : 지역자원에 기술을 접목한 고도화 아이템\n⠀⠀⠀⠀⠀· 미래기술 : 미래신산업 중심의 기술 창업 아이템\n⠀⠀⠀③ 후속연계트랙 : 2025 창업동아리 성과 ": "월 활동비 지원, 활동 결과에 따른 장학금 지원 등", "how": "한국우편사업진흥원 홈페이지(www.posa.or.kr) 공지사항 내 모집요강 확인 후 네이버폼을 통한 지원", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=276590"}, {"seq": 276543, "cat": "general", "title": "2026학년도 2학기 해외파견 교류수학 프로그램 6차(독일) 선발 안내", "author": "국제교류", "date": "2026-06-08", "views": 14345, "pinned": false, "posted": "2026-06-08 17:49", "excerpt": "국제교류처에서 2026학년도 제2학기 해외파견 교류수학생(6차, 독일)을 아래와 같이 선발하고자 하오니 지원을 희망하는 학생은 붙임의 공고문[붙임 파일] 및 세부 정보를 숙지하여 소속 학과 사무실로 지원서를 제출 바랍니다.\n※해외파견 교류수학 자주하는 질문(국제교류처 홈페이지)\nhttps://cms.jejunu.ac.kr/intl/community/qna4.htm\n1. (6차)파견 예정 대학 및 선발 인원: 독일 피히테 2명내외\n2. 선발 기준\n- 선발 1순위 대상자 : 수업연한 미초과자*, 해외파견 교류수학 경험이 없는 자(온라인 파견 제외)\n* 수업연한 초과자, 학업연장자 및 대학원생의 경우 대학 지원금 지급 불가\n- 1~2지망 대학을 기준으로 어학 성적 기준을 모두 충족하는 자\n- 어학 기준 충족 인원이 선발 인원 초과 시 학업 성적(전체 평점), 국제교류처 주관 프로그램(JNU E-Buddy 등) 참여 사항, 언어\n교육원 어학 수업 이수 사항에 대해 각 가중치를 부여한 점수를…", "attachments": [{"name": "(붙임1) 2026-2학기 해외파견 교류수학 프로그램 6차 선발 공고.hwp (153 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276543&no=1"}, {"name": "(붙임2) 2026-2학기 교류수학 선발 대학 세부정보(6차).xlsx (46 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276543&no=2"}, {"name": "(붙임3) (서식) 2026-2학기 해외파견 교류수학 프로그램 6차 지원서.hwp (180 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276543&no=3"}], "deadline": null, "org": null, "opp": {"category": "국제교류", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": "국제교류과 064)754-8241 / intl3@jejunu.ac.kr", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=276543"}, {"seq": 276539, "cat": "general", "title": "[입학처] 2026년 아라진로멘토 모집(고교 방문 멘토링)", "author": "입학처", "date": "2026-06-08", "views": 13888, "pinned": false, "posted": " category=203&act=view&seq=276492"}, {"seq": 276382, "cat": "scholarship", "title": "2027학년도 소아청소년 당뇨인 및 췌장장애인 푸른빛 희망 장학금 지원 안내", "author": "학생복지과(장학)", "date": "2026-06-05", "views": 8803, "pinned": false, "posted": "2026-06-05 16:38", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=276382"}, {"seq": 276374, "cat": "scholarship", "title": "[유한재단] 2026학년도 1학기 유한재단 신규 장학생(학부생) 추가 선발 안내", "author": "학생복지과(장학)", "date": "2026-06-05", "views": 8258, "pinned": false, "posted": "2026-06-05 14:36", "excerpt": "(재)유한재단에서 2026년 1학기 신규 장학생(학부생)을 아래와 같이 추가 선발하오니, 신청을 희망하는 학생은 기한내에 신청 바랍니다.\n1. 추천 인원(제주대→재단) : 1명\n2. 장학금액 : 1인당 금3,000,000원(학습보조비 / '26년 1학기 및 2학기 지원 / '26년도 재학 필수)\n※ 국가장학금 및 교내장학금 중복수혜 가능, 타 기관 생활비성 장학금 중복수혜 불가\n3. 지원자격 : '26년도 재학생 중 결손가정* 혹은 다문화가정**의 소득분위 5분위 이하인 학생\n* 결손가정 : 한부모 가정 또는 부모의 부재 가정\n** 다문화가정 : 부모 중 한명이 외국인인 가정\n※ 타 기관 생활비성 장학금 기수혜한 학생, 수업연한초과자, 수료(졸업)생, 휴학생, 휴학 및 자퇴예정자, 현기준 졸업학기생은 신청 불가\n4. 제출서류 : 결손 및 다문화가정임을 증명할 수 있는 서류, 소득분위 증빙서류('26년 1학기 학자금 지원구간 통지서), 개인정보의 수집이용동의서(서식)\n※ 결손가정의 경…", "attachments": [{"name": "[유한재단] 개인정보 수집 이용 및 제공 동의서(서식).hwp (73 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=276374&no=1"}], "deadline": "2026-06-12", "org": null, "opp": {"category": "장학", "grades": "전체", "colleges": "전체", "who": "'26년도 재학생 중 결손가정* 혹은 다문화가정**의 소득분위 5분위 이하인 학생", "benefit": "1인당 금3,000,000원(학습보조비 / '26년 1학기 및 2학기 지원 / '26년도 재학 필수)", "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=276374"}, {"seq": 276373, "cat": "general", "title": "외른 바이써트 주한독일대사관 부대사 초청 특강 안내", "author": "독일학과", "date": "2026-06-05", "views": 11620, "pinned": fal  학부 신입생 200만원, 대학원 신입생 300만원 ※학습지원금(타 장학금과 이중수혜 가능)\n라. 신청기간: 2026. 6. 13.(금)까지\n마. 신청방법: 학생회관 3층 학생복지과 방문 또는 이메일 제출(c5256@jejunu.ac.kr)\n-방문제출시 평일 9시~18시(12시~13시 제외), 이메일 제출 시 6/12(금) 24시 전까지\n바. 제출서류: 장학생 …", "attachments": [{"name": "2026학년도 1학기 발전기금 학성 한영선 자립준비청년 장학생 선발계획(안)(송부용).hwp (172 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=276340&no=1"}, {"name": "학성 한영선 자립준비청년 지원 장학금 신청서(서식).hwp (60 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=323&seq=276340&no=2"}], "deadline": "2026-06-13", "org": null, "opp": {"category": "장학", "grades": [1], "colleges": "전체", "who": "제주대학교 학부 및 대학원 신입생 중 자립준비청년", "benefit": "학부 신입생 200만원, 대학원 신입생 300만원 ※학습지원금(타 장학금과 이중수혜 가능)", "how": "학생회관 3층 학생복지과 방문 또는 이메일 제출(c5256@jejunu.ac.kr)", "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=323&act=view&seq=276340"}, {"seq": 276333, "cat": "event", "title": "[AI미래교육연구회] 교실을 바꾸는 AI미래교육박람회 개최 안내", "author": "대학본부", "date": "2026-06-04", "views": 9523, "pinned": false, "posted": "2026-06-04 13:38", "excerpt": "AI미래교육연구회 주관 '교실을 바꾸는 AI미래교육박람회' 개최 안내드리오니, 관심있는 학생의 많은 참여 바랍니다.\n○ 박람회: 2026.6.20.(토) 10:00~17:00 숙명여자대학교(서울역, 용산역 인근)\n○ 예비 교원 대상 특별 연수: 2026.6.20.(토) 10:00~11:00 강의실 B109, B111\n[초등 예비 교원 연수]\n고유함을 빚는 교육자가 되기 위한 준비 - 교육크리에이터 힐링쌤 임정연 교사\n[중등 예비 교원 연수]\n합격하는 공부 성장하는 교사 - 예비교사의 든든한 멘토 안형서\n예비교원들이 미래 교실과 교사의 역할을 직접 경험해볼 수 있는 AI 코스웨어·에듀테크도 직접 체험 가능합니다!\n📌 참가 신청 링크 https://walla.my/v/9nveVS1PTsbw2l0RyYA1\n※ 각 연수별 선착순 70명\n📌 홍보 포스터 https://www.miricanvas.com/v2/ko/design2/v/e0d99230-cf01-423d-a8be-3feb359cad3…", "attachments": [{"name": "png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=276333&no=1"}, {"name": "png (1 MBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=276333&no=2"}], "deadline": null, ll, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=276318"}, {"seq": 276315, "cat": "event", "title": "[기초과학 전문가 초청 대중강연] 왜 이야기를 즐기는가? 스토리텔링의 진화생물학(6/20))@제주문학관", "author": "제주대학교 기초과학연구소", "date": "2026-06-04", "views": 9479, "pinned": false, "posted": "2026-06-04 09:38", "excerpt": "제주대학교 기초과학연구소입니다.\n2026 기초과학 전문가 초청 대중강연을 아래와 같이 안내드립니다.\n인간은 왜 이야기에 끌리고, 왜 이야기를 즐기며 살아가는 걸까요?\n이번 강연에서는 진화생물학의 시선으로 스토리텔링의 놀라운 기원과 그 속에 담긴 의미를 함께 살펴봅니다.\n*주제: 왜 이야기를 즐기는가? 스토리텔링의 진화생물학\n*연사: 전중환 교수(경희대학교 후마니타스칼리지)\n*일시: 2026. 6. 20.(토) 14:00 ~ 16:00\n*장소: 제주문학관(제주시 연북로 339)\n*대상: 관심 있는 누구나\n*참가 신청방법: 네이버 폼 QR코드 신청\n- 네이버 폼 : https://naver.me/xqbvKCUm\n(링크가 열리지 않을 경우, 링크 주소를 복사한 뒤 인터넷 주소창에 붙여넣어 접속해 주세요!)\n*문의: 064-754-8308(제주대학교 기초과학연구소)\n자세한 사항은 포스터를 참고해 주시기 바라며, 많은 관심과 참여 부탁드립니다.\n※전체 일정 포스터를 참고하여 관심 있는 강연 …", "attachments": [{"name": "대중강연 포스터.png (848 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=276315&no=1"}, {"name": "2026 대중강연 전체 일정 포스터(최종).png (487 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=200&seq=276315&no=2"}], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": "관심 있는 누구나", "benefit": null, "how": "네이버 폼 QR코드 신청", "contact": "064-754-8308(제주대학교 기초과학연구소)", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=200&act=view&seq=276315"}, {"seq": 276274, "cat": "event", "title": "제12회 정남진 강변음악축제 개최 안내", "author": "대학본부", "date": "2026-06-02", "views": 9591, "pinned": false, "posted": "2026-06-02 17:54", "excerpt": "", "attachments": [], "deadline": null, "org": null, "opp": {"category": "행사", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https attachments": [{"name": "붙임2. 제6회 대학연합 Co-PBL 신청서(서식).hwp (87 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=203&seq=276189&no=2"}], "deadline": "2026-06-12", "org": null, "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": "포털 → 경력관리 → 비교과프로그램 신청(첨부된 신청서를 작성해서 신청해 주세요. ^^)", "contact": "교수학습지원센터 ☎ 064-754-2677", "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=203&act=view&seq=276189"}, {"seq": 276188, "cat": "volunteer", "title": "(제주대학교병원 정신건강의학과) 자원봉사자 모집 안내", "author": "학생복지과(학생)", "date": "2026-06-01", "views": 8600, "pinned": false, "posted": "2026-06-01 17:19", "excerpt": "제주대학교병원 정신건강의학과 자원봉사자 모집 안내\n저희 제주대학교병원 정신건강의학과에서는 자원봉사자를 모집하고 있습니다.\n정신적인 어려움을 경험하고 계신 분들의 치료 및 사회 적응을 돕기 위한 활동에 도움을 주실 분들을 찾고 있으니 여러분들의 많은 관심과 참여 부탁드립니다.\n구분\n모집 대상\n활동 내용\n시간\n인원\n비고\n전문\n자원봉사자\n관련 자격 소지자\n대학원 재학 및 졸업\n예술치료, 운동, 요리 등\n매주 주1회\n00명\n3개월 이상 봉사활동 유지 가능자\n서식(신청서) 다운로드, 작성 후 신청 부탁드립니다.\n이메일(tmanne@naver.com)\n문의처 064-717-1857\n보조\n자원봉사자\n사회복지 전공자\n언어재활사 전공자\n아동학 전공자\n간호학 전공자\n프로그램 보조\n(성인 낮병원)\n성인 낮병원\n월, 화, 목, 금\n09:30~15:30\n00명\n* 혜택\n1) 본원에서 실시하는 정신건강사회복지사 수련과정 선발 우대\n2) 사회복지 전공자 정신건강실무 슈퍼비젼 및 자원봉사자 교육(정신건강관련) …", "attachments": [{"name": "26년도 제주대학교병원 정신건강의학과 자원봉사자 모집 안내(제주대학교).hwp (85 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=276188&no=1"}, {"name": "정신건강의학과_자원봉사_신청서_및_동의서_2026.docx (19 KBytes)", "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?act=download&category=197&seq=276188&no=2"}], "deadline": null, "org": "제주대학교병원 정신건강의학과", "opp": {"category": "비교과", "grades": "전체", "colleges": "전체", "who": null, "benefit": null, "how": null, "contact": null, "always": false}, "closed": false, "url": "https://www.jejunu.ac.kr/ara/noticesurvey/outEvent.htm?category=197&act=view&seq=276188"}, {"seq": 276173, "cat": "scholarship", "title": "[마감][법학전문대학원 법학과사
