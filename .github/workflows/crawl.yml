name: 공지 수집

# 제주대 서버가 GitHub Actions(해외 IP) 접속을 거부하므로 정기 수집은 한국 클라우드 서버(server/run.sh)가 맡는다.
# 이 워크플로는 수동 실행 전용 (뉴스·날씨만 급히 갱신할 때 등).
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "카테고리당 확인할 최대 페이지 수"
        default: "3"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
        # 학교 서버 접속이 실패해도 뉴스·날씨는 커밋하고, 마지막 단계에서 실패로 표시
        run: python scraper/crawl.py || echo "SCHOOL_FAIL=1" >> "$GITHUB_ENV"

      - name: 변경 사항 커밋
        run: |
          # updated_at 한 줄만 바뀐 경우는 커밋하지 않음
          if git diff --quiet -I '"updated_at"' -- docs/data; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: 공지 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - name: 학교 서버 접속 확인
        if: env.SCHOOL_FAIL == '1'
        run: |
          echo "::error::제주대 서버가 GitHub Actions 접속을 거부했습니다. 공지가 갱신되지 않았습니다."
          exit 1
