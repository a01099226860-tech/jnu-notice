name: 공지 수집

on:
  schedule:
    # 매시 17분 (UTC 기준이지만 매시간이라 상관없음)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "카테고리당 확인할 최대 페이지 수"
        default: "3"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
        run: python scraper/crawl.py

      - name: 변경 사항 커밋
        run: |
          # updated_at 한 줄만 바뀐 경우는 커밋하지 않음
          if git diff --quiet -I '"updated_at"' -- docs/data; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: 공지 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
