name: 공지 수집

# 30분마다 자동 실행 + 필요하면 Actions 탭 → "공지 수집" → Run workflow 로 수동 실행
# 제주대 서버가 GitHub 서버 접속을 막으면 마지막 단계가 실패로 표시된다 (GitHub 이 메일로 알림).
# 그때는 한국 IP 인 PC 에서 update.bat 를 실행하면 된다.
on:
  schedule:
    # 정각은 GitHub 전체가 붐벼 지연되기 쉬워 7분·37분에 실행 (UTC 기준이지만 30분 간격이라 무관)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "카테고리당 확인할 최대 페이지 수"
        default: "3"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          # 뉴스는 자동 실행 땐 6시간에 한 번, 수동 실행 땐 항상 새로 받음
          FORCE_NEWS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        # 학교 서버 접속이 실패해도 뉴스·날씨는 커밋하고, 마지막 단계에서 실패로 표시
        run: python scraper/crawl.py || echo "SCHOOL_FAIL=1" >> "$GITHUB_ENV"

      - name: 변경 사항 커밋
        run: |
          # updated_at 한 줄만 바뀐 경우는 커밋하지 않음
          if git diff --quiet -I '"updated_at"' -- docs/data; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: 공지 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - name: 학교 서버 접속 확인
        if: env.SCHOOL_FAIL == '1'
        run: |
          echo "::error::제주대 서버가 GitHub Actions 접속을 거부했습니다. 공지가 갱신되지 않았습니다. 잠시 후 다시 실행하거나 PC 에서 update.bat 를 실행하세요."
          exit 1
